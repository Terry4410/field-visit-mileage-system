<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#17324d" />
  <title>外訪行程與里程管理系統 - Prototype v2.0</title>
  <style>
    :root{
      --bg:#f4f7fa;
      --card:#ffffff;
      --ink:#1f2937;
      --muted:#667085;
      --line:#dce3ea;
      --primary:#17324d;
      --primary-2:#24577a;
      --accent:#e9f1f7;
      --ok:#287a4b;
      --warn:#9a6700;
      --danger:#b42318;
      --shadow:0 10px 30px rgba(31,41,55,.08);
      --radius:18px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    .app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}
    .sidebar{
      background:var(--primary);color:#fff;padding:24px 18px;position:sticky;top:0;height:100vh;
      display:flex;flex-direction:column;gap:20px
    }
    .brand{font-size:20px;font-weight:800;line-height:1.35}
    .brand small{display:block;font-size:12px;font-weight:500;opacity:.7;margin-top:4px}
    .role-box{background:rgba(255,255,255,.1);padding:12px;border-radius:14px}
    .role-box label{display:block;font-size:12px;opacity:.8;margin-bottom:6px}
    .role-box select{width:100%;padding:10px;border:0;border-radius:10px}
    .nav{display:flex;flex-direction:column;gap:8px}
    .nav button{
      border:0;background:transparent;color:#fff;text-align:left;padding:12px 14px;border-radius:12px;
      display:flex;align-items:center;gap:10px
    }
    .nav button.active,.nav button:hover{background:rgba(255,255,255,.14)}
    .sidebar-footer{margin-top:auto;font-size:12px;opacity:.7}
    .main{min-width:0}
    .topbar{
      position:sticky;top:0;z-index:10;background:rgba(244,247,250,.92);backdrop-filter:blur(12px);
      padding:18px 28px;border-bottom:1px solid rgba(220,227,234,.8);
      display:flex;align-items:center;justify-content:space-between;gap:16px
    }
    .topbar h1{font-size:24px;margin:0}
    .user-chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:14px}
    .content{padding:24px 28px 100px;max-width:1400px;margin:auto}
    .grid{display:grid;gap:18px}
    .grid.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
    .grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
    .stat{padding:18px}
    .stat .label{color:var(--muted);font-size:13px}
    .stat .value{font-size:28px;font-weight:800;margin-top:6px}
    .stat .hint{font-size:12px;color:var(--muted);margin-top:6px}
    .section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
    .section-title h2{font-size:18px;margin:0}
    .btn{
      border:0;border-radius:12px;padding:10px 14px;font-weight:700;
      background:var(--primary);color:white
    }
    .btn.secondary{background:#eef3f7;color:var(--primary)}
    .btn.outline{background:white;color:var(--primary);border:1px solid var(--line)}
    .btn.danger{background:var(--danger)}
    .btn.ok{background:var(--ok)}
    .btn.small{padding:8px 10px;font-size:13px}
    .btn:disabled{opacity:.45;cursor:not-allowed}
    .field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
    .field label{font-size:13px;font-weight:700}
    .field input,.field select,.field textarea{
      width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)
    }
    .field textarea{min-height:90px;resize:vertical}
    .route-list{display:flex;flex-direction:column;gap:10px}
    .route-item{
      display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:12px;
      border:1px solid var(--line);border-radius:14px;padding:12px;background:#fbfcfd
    }
    .route-index{width:32px;height:32px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-weight:800;color:var(--primary)}
    .route-name{font-weight:800}
    .route-address{color:var(--muted);font-size:12px;margin-top:3px}
    .drag-controls{display:flex;gap:6px}
    .drag-controls button{width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:9px}
    .timeline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .pill{padding:7px 10px;border-radius:999px;background:#eef3f7;color:var(--primary);font-size:12px;font-weight:800}
    .pill.ok{background:#e8f5ed;color:var(--ok)}
    .pill.warn{background:#fff3d6;color:var(--warn)}
    .pill.danger{background:#feeceb;color:var(--danger)}
    table{width:100%;border-collapse:collapse}
    th,td{padding:12px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;vertical-align:top}
    th{color:var(--muted);font-size:12px;background:#fafbfc}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}
    .actions{display:flex;gap:8px;flex-wrap:wrap}
    .mobile-tabs{display:none}
    .toast{
      position:fixed;right:24px;bottom:24px;background:#172b3a;color:white;padding:12px 16px;border-radius:12px;
      box-shadow:var(--shadow);opacity:0;transform:translateY(10px);pointer-events:none;transition:.25s;z-index:99
    }
    .toast.show{opacity:1;transform:translateY(0)}
    .modal{
      position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:80
    }
    .modal.show{display:flex}
    .modal-panel{background:white;border-radius:20px;padding:22px;max-width:520px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.25)}
    .modal-panel h3{margin-top:0}
    .login-screen{
      min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#17324d,#285f82)
    }
    .login-card{background:white;border-radius:22px;padding:26px;max-width:430px;width:100%;box-shadow:0 30px 90px rgba(0,0,0,.25)}
    .login-card h1{margin:0 0 6px;font-size:25px}
    .login-card p{color:var(--muted);margin-top:0}
    .demo-users{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
    .demo-users button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;font-size:12px}
    .screen{display:none}
    .screen.active{display:block}
    .empty{padding:30px;text-align:center;color:var(--muted)}
    .progress{height:10px;background:#e8edf2;border-radius:999px;overflow:hidden}
    .progress > div{height:100%;background:var(--primary-2);width:0;transition:width .4s}
    .note{padding:12px 14px;border-left:4px solid var(--primary-2);background:#eef5f9;border-radius:10px;font-size:13px;color:#365264}
    @media (max-width: 980px){
      .grid.cols-4{grid-template-columns:repeat(2,minmax(0,1fr))}
      .grid.cols-3{grid-template-columns:1fr}
      .grid.cols-2{grid-template-columns:1fr}
      .app{grid-template-columns:1fr}
      .sidebar{display:none}
      .topbar{padding:14px 16px}
      .topbar h1{font-size:20px}
      .content{padding:16px 14px 92px}
      .mobile-tabs{
        display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));position:fixed;bottom:0;left:0;right:0;z-index:40;
        background:white;border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom))
      }
      .mobile-tabs button{border:0;background:transparent;color:var(--muted);font-size:11px;padding:6px 2px}
      .mobile-tabs button.active{color:var(--primary);font-weight:800}
      .route-item{grid-template-columns:34px 1fr}
      .drag-controls{grid-column:2}
      .card{padding:16px;border-radius:16px}
      th,td{white-space:nowrap}
      .user-chip{display:none}
    }
    @media (max-width: 600px){
      .grid.cols-4{grid-template-columns:1fr 1fr}
      .stat .value{font-size:23px}
      .demo-users{grid-template-columns:1fr}
      .actions .btn{flex:1}
    }
  </style>
</head>
<body>

<div id="login" class="login-screen">
  <div class="login-card">
    <h1>外訪行程與里程管理</h1>
    <p>Local Prototype｜帳號密碼與角色切換示意</p>
    <div class="field">
      <label>帳號</label>
      <input id="loginAccount" value="visitor01" />
    </div>
    <div class="field">
      <label>密碼</label>
      <input id="loginPassword" type="password" value="123456" />
    </div>
    <button class="btn" style="width:100%" onclick="login()">登入</button>
    <div class="demo-users">
      <button onclick="fillLogin('visitor01','外訪員')">外訪員示範</button>
      <button onclick="fillLogin('leader01','小組長')">小組長示範</button>
      <button onclick="fillLogin('admin01','管理者')">管理者示範</button>
      <button onclick="fillLogin('gov01','督導')">督導示範</button>
    </div>
    <div class="note">此為功能模擬檔，不會連線資料庫，也不會真正呼叫 Google Maps API。</div>
  </div>
</div>

<div id="app" class="app" style="display:none">
  <aside class="sidebar">
    <div class="brand">外訪行程管理<small>Field Visit Mileage System</small></div>
    <div class="role-box">
      <label>目前角色</label>
      <select id="roleSelect" onchange="switchRole(this.value)">
        <option value="visitor">外訪員</option>
        <option value="leader">小組長</option>
        <option value="admin">管理者</option>
        <option value="government">督導</option>
      </select>
    </div>
    <div id="sideNav" class="nav"></div>
    <div class="sidebar-footer">Prototype v2.0 Functional<br>Responsive Web App Demo</div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="pageTitle">今日行程</h1>
        <div style="color:var(--muted);font-size:13px;margin-top:4px">手機優先介面｜可事後補登</div>
      </div>
      <div class="user-chip"><span id="currentUser">王小明｜外訪員</span>　<button class="btn small secondary" onclick="logout()">登出</button></div>
    </header>
    <section class="content">
      <div id="visitor-home" class="screen"></div>
      <div id="visitor-history" class="screen"></div>
      <div id="leader-dashboard" class="screen"></div>
      <div id="leader-review" class="screen"></div>
      <div id="leader-locations" class="screen"></div>
      <div id="admin-dashboard" class="screen"></div>
      <div id="admin-users" class="screen"></div>
      <div id="admin-projects" class="screen"></div>
      <div id="admin-rates" class="screen"></div>
      <div id="admin-reports" class="screen"></div>
      <div id="gov-dashboard" class="screen"></div>
      <div id="gov-location" class="screen"></div>
      <div id="gov-visitor" class="screen"></div>
      <div id="gov-reports" class="screen"></div>
    </section>
  </main>

  <nav id="mobileTabs" class="mobile-tabs"></nav>
</div>

<div id="toast" class="toast"></div>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-panel">
    <div id="modalContent"></div>
  </div>
</div>

function getMileageRate(date){
  const applicable=subsidyRates
    .filter(r=>r.effectiveDate<=date)
    .sort((a,b)=>b.effectiveDate.localeCompare(a.effectiveDate));
  return applicable.length?Number(applicable[0].rate):0;
}
function getSubsidyAmount(mileage,date){
  const km=Number(mileage);
  return Number.isFinite(km)?Math.round(km*getMileageRate(date)*100)/100:0;
}
function money(value){
  return Number(value||0).toLocaleString('zh-TW',{minimumFractionDigits:0,maximumFractionDigits:2});
}

function timeToMinutes(t){
  if(!t||!t.includes(':'))return null;
  const [h,m]=t.split(':').map(Number);
  return h*60+m;
}
function detectTimeOverlap(){
  timeOverlapMessage='';
  const start=timeToMinutes(tripStartTime),end=timeToMinutes(tripEndTime);
  if(start===null||end===null)return '';
  if(end<=start){
    timeOverlapMessage='結束時間必須晚於出發時間，請確認輸入是否正確。';
    return timeOverlapMessage;
  }
  const overlaps=visitorHistoryData.filter(h=>{
    if(h.date!==selectedDate)return false;
    const hs=timeToMinutes(h.start),he=timeToMinutes(h.end);
    return start<he && end>hs;
  });
  if(overlaps.length){
    const h=overlaps[0];
    timeOverlapMessage=`此時間與 ${h.date} 已有紀錄 ${h.start}–${h.end} 重疊，請確認是否輸入正確。`;
  }
  return timeOverlapMessage;
}
function updateTripBasic(field,value){
  if(field==='date')selectedDate=value;
  if(field==='start')tripStartTime=value;
  if(field==='end')tripEndTime=value;
  const warning=detectTimeOverlap();
  renderVisitorHome();
  if(warning)showToast('偵測到時間重疊，請確認');
}

function moveStop(index,delta){
  const target=index+delta;
  if(target<0||target>=routeStops.length)return;
  [routeStops[index],routeStops[target]]=[routeStops[target],routeStops[index]];
  mileageCalculated=false;
  renderVisitorHome();
}

function removeStop(index){
  if(routeStops.length<=2){showToast('至少需保留兩個公務地點');return;}
  routeStops.splice(index,1);
  mileageCalculated=false;
  renderVisitorHome();
}

function initializeLocationFilters(){
  document.getElementById('locGroup').innerHTML=optionHtml(uniqueValues(locations,'group'),'全部小組');
  document.getElementById('locCity').innerHTML=optionHtml(uniqueValues(locations,'city'),'全部縣市');
  document.getElementById('locDistrict').innerHTML=optionHtml(uniqueValues(locations,'district'),'全部鄉鎮／區');
  document.getElementById('locCustomer').innerHTML=optionHtml(uniqueValues(locations,'name'),'全部客戶');
  renderLocationResults();
}

function getLocationFilterValues(){
  return {
    group:document.getElementById('locGroup')?.value||'',
    city:document.getElementById('locCity')?.value||'',
    district:document.getElementById('locDistrict')?.value||'',
    customer:document.getElementById('locCustomer')?.value||'',
    keyword:(document.getElementById('locKeyword')?.value||'').trim().toLowerCase()
  };
}

function refreshLocationFilters(changed){
  const f=getLocationFilterValues();
  let pool=locations.filter(x=>(!f.group||x.group===f.group));
  const cities=uniqueValues(pool,'city');
  const citySel=document.getElementById('locCity');
  if(changed==='group' && f.city && !cities.includes(f.city)) citySel.value='';
  citySel.innerHTML=optionHtml(cities,'全部縣市');
  if(cities.includes(f.city)) citySel.value=f.city;

  const cityValue=citySel.value;
  pool=pool.filter(x=>(!cityValue||x.city===cityValue));
  const districts=uniqueValues(pool,'district');
  const districtSel=document.getElementById('locDistrict');
  if((changed==='group'||changed==='city') && f.district && !districts.includes(f.district)) districtSel.value='';
  districtSel.innerHTML=optionHtml(districts,'全部鄉鎮／區');
  if(districts.includes(f.district)) districtSel.value=f.district;

  const districtValue=districtSel.value;
  pool=pool.filter(x=>(!districtValue||x.district===districtValue));
  const customers=uniqueValues(pool,'name');
  const customerSel=document.getElementById('locCustomer');
  customerSel.innerHTML=optionHtml(customers,'全部客戶');
  if(customers.includes(f.customer)) customerSel.value=f.customer;
  renderLocationResults();
}

function renderLocationResults(){
  const f=getLocationFilterValues();
  const results=locations.filter(x=>{
    const haystack=[x.group,x.city,x.district,x.name,x.address].join(' ').toLowerCase();
    return (!f.group||x.group===f.group) && (!f.city||x.city===f.city) && (!f.district||x.district===f.district) && (!f.customer||x.name===f.customer) && (!f.keyword||haystack.includes(f.keyword));
  });
  const count=document.getElementById('locResultCount');
  const box=document.getElementById('locResults');
  if(count) count.textContent=`${results.length} 筆`;
  if(!box) return;
  box.innerHTML=results.length?results.map(x=>{
    const i=locations.indexOf(x);
    return `<button class="btn outline" style="width:100%;margin:6px 0;text-align:left;padding:12px" onclick="addExisting(${i})"><strong>${x.name}</strong><br><small>${x.group} › ${x.city} › ${x.district}</small><br><small>${x.address}</small></button>`;
  }).join(''):`<div class="empty">找不到符合條件的客戶，請調整階層條件或關鍵字。</div>`;
}

function resetLocationFilters(){
  ['locGroup','locCity','locDistrict','locCustomer'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});
  const k=document.getElementById('locKeyword');if(k)k.value='';
  initializeLocationFilters();
}

function addExisting(i){
  const item=locations[i];
  if(routeStops.some(x=>x.name===item.name&&x.address===item.address)){showToast('此客戶已在行程中');return;}
  routeStops.push(item);mileageCalculated=false;renderVisitorHome();showToast('已加入 '+item.name);

  const warning=detectTimeOverlap();
  showModal(`<h3>確認送出</h3>
    ${warning?`<div class="note" style="border-left-color:var(--danger);background:#feeceb;color:var(--danger);margin-bottom:12px"><strong>時間提醒：</strong>${warning}<br>若確認時間無誤，仍可繼續送出。</div>`:''}

    <div class="actions"><button class="btn ok" onclick="confirmSubmit()">確認送出</button><button class="btn secondary" onclick="closeModal()">取消</button></div>`);

function confirmSubmit(){
  const input=document.getElementById('selfMileageInput');
  if(input) selfMileage=input.value;
  if(!selfMileage || Number(selfMileage)<=0){closeModal();showToast('請先填寫自行計算里程');return;}
  closeModal();showToast('行程已送出，等待小組長批次計算 Google 里程');
}

function getVisitorHistoryFilteredRows(){
  const start=document.getElementById('historyStart')?.value||'0000-01-01';
  const end=document.getElementById('historyEnd')?.value||'9999-12-31';
  const loc=document.getElementById('historyLocation')?.value||'';
  const status=document.getElementById('historyStatus')?.value||'';
  return visitorHistoryData.filter(x=>x.date>=start&&x.date<=end&&(!loc||x.locations.includes(loc))&&(!status||x.status===status));
}
function runVisitorHistoryQuery(){
  const rows=getVisitorHistoryFilteredRows();
  const box=document.getElementById('visitorHistoryResult');
  if(!box)return;
  box.innerHTML=rows.length?`<div class="table-wrap"><table>
    <thead><tr><th>日期</th><th>地點</th><th>出發</th><th>結束</th><th>核定里程</th><th>每公里補助</th><th>補助金額</th><th>狀態</th><th>操作</th></tr></thead>

function toggleBatchDateRange(){
  const area=document.getElementById('batchDateRange');
  if(area)area.style.display=document.getElementById('batchCalcMode').value==='range'?'grid':'none';
}
function getBatchTargetIndices(source){
  if(source==='selected'){
    return [...document.querySelectorAll('.review-check:checked')].map(x=>Number(x.dataset.index));
  }
  const mode=document.getElementById('batchCalcMode')?.value||'all';
  const start=document.getElementById('batchStart')?.value||'0000-01-01';
  const end=document.getElementById('batchEnd')?.value||'9999-12-31';
  return reviewTrips.map((x,i)=>({x,i})).filter(({x})=>{
    if(x.googleMileage!=null)return false;
    if(mode==='range'&&(x.date<start||x.date>end))return false;
    return true;
  }).map(x=>x.i);
}
function runBatch(source='dashboard'){
  const targets=getBatchTargetIndices(source);
  const eligible=targets.filter(i=>!reviewTrips[i].status.includes('地址'));
  const invalid=targets.filter(i=>reviewTrips[i].status.includes('地址'));
  if(!targets.length){showToast('目前沒有符合條件的待計算行程');return;}
  const bar=document.getElementById('batchProgress');
  const status=document.getElementById('batchStatus');
  if(bar)bar.style.width='0%';
  if(status)status.textContent=`準備處理 ${targets.length} 筆行程…`;
  let p=0;
  const timer=setInterval(()=>{
    p+=20;if(bar)bar.style.width=Math.min(p,100)+'%';
    if(status)status.textContent=`正在計算… ${Math.min(p,100)}%`;
    if(p>=100){
      clearInterval(timer);
      eligible.forEach(i=>{
        const t=reviewTrips[i];
        t.googleMileage=Math.round(t.selfMileage*0.965*10)/10;
        t.reviewMileage=t.googleMileage;
        t.status='待核准';
        t.checked=true;
      });
      mileageCalculated=true;
      const msg=`完成：${eligible.length} 筆成功、${invalid.length} 筆地址待確認`;
      if(status)status.textContent=msg;
      const pendingEl=document.getElementById('pendingMileageCount');
      if(pendingEl)pendingEl.textContent=reviewTrips.filter(x=>x.googleMileage==null).length;
      auditLogs.unshift({time:new Date().toLocaleString('zh-TW'),user:'林組長',action:'批次里程計算',detail:msg});
      showToast(msg);
      if(currentScreen==='leader-review')renderLeaderReview();
    }
  },220);
}

function updateReviewMileage(i,value){
  reviewTrips[i].reviewMileage=Number(value);
  const cell=document.getElementById(`subsidy-${i}`);
  if(cell)cell.textContent='$'+money(getSubsidyAmount(reviewTrips[i].reviewMileage,reviewTrips[i].date));
}
function runSingleMileage(i){
  const t=reviewTrips[i];
  if(t.status.includes('地址')){showToast('請先完成地址確認');return;}
  if(t.googleMileage==null){
    t.googleMileage=Math.round(t.selfMileage*0.965*10)/10;
    t.reviewMileage=t.googleMileage;
    t.status='待核准';
    t.checked=true;
  }
  auditLogs.unshift({time:new Date().toLocaleString('zh-TW'),user:'林組長',action:'單筆里程計算',detail:`${t.visitor} ${t.date}：${t.googleMileage} km`});
  renderLeaderReview();
  showToast(`已完成 ${t.visitor} 的里程計算`);
}
function toggleReviewSelection(checked){
  reviewTrips.forEach(t=>{t.checked=checked;});
  renderLeaderReview();
}
function approveTrip(i){
  const t=reviewTrips[i];
  if(t.googleMileage==null){showToast('Google 里程尚未計算，暫不可核准');return;}
  t.status='已核准';t.checked=false;
  auditLogs.unshift({time:new Date().toLocaleString('zh-TW'),user:'林組長',action:'核准行程',detail:`${t.visitor} ${t.date}，審核里程 ${t.reviewMileage} km，補助 $${money(getSubsidyAmount(t.reviewMileage,t.date))}`});
  renderLeaderReview();showToast(`已核准 ${t.visitor} 行程`);
}
function returnTrip(i){
  const t=reviewTrips[i];
  showModal(`<h3>退回行程</h3><p>${t.visitor}｜${t.date}</p>

function confirmReturnTrip(i){
  reviewTrips[i].status='已退回';reviewTrips[i].checked=false;
  auditLogs.unshift({time:new Date().toLocaleString('zh-TW'),user:'林組長',action:'退回行程',detail:`${reviewTrips[i].visitor}：${document.getElementById('returnReason').value}`});
  closeModal();renderLeaderReview();showToast('行程已退回');

function batchApprove(){
  const selected=[...document.querySelectorAll('.review-check:checked')].map(x=>Number(x.dataset.index));
  const eligible=selected.filter(i=>reviewTrips[i].googleMileage!=null&&!reviewTrips[i].status.includes('地址'));
  if(!eligible.length){showToast('勾選資料中沒有可核准的行程');return;}
  eligible.forEach(i=>{reviewTrips[i].status='已核准';reviewTrips[i].checked=false;});
  auditLogs.unshift({time:new Date().toLocaleString('zh-TW'),user:'林組長',action:'批次核准',detail:`核准 ${eligible.length} 筆行程`});
  renderLeaderReview();showToast(`已批次核准 ${eligible.length} 筆行程`);
}

function runPendingLocationQuery(){
  const rows=getPendingLocationRows();
  const box=document.getElementById('pendingLocationResults');
  if(!box)return;
  box.innerHTML=rows.length?`<div class="table-wrap"><table>
    <thead><tr><th>選取</th><th>新增日期</th><th>地點</th><th>地址／Plus Code</th><th>解析狀態</th><th>操作</th></tr></thead>
    <tbody>${rows.map(({x,i})=>`<tr>
      <td><input class="pending-location-check" data-index="${i}" type="checkbox" checked></td>
      <td>${x.date}</td><td>${x.name}</td><td>${x.address||x.plusCode||'—'}</td>
      <td><span class="pill ${x.lat&&x.lng?'ok':'danger'}">${x.lat&&x.lng?'已取得經緯度':'地址待確認'}</span></td>
      <td><button class="btn small outline" onclick="openLocationMaintenance(${i})">${x.lat&&x.lng?'維護':'維護／Plus Code'}</button></td>
    </tr>`).join('')}</tbody></table></div>`:`<div class="empty">此條件下沒有尚未上傳的地點。</div>`;
}
function selectAllPendingLocations(checked){
  document.querySelectorAll('.pending-location-check').forEach(x=>x.checked=checked);
}
function batchPublishLocations(){
  const selected=[...document.querySelectorAll('.pending-location-check:checked')].map(x=>Number(x.dataset.index));
  if(!selected.length){showToast('請先選擇要上傳的地點');return;}
  let success=0,failed=0;
  selected.forEach(i=>{
    const p=pendingLocations[i];
    if(!p.lat||!p.lng){failed++;return;}
    if(!locations.some(x=>x.name===p.name&&x.address===p.address)){
      locations.push({group:p.group,city:p.city,district:p.district,name:p.name,address:p.address||p.plusCode});
    }
    p.published=true;success++;
  });
  auditLogs.unshift({time:new Date().toLocaleString('zh-TW'),user:'林組長',action:'批次上傳新地點',detail:`成功 ${success} 筆、失敗 ${failed} 筆`});
  renderLeaderLocations();
  showToast(`批次上傳完成：${success} 筆成功、${failed} 筆需先修正地址`);
}
function previewLocationImport(rows,filename){
  const required=['小組','縣市','鄉鎮區','客戶名稱','地址'];
  const valid=rows.filter(r=>required.every(k=>r[k]));
  const invalid=rows.length-valid.length;
  document.getElementById('locationImportPreview').innerHTML=`<div class="note">檔案：${filename}<br>共 ${rows.length} 筆；可匯入 ${valid.length} 筆；異常 ${invalid} 筆。</div>
    <button class="btn ok" style="margin-top:10px" onclick='commitLocationImport(${JSON.stringify(valid)})'>確認匯入</button>`;
}
function commitLocationImport(rows){
  rows.forEach(r=>locations.push({group:r['小組'],city:r['縣市'],district:r['鄉鎮區'],name:r['客戶名稱'],address:r['地址']||r['Plus Code']}));
  renderLeaderLocations();showToast(`已匯入 ${rows.length} 筆地點`);
}

function openLocationMaintenance(index){
  const p=pendingLocations[index]||pendingLocations.find(x=>!x.published);
  if(!p)return;
  showModal(`
    <h3>維護地點位置</h3>
    <div class="field"><label>新增日期</label><input value="${p.date}" disabled></div>
    <div class="field"><label>地點名稱</label><input value="${p.name}" disabled></div>
    <div class="field"><label>完整地址</label><input id="maintAddress" value="${p.address||''}" placeholder="輸入完整門牌地址"></div>
    <div class="field"><label>Plus Code</label><input id="maintPlusCode" value="${p.plusCode||''}" placeholder="例如：2G7H+45 板橋區 新北市"></div>
    <div class="grid cols-2">
      <div class="field"><label>緯度</label><input id="maintLat" value="${p.lat||''}" placeholder="解析後自動帶入"></div>
      <div class="field"><label>經度</label><input id="maintLng" value="${p.lng||''}" placeholder="解析後自動帶入"></div>
    </div>
    <div class="note">可修正完整地址後解析；若沒有門牌，可輸入 Google Maps 顯示的 Plus Code。此原型僅模擬解析結果。</div>
    <input id="maintPendingIndex" type="hidden" value="${index}">
    <div class="actions" style="margin-top:16px">
      <button class="btn secondary" onclick="simulateResolveLocation()">解析地址／Plus Code</button>
      <button class="btn ok" onclick="saveResolvedLocation()">儲存位置</button>
      <button class="btn outline" onclick="closeModal()">取消</button>
    </div>`);
}
function simulateResolveLocation(){
  const address=document.getElementById('maintAddress').value.trim();
  const plus=document.getElementById('maintPlusCode').value.trim();
  if(!address&&!plus){showToast('請輸入完整地址或 Plus Code');return;}
  if(address.includes('XX')&&!plus){showToast('地址仍不完整，請補完整地址或輸入 Plus Code');return;}
  document.getElementById('maintLat').value='25.011245';
  document.getElementById('maintLng').value='121.461882';
  showToast(plus?'已由 Plus Code 取得經緯度':'已由地址取得經緯度');
}
function saveResolvedLocation(){
  const index=Number(document.getElementById('maintPendingIndex').value);
  const p=pendingLocations[index];
  const lat=document.getElementById('maintLat').value.trim();
  const lng=document.getElementById('maintLng').value.trim();
  if(!lat||!lng){showToast('請先解析並確認經緯度');return;}
  p.address=document.getElementById('maintAddress').value.trim();
  p.plusCode=document.getElementById('maintPlusCode').value.trim();
  p.lat=lat;p.lng=lng;
  closeModal();renderLeaderLocations();showToast('地點位置已儲存，可加入批次上傳');
}

function previewProjectImport(rows,filename){
  const valid=rows.filter(r=>r['專案名稱']&&r['歸屬小組']&&['清單','自行維護'].includes(r['地點模式']));
  document.getElementById('projectImportPreview').innerHTML=`<div class="note">${filename}：共 ${rows.length} 筆列，可處理 ${valid.length} 筆。</div><button class="btn ok" style="margin-top:10px" onclick='commitProjectImport(${JSON.stringify(valid)})'>確認匯入</button>`;
}
function commitProjectImport(rows){
  const grouped={};
  rows.forEach(r=>{
    const key=r['專案名稱']+'|'+r['歸屬小組'];
    grouped[key]??={name:r['專案名稱'],group:r['歸屬小組'],locationMode:r['地點模式'],locationNames:[],status:r['狀態']||'啟用'};
    if(r['專案地點名稱'])grouped[key].locationNames.push(r['專案地點名稱']);
  });
  Object.values(grouped).forEach(p=>{
    const existing=projects.find(x=>x.name===p.name&&x.group===p.group);
    if(existing)Object.assign(existing,p);else projects.push(p);
  });
  renderAdminProjects();showToast(`已匯入／更新 ${Object.keys(grouped).length} 個專案`);
}

  showModal(`<h3>新增專案</h3>

}

function openAddSubsidyRate(){
  showModal(`<h3>新增每公里補助費率</h3>
    <div class="field"><label>生效日期</label><input id="rateEffectiveDate" type="date"></div>
    <div class="field"><label>每公里補助金額（元）</label><input id="rateAmount" type="number" min="0" step="0.01" value="2.5"></div>

    <div class="actions"><button class="btn" onclick="saveSubsidyRate()">儲存</button><button class="btn outline" onclick="closeModal()">取消</button></div>`);
}
function saveSubsidyRate(){
  const date=document.getElementById('rateEffectiveDate').value;
  const rate=Number(document.getElementById('rateAmount').value);
  const note=document.getElementById('rateNote').value.trim();
  if(!date||!Number.isFinite(rate)||rate<0){showToast('請填寫正確的生效日期與補助金額');return;}
  if(subsidyRates.some(x=>x.effectiveDate===date)){showToast('此生效日期已存在費率，請改用編輯');return;}
  subsidyRates.push({id:'RATE-'+Date.now(),effectiveDate:date,rate,note});
  auditLogs.unshift({time:new Date().toLocaleString('zh-TW'),user:'系統管理員',action:'新增補助費率',detail:`${date} 起每公里 $${rate.toFixed(2)}`});

}

function updateSubsidyRate(id){
  const r=subsidyRates.find(x=>x.id===id);if(!r)return;
  const date=document.getElementById('editRateDate').value;

  if(!date||!Number.isFinite(rate)||rate<0){showToast('請填寫正確資料');return;}
  if(subsidyRates.some(x=>x.id!==id&&x.effectiveDate===date)){showToast('此生效日期已存在其他費率');return;}
  r.effectiveDate=date;r.rate=rate;r.note=document.getElementById('editRateNote').value.trim();

}

function escapeXml(value){
  return String(value??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function downloadBlob(filename,content,type='application/octet-stream'){
  const blob=new Blob([content],{type});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),500);
}
function downloadExcelXml(filename,sheetName,rows){
  const headers=rows.length?Object.keys(rows[0]):[];
  const headerCells=headers.map(h=>`<Cell><Data ss:Type="String">${escapeXml(h)}</Data></Cell>`).join('');
  const dataRows=rows.map(r=>`<Row>${headers.map(h=>{
    const v=r[h]??'';
    const type=typeof v==='number'?'Number':'String';
    return `<Cell><Data ss:Type="${type}">${escapeXml(v)}</Data></Cell>`;
  }).join('')}</Row>`).join('');
  const xml=`<?xml version="1.0"?>
  <?mso-application progid="Excel.Sheet"?>
  <Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"
   xmlns:o="urn:schemas-microsoft-com:office:office"
   xmlns:x="urn:schemas-microsoft-com:office:excel"
   xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">
   <Worksheet ss:Name="${escapeXml(sheetName)}"><Table><Row>${headerCells}</Row>${dataRows}</Table></Worksheet>
  </Workbook>`;
  downloadBlob(filename,xml,'application/vnd.ms-excel;charset=utf-8');
}

function parseCsv(text){
  const rows=[];let row=[],cell='',quoted=false;
  for(let i=0;i<text.length;i++){
    const c=text[i],n=text[i+1];
    if(c==='"'&&quoted&&n==='"'){cell+='"';i++;}
    else if(c==='"'){quoted=!quoted;}
    else if(c===','&&!quoted){row.push(cell);cell='';}
    else if((c==='\n'||c==='\r')&&!quoted){
      if(c==='\r'&&n==='\n')i++;
      row.push(cell);if(row.some(x=>x!==''))rows.push(row);row=[];cell='';
    }else cell+=c;
  }
  row.push(cell);if(row.some(x=>x!==''))rows.push(row);
  const headers=rows.shift()||[];
  return rows.map(r=>Object.fromEntries(headers.map((h,i)=>[h.trim(),(r[i]??'').trim()])));
}
function parseSpreadsheetXml(text){
  const doc=new DOMParser().parseFromString(text,'application/xml');
  const rowNodes=[...doc.getElementsByTagNameNS('*','Row')];
  const matrix=rowNodes.map(r=>[...r.getElementsByTagNameNS('*','Cell')].map(c=>{
    const d=c.getElementsByTagNameNS('*','Data')[0];return d?d.textContent:'';
  }));
  const headers=matrix.shift()||[];
  return matrix.map(r=>Object.fromEntries(headers.map((h,i)=>[h,(r[i]??'').trim()])));
}
function readImportFile(input,callback){
  const file=input.files?.[0];
  if(!file){showToast('請先選擇檔案');return;}
  const ext=file.name.split('.').pop().toLowerCase();
  if(!['csv','xls','xml'].includes(ext)){
    showToast('Local HTML 支援 CSV 或下載範例產生的 Excel 2003 XML（.xls）');
    return;
  }
  const reader=new FileReader();
  reader.onload=()=> {
    try{
      const rows=ext==='csv'?parseCsv(reader.result):parseSpreadsheetXml(reader.result);
      callback(rows,file.name);
    }catch(e){showToast('檔案格式無法讀取，請使用本頁下載的範例檔');}
  };
  reader.readAsText(file,'utf-8');
}
