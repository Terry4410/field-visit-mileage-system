openapi: 3.0.3
info:
  title: Field Visit Mileage System API
  version: 1.6.0
servers:
  - url: /api/v1
paths:
  /query/trips:
    get:
      summary: Unified trip query with role/data-scope and server pagination
  /query/trips/export.xlsx:
    get:
      summary: Export all rows matching the same unified query to Excel
  /query/trips/export.pdf:
    get:
      summary: Export all rows matching the same unified query to PDF
  /corrections:
    get: { summary: Query scoped correction requests }
    post: { summary: Visitor creates an Approved-trip correction request }
  /corrections/{id}/leader-review:
    post: { summary: Leader reviews a correction }
  /corrections/{id}/admin-close:
    post: { summary: Admin closes/rejects financial correction }
  /admin/users:
    get: { summary: Admin user/role/team-scope list }
  /admin/users/{userId}/access:
    put: { summary: Save roles and multiple team scopes }
  /managed-locations:
    get: { summary: Scoped location master }
    post: { summary: Create location master row }
  /managed-locations/{locationId}:
    put: { summary: Update location }
    delete: { summary: Admin deactivates location }
  /imports/{type}/template:
    get: { summary: Download locations/projects import template }
  /imports/{type}/preview:
    post: { summary: Stage and validate Excel import }
  /imports/{importBatchId}/errors.xlsx:
    get: { summary: Download staged import validation errors }
  /imports/{importBatchId}/confirm:
    post: { summary: Confirm a validated staged import }
  /jobs/mileage:
    post: { summary: Create mileage background job }
  /jobs/geocoding:
    post: { summary: Create location geocoding/publish background job }
  /jobs/{jobId}:
    get: { summary: Get background job progress }
  /dashboard:
    get: { summary: Role-scoped dashboard counts }
  /health/live:
    get: { summary: Liveness }
  /health/ready:
    get: { summary: Readiness including DB connectivity }
