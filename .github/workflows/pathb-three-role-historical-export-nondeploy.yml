name: Path B three-role historical XLSX PDF scope (NONDEPLOY)
on:
  push:
    branches: [fix/pathb-query-export-three-role-historical-20261124]
    paths:
      - '.github/workflows/pathb-three-role-historical-export-nondeploy.yml'
      - 'backend/src/FieldVisit.Api/G1ReportExportGuard.cs'
      - 'backend/src/FieldVisit.Infrastructure/V160FinalRepository.cs'
      - 'backend/tests/FieldVisit.Application.Tests/G1ReportExportHttpSqlTests.cs'
      - 'backend/tests/FieldVisit.Application.Tests/V180ThreeRoleHistoricalExportScopeTests.cs'
permissions:
  contents: read
concurrency:
  # Replace the earlier run stuck on unrelated font package installation.
  group: pathb-three-role-export-nondeploy
  cancel-in-progress: true
jobs:
  three-role-report:
    if: github.repository == 'Terry4410/field-visit-mileage-system' && github.ref == 'refs/heads/fix/pathb-query-export-three-role-historical-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 16
      - name: Guard exact accepted API source and only five changed paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          base='ab71aaa96d9ac259f66386555812448284527d15'
          subprocess.check_call(['git','merge-base','--is-ancestor',base,'HEAD'])
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          allowed={
            '.github/workflows/pathb-three-role-historical-export-nondeploy.yml',
            'backend/src/FieldVisit.Api/G1ReportExportGuard.cs',
            'backend/src/FieldVisit.Infrastructure/V160FinalRepository.cs',
            'backend/tests/FieldVisit.Application.Tests/G1ReportExportHttpSqlTests.cs',
            'backend/tests/FieldVisit.Application.Tests/V180ThreeRoleHistoricalExportScopeTests.cs'
          }
          assert changed==allowed, sorted(changed.symmetric_difference(allowed))
          print('THREE_ROLE_EXPORT_EXACT_ACCEPTED_SOURCE_AND_FIVE_FILE_DELTA=PASS')
          PY
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Respect existing PDF readability evidence; no apt modifications
        shell: bash
        run: |
          echo 'PDF font/layout previously validated by PathBQuery05PdfReadabilityTests; this run checks output validity and role security only'
      - name: Start isolated SQL Server 2022 (never company/Azure DB)
        shell: bash
        run: |
          set -euo pipefail
          pw="Aa7!$(openssl rand -hex 24)"
          echo "::add-mask::$pw"
          echo "E1_R1_REQUIRED=1" >> "$GITHUB_ENV"
          connection="Server=localhost,1433;Database=master;User Id=sa;Password=${pw};Encrypt=False;TrustServerCertificate=True;Connect Timeout=5"
          echo "::add-mask::$connection"
          echo "E1_R1_SQL_CONNECTION=$connection" >> "$GITHUB_ENV"
          docker run -d --name fieldvisit-three-role-export -p 127.0.0.1:1433:1433 \
            -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e "MSSQL_SA_PASSWORD=$pw" \
            mcr.microsoft.com/mssql/server:2022-latest >/dev/null
          for _ in $(seq 1 60); do
            if docker exec fieldvisit-three-role-export /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$pw" -C -l 3 -Q 'SELECT 1' >/dev/null 2>&1; then
              echo 'ISOLATED_REPORT_SQL_READY=PASS'
              exit 0
            fi
            sleep 2
          done
          echo 'ISOLATED_REPORT_SQL_READY=HOLD'; exit 1
      - name: Build exact limited test source
        shell: bash
        run: |
          set -euo pipefail
          dotnet build backend/tests/FieldVisit.Application.Tests/FieldVisit.Application.Tests.csproj -c Release --nologo
      - name: Real SQL HTTP and in-memory per-row scope positive negative tests
        shell: bash
        run: |
          set -euo pipefail
          dotnet test backend/tests/FieldVisit.Application.Tests/FieldVisit.Application.Tests.csproj \
            -c Release --no-build --no-restore \
            --filter 'FullyQualifiedName~G1ReportExportHttpSqlTests|FullyQualifiedName~V180ThreeRoleHistoricalExportScopeTests' \
            --logger 'console;verbosity=normal'
          echo 'THREE_ROLE_XLSX_PDF_HISTORICAL_SCOPED_TEST=PASS'
      - name: Remove disposable local SQL container
        if: always()
        shell: bash
        run: |
          docker rm -f fieldvisit-three-role-export >/dev/null 2>&1 || true
