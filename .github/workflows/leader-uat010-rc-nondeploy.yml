name: G1 Migration Deployment Preparation NONDEPLOY
on:
  push:
    branches: [work/g1-uat-migration-readiness-20261020]
    paths-ignore:
      - .github/workflows/g1-sql-lock-root-cause-diagnostic.yml
      - scripts/ci/g1_sql_lock_root_cause_diagnostic.ps1
permissions:
  contents: read
concurrency:
  group: g1-preparation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  isolated:
    if: github.repository == 'Terry4410/field-visit-mileage-system' && github.ref == 'refs/heads/work/g1-uat-migration-readiness-20261020' && !startsWith(github.event.head_commit.message, 'test(g1-preflight):') && !startsWith(github.event.head_commit.message, 'test(g1-u010-source):') && !startsWith(github.event.head_commit.message, 'test(g1-history):')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E1_R1_REQUIRED: '1'
      OPTIONC_EXECUTION_MODE: IsolatedSqlTest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Frozen RC and immutable SQL checks
        run: python3 scripts/ci/g1_migration_readiness.py verify
      - name: Ephemeral local SQL Server 2022 only
        run: python3 scripts/ci/g1_migration_readiness.py sql
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install pinned local SQL client module
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          try { Install-Module SqlServer -RequiredVersion 22.4.5.1 -Scope CurrentUser -Force -AllowClobber -Repository PSGallery -ErrorAction Stop | Out-Null }
          catch { Write-Output 'DisposableClient=STOP; Details=SUPPRESSED;'; exit 1 }
      - name: Verify deterministic fixed-target promotion source
        run: python3 scripts/ci/g1_promotion.py verify
      - name: Real SQL promotion boundary regression
        run: |
          mkdir -p artifacts
          python3 scripts/ci/g1_promotion.py test
      - name: Accepted writer assertions against the new promotion SQL
        run: python3 scripts/ci/g1_promotion.py compatibility
      - name: Bind sanitized promotion evidence
        run: python3 scripts/ci/g1_promotion.py finalize
      - name: Stop disposable provider
        if: always()
        run: docker rm -f g1-preparation-sql >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: g1-migration-preparation-${{ github.sha }}
          path: artifacts/
          retention-days: 7
  minimal-preflight:
    if: github.repository == 'Terry4410/field-visit-mileage-system' && github.ref == 'refs/heads/work/g1-uat-migration-readiness-20261020' && startsWith(github.event.head_commit.message, 'test(g1-preflight):')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve accepted delta and frozen source
        run: python3 scripts/ci/g1_preflight_verify.py check
      - name: Start local disposable SQL Server 2022
        run: python3 scripts/ci/g1_preflight_verify.py provider
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Existing pinned SQL client
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          try { Install-Module SqlServer -RequiredVersion 22.4.5.1 -Scope CurrentUser -Force -AllowClobber -Repository PSGallery -ErrorAction Stop | Out-Null }
          catch { Write-Output 'PreflightClient=STOP; Details=SUPPRESSED;'; exit 1 }
      - name: First STOP sanitized diagnosis only
        run: python3 scripts/ci/g1_preflight_verify.py diagnose
      - name: Stop local disposable SQL
        if: always()
        run: docker rm -f g1-preflight-sql >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g1-minimal-preflight-${{ github.sha }}
          path: |
            artifacts/preflight-sql.json
            artifacts/preflight-model.json
          if-no-files-found: warn
          retention-days: 7

  uat010-source-closure:
    if: github.repository == 'Terry4410/field-visit-mileage-system' && github.ref == 'refs/heads/work/g1-uat-migration-readiness-20261020' && startsWith(github.event.head_commit.message, 'test(g1-u010-source):')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact ancestor and offline source closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor b18ced16aec934dedc6dcb8cdc90b5679c0e6f68 HEAD
          python3 -m unittest -v scripts/ci/test_g1_uat010_source_gate.py
          python3 scripts/ci/g1_uat010_source_gate.py

  existing010-history:
    name: Focused synthetic 26-history compatibility NONDEPLOY
    if: github.repository == 'Terry4410/field-visit-mileage-system' && github.ref == 'refs/heads/work/g1-uat-migration-readiness-20261020' && startsWith(github.event.head_commit.message, 'test(g1-history):')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      E1_R1_REQUIRED: '1'
      OPTIONC_EXECUTION_MODE: IsolatedSqlTest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact branch and bounded source change
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 77f8c19d944ffbf66169be32453bba7dcf7eafb9 HEAD
          git diff --name-only 77f8c19d944ffbf66169be32453bba7dcf7eafb9 HEAD | sort > "$RUNNER_TEMP/actual"
          printf '%s\n' .github/workflows/leader-uat010-rc-nondeploy.yml scripts/ci/test_g1_promotion.ps1 > "$RUNNER_TEMP/expected"
          diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/actual"
          test -z "${UAT_SQL_CONNECTION:-}"
          test -z "${PRODUCTION_SQL_CONNECTION:-}"
      - name: Start local disposable SQL Server 2022 (history-only, independent source guard)
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 24)!G1a"
          connection="Server=localhost,1433;Database=master;User Id=sa;Password=${password};Encrypt=False;TrustServerCertificate=True;Connect Timeout=5;ConnectRetryCount=0"
          echo "::add-mask::$password"
          echo "::add-mask::$connection"
          envfile="$RUNNER_TEMP/g1-history-sql.env"
          umask 077
          printf 'ACCEPT_EULA=Y\nMSSQL_PID=Developer\nMSSQL_SA_PASSWORD=%s\n' "$password" > "$envfile"
          docker run -d --name g1-preparation-sql -p 127.0.0.1:1433:1433 --env-file "$envfile" mcr.microsoft.com/mssql/server:2022-latest >/dev/null
          rm -f "$envfile"
          ready=0
          for _ in $(seq 1 24); do
            if docker exec -e "SQLCMDPASSWORD=$password" g1-preparation-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -l 3 -Q 'SELECT 1' >/dev/null 2>&1; then ready=1; break; fi
            sleep 5
          done
          test "$ready" = 1
          printf 'E1_R1_SQL_CONNECTION=%s\n' "$connection" >> "$GITHUB_ENV"
          echo 'G1HistoryProvider=PASS; Target=LOCAL_SQL2022_ONLY;'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install existing pinned SQL client
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          try { Install-Module SqlServer -RequiredVersion 22.4.5.1 -Scope CurrentUser -Force -AllowClobber -Repository PSGallery -ErrorAction Stop | Out-Null }
          catch { Write-Output 'HistoryClient=STOP; Details=SUPPRESSED;'; exit 1 }
      - name: Verify unchanged promotion inputs
        run: python3 scripts/ci/g1_promotion.py verify
      - name: Four focused existing-010 historical tests
        shell: pwsh
        run: pwsh -NoProfile -File scripts/ci/test_g1_promotion.ps1 -Mode HistoryCompatibility
      - name: Remove isolated SQL provider
        if: always()
        run: docker rm -f g1-preparation-sql >/dev/null 2>&1 || true

