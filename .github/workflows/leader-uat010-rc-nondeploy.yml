name: G1 UAT Release Candidate NONDEPLOY
on:
  push:
    branches: [work/g1-uat-rc-integration-20261020]
permissions:
  contents: read
concurrency:
  group: leader-uat010-rc-${{ github.ref }}
  cancel-in-progress: false
jobs:
  isolated:
    if: github.repository == 'Terry4410/field-visit-mileage-system' && github.ref == 'refs/heads/work/g1-uat-rc-integration-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      LEADER_RC_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify semantic source closure and OFF boundaries
        run: |
          python3 scripts/ci/g1_rc_evidence.py verify
          python3 -m unittest scripts/ci/test_leader_rc_preflight.py scripts/ci/test_r6_schema_fidelity.py scripts/ci/test_g1_rc_evidence.py
      - name: Start isolated SQL Server 2022 with masked ephemeral fixture credentials
        run: python3 scripts/ci/g1_rc_evidence.py sql
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Exact frontend tests and build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: API build and complete tests
        run: |
          mkdir -p artifacts/test-results
          dotnet build backend/tests/FieldVisit.Application.Tests/FieldVisit.Application.Tests.csproj -c Release
          dotnet test backend/tests/FieldVisit.Application.Tests/FieldVisit.Application.Tests.csproj -c Release --no-build --logger 'trx;LogFileName=backend.trx' --results-directory artifacts/test-results
      - name: Worker real SQL 13-case evidence
        env:
          E1_R1_REQUIRED: '1'
          E1_R1_SQL_CONNECTION: ${{ env.LEADER_RC_SQL_CONNECTION }}
        run: |
          dotnet test backend/tests/FieldVisit.Application.Tests/FieldVisit.Application.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~Worker_sql_' --logger 'trx;LogFileName=worker-sql.trx' --results-directory artifacts/test-results
      - name: Required real HTTP SQL provider fallback canonical publication and export negatives
        env:
          OPTIONC_EXECUTION_MODE: IsolatedSqlTest
          E1_R1_REQUIRED: '1'
          E1_R1_SQL_CONNECTION: ${{ env.LEADER_RC_SQL_CONNECTION }}
        run: |
          dotnet test backend/tests/FieldVisit.Application.Tests/FieldVisit.Application.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~V180OptionCFinalSecurityGateSqlTests|FullyQualifiedName~V180TripMileageHttpSqlE2ETests|FullyQualifiedName~G1ReportExportHttpSqlTests' --logger 'trx;LogFileName=g1-critical-sql.trx' --results-directory artifacts/test-results
      - name: Prepare disposable real browser fixture via real HTTP SQL tests
        env:
          LEADER_RC_BROWSER_FIXTURE_PATH: /tmp/leader-rc-browser.json
        run: |
          dotnet test backend/tests/FieldVisit.Application.Tests/FieldVisit.Application.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~LeaderUat010HttpSqlTests.Leader_draft' --logger 'trx;LogFileName=leader-http-sql.trx' --results-directory artifacts/test-results
          test -s /tmp/leader-rc-browser.json
      - name: Candidate artifacts (not deployment)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk >/dev/null
          dotnet publish backend/src/FieldVisit.Api/FieldVisit.Api.csproj -c Release --no-build -o artifacts/api
          mkdir -p artifacts/api/fonts
          cp /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc artifacts/api/fonts/
          cp -R frontend/dist artifacts/frontend
          printf '%s\n' "$GITHUB_SHA" > artifacts/api/source-sha.txt
          printf '%s\n' "$GITHUB_SHA" > artifacts/frontend/source-sha.txt
          python3 scripts/ci/g1_rc_evidence.py manifest
      - name: Real Browser to API to SQL (no mocked API)
        env:
          UAT_BASE_URL: http://127.0.0.1:4173/
          LEADER_RC_BROWSER_FIXTURE_PATH: /tmp/leader-rc-browser.json
        run: |
          node scripts/ci/start-leader-rc-api.cjs
          cd uat
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          PLAYWRIGHT_JSON_OUTPUT_NAME=../artifacts/browser-results.json npx playwright test tests/leader-rc-browser-sql.spec.ts --retries=0 --reporter=list,html,json
      - name: Verify browser persistence and audit in SQL
        env:
          LEADER_RC_VERIFY_BROWSER_FIXTURE: /tmp/leader-rc-browser.json
        run: |
          dotnet test backend/tests/FieldVisit.Application.Tests/FieldVisit.Application.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~LeaderUat010HttpSqlTests.Browser_write_sql_probe' --logger 'trx;LogFileName=browser-sql-probe.trx' --results-directory artifacts/test-results
      - name: Require nonzero successful evidence and HOLD
        if: always()
        run: |
          python3 scripts/ci/leader_rc_trx.py
          python3 scripts/ci/g1_rc_evidence.py finalize
          echo 'G1 candidate evidence only; UAT schema/runtime/rollback and execution authorization HOLD.' >> "$GITHUB_STEP_SUMMARY"
      - name: Stop isolated provider
        if: always()
        run: docker rm -f g1-disposable-sql >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: g1-rc-nondeploy-${{ github.sha }}
          path: |
            artifacts/
            uat/playwright-report/
          retention-days: 7
