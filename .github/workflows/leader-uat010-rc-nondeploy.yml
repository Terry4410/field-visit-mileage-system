name: Minimal Leader UAT010 RC Nondeploy
on:
  push:
    branches: [work/ac-controlled-integration-20261017]
permissions:
  contents: read
concurrency:
  group: leader-uat010-rc-${{ github.ref }}
  cancel-in-progress: false
jobs:
  isolated:
    if: github.repository == 'Terry4410/field-visit-mileage-system' && github.ref == 'refs/heads/work/ac-controlled-integration-20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: FieldVisit_Recovery!Sql2022
        ports: ['1433:1433']
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'FieldVisit_Recovery!Sql2022' -C -Q 'SELECT 1' || exit 1"
          --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      LEADER_RC_REQUIRED: '1'
      LEADER_RC_SQL_CONNECTION: Server=localhost,1433;Database=master;User Id=sa;Password=FieldVisit_Recovery!Sql2022;Encrypt=False;TrustServerCertificate=True;Connect Timeout=5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Exact source and protected-model boundary
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = refs/heads/work/ac-controlled-integration-20261017
          git merge-base --is-ancestor b1a507c90c577fb2c0cdd6a98ef33481d3a5f790 HEAD
          git diff --exit-code b1a507c90c577fb2c0cdd6a98ef33481d3a5f790 -- database backend/src/FieldVisit.Domain frontend/public/config.js .github/workflows/azure-sql-uat-schema-fidelity-readonly.yml .github/workflows/uat-schema-fidelity-proposal-nondeploy.yml scripts/ci/uat_schema_fidelity_evidence.ps1 scripts/ci/test_uat_schema_fidelity_evidence.ps1 scripts/ci/test_uat_schema_fidelity_proposal.py docs/release/optionc-canonical-sql-draft/full-scheme-a/UatSchemaFidelity.failure-diagnostic.md .github/workflows/api-azure.yml .github/workflows/frontend-pages.yml
          echo 'c00a269a310222550626544a053ed343a3b55a6c71aad1f128668b6b4d2aabc0  docs/release/optionc-canonical-sql-draft/full-scheme-a/UatSchemaFidelity.readonly.sql' | sha256sum --check
          echo '981b79007ca5d7b890a7a609fc2785de9f3747e5886d49f4744135125c2446c3  docs/release/optionc-canonical-sql-draft/preflight/UAT_ReadOnly_Preflight.sql' | sha256sum --check
          test "$(jq -r '.PackageB.B3.Enabled' backend/src/FieldVisit.Api/appsettings.json)" = false
          test "$(jq -r '.OptionC.Approval.Enabled' backend/src/FieldVisit.Api/appsettings.json)" = false
          test "$(jq -r '.OptionC.Candidate.Enabled' backend/src/FieldVisit.Api/appsettings.json)" = false
          test ! -e database/migrations/1800_013
          echo "EF candidate model differs from Protected; UAT schema fidelity remains HOLD." >> "$GITHUB_STEP_SUMMARY"
          echo "Protected read-only workflow remains pinned to its existing SQL hash; the candidate preflight is not dispatched to UAT." >> "$GITHUB_STEP_SUMMARY"
          test -z "${UAT_SQL_CONNECTION:-}"
          test -z "${PRODUCTION_SQL_CONNECTION:-}"
          python3 scripts/ci/validate_leader_rc_boundary.py
      - name: Assess genuine Protected reference prerequisites (not EF parity)
        run: python3 scripts/ci/leader_rc_reference_prerequisites.py
      - name: Existing deployment source comparison and fail-closed manifest tests
        run: |
          python3 scripts/ci/leader_rc_source_compatibility.py
          python3 -m unittest scripts/ci/test_leader_rc_preflight.py
      - name: Parse disposable reference builder without executing SQL
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/ci/run-leader-rc-protected-reference.ps1'),[ref]$tokens,[ref]$errors)
          if($errors.Count -gt 0){throw 'REFERENCE_BUILDER_PARSE_FAILED'}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Exact frontend tests and build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: API build and complete tests
        run: |
          mkdir -p artifacts/test-results
          dotnet build backend/tests/FieldVisit.Application.Tests/FieldVisit.Application.Tests.csproj -c Release
          dotnet test backend/tests/FieldVisit.Application.Tests/FieldVisit.Application.Tests.csproj -c Release --no-build --logger 'trx;LogFileName=backend.trx' --results-directory artifacts/test-results
      - name: Prepare disposable real browser fixture via real HTTP SQL tests
        env:
          LEADER_RC_BROWSER_FIXTURE_PATH: /tmp/leader-rc-browser.json
        run: |
          dotnet test backend/tests/FieldVisit.Application.Tests/FieldVisit.Application.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~LeaderUat010HttpSqlTests.Leader_draft' --logger 'trx;LogFileName=leader-http-sql.trx' --results-directory artifacts/test-results
          test -s /tmp/leader-rc-browser.json
      - name: Candidate artifacts (not deployment)
        run: |
          dotnet publish backend/src/FieldVisit.Api/FieldVisit.Api.csproj -c Release --no-build -o artifacts/api
          cp -R frontend/dist artifacts/frontend
          printf '%s\n' "$GITHUB_SHA" > artifacts/api/source-sha.txt
          printf '%s\n' "$GITHUB_SHA" > artifacts/frontend/source-sha.txt
          python3 scripts/ci/leader_rc_manifest.py
      - name: Real Browser to API to SQL (no mocked API)
        env:
          UAT_BASE_URL: http://127.0.0.1:4173/
          LEADER_RC_BROWSER_FIXTURE_PATH: /tmp/leader-rc-browser.json
        run: |
          node scripts/ci/start-leader-rc-api.cjs
          cd uat
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          PLAYWRIGHT_JSON_OUTPUT_NAME=../artifacts/browser-results.json npx playwright test tests/leader-rc-browser-sql.spec.ts --retries=0 --reporter=list,html,json
      - name: Verify browser persistence and audit in SQL
        env:
          LEADER_RC_VERIFY_BROWSER_FIXTURE: /tmp/leader-rc-browser.json
        run: |
          dotnet test backend/tests/FieldVisit.Application.Tests/FieldVisit.Application.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~LeaderUat010HttpSqlTests.Browser_write_sql_probe' --logger 'trx;LogFileName=browser-sql-probe.trx' --results-directory artifacts/test-results
      - name: Require nonzero successful evidence and HOLD
        if: always()
        run: |
          python3 scripts/ci/leader_rc_trx.py
          python3 scripts/ci/leader_rc_acceptance.py
          echo 'Actual UAT schema parity, rollback evidence and deployment authorization HOLD. Partial Leader draft candidate only.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leader-uat010-rc-${{ github.sha }}
          path: |
            artifacts/
            uat/playwright-report/
          retention-days: 7
