name: G1 Migration Deployment Preparation NONDEPLOY
on:
  push:
    branches: [work/g1-uat-migration-readiness-20261020]
permissions:
  contents: read
concurrency:
  group: g1-preparation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  isolated:
    if: github.repository == 'Terry4410/field-visit-mileage-system' && github.ref == 'refs/heads/work/g1-uat-migration-readiness-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E1_R1_REQUIRED: '1'
      OPTIONC_EXECUTION_MODE: IsolatedSqlTest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Frozen RC and immutable SQL checks
        run: python3 scripts/ci/g1_migration_readiness.py verify
      - name: Ephemeral local SQL Server 2022 only
        run: python3 scripts/ci/g1_migration_readiness.py sql
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install pinned local SQL client module
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          try { Install-Module SqlServer -RequiredVersion 22.4.5.1 -Scope CurrentUser -Force -AllowClobber -Repository PSGallery -ErrorAction Stop | Out-Null }
          catch { Write-Output 'DisposableClient=STOP; Details=SUPPRESSED;'; exit 1 }
      - name: Targeted migration failure and state matrix
        run: |
          mkdir -p artifacts
          python3 scripts/ci/g1_migration_readiness.py faults
      - name: Reuse five accepted full-chain application writer tests only
        shell: python
        run: |
          import subprocess
          cmd=['dotnet','test','backend/tests/FieldVisit.Application.Tests/FieldVisit.Application.Tests.csproj','-c','Release','--filter','FullyQualifiedName~full_010_to_020_chain_runs_','--logger','trx;LogFileName=compatibility.trx','--results-directory','artifacts']
          r=subprocess.run(cmd,capture_output=True,text=True,timeout=900)
          if r.returncode: raise SystemExit('APPLICATION_COMPATIBILITY_STOP details=SUPPRESSED')
          print('ApplicationCompatibility=PASS; RequiredCount=5; SQL=REAL_DISPOSABLE;')
      - name: Bind sanitized evidence and explicit promotion HOLD
        run: |
          cp docs/release/g1-execution/registry.json artifacts/
          python3 scripts/ci/g1_migration_readiness.py finalize
      - name: Stop disposable provider
        if: always()
        run: docker rm -f g1-preparation-sql >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: g1-migration-preparation-${{ github.sha }}
          path: artifacts/
          retention-days: 7
