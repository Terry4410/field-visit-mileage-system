          Write-Output ("UAT_BASIC_JSON=" + ((@($basicTables | ForEach-Object { Convert-Table $_ -AllowUnknown }) | ConvertTo-Json -Depth 10 -Compress))

          $sql = Join-Path $env:GITHUB_WORKSPACE 'docs/release/optionc-canonical-sql-draft/preflight/UAT_ReadOnly_Preflight.sql'
          $preflightSet = Invoke-Sqlcmd -ServerInstance $server -Database $database -AccessToken $accessToken -ApplicationIntent ReadOnly -ConnectionTimeout 15 -QueryTimeout 120 -AbortOnError -OutputSqlErrors $true -OutputAs DataSet -Variable @{ EXPECTED_SERVER = $server; EXPECTED_DATABASE = $database } -InputFile $sql
          $checkedOutSha = (git rev-parse HEAD).Trim()
          if ([string]::IsNullOrWhiteSpace($checkedOutSha)) { throw 'STOP: checked-out source SHA was unavailable.' }
          if (-not [string]::IsNullOrWhiteSpace($env:GITHUB_SHA) -and $checkedOutSha -ne $env:GITHUB_SHA) {
            throw "STOP: checked-out source SHA does not match workflow source SHA."
          }
          $evidence = Capture-Evidence $preflightSet $checkedOutSha
