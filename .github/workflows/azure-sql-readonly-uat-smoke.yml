            ("- Completion marker: " + $evidence.CompletionMarker) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            ("- Result sets captured: " + $evidence.ResultSetCount) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            ("- Source SHA: " + $evidence.SourceSha) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

