name: Azure SQL read-only UAT smoke test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-sql-readonly-uat-smoke
  cancel-in-progress: false

jobs:
  branch-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enforce post-uat/v1.8.0 dispatch branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/post-uat/v1.8.0" ]]; then
            echo "::error::This workflow may only run from post-uat/v1.8.0. Received ${GITHUB_REF}."
            exit 1
          fi

  sql-readonly-smoke:
    needs: branch-guard
    runs-on: ubuntu-latest
    environment: uat
    timeout-minutes: 10
    steps:
      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install pinned SQL Server PowerShell module
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module `
            -Name SqlServer `
            -RequiredVersion 22.4.5.1 `
            -Repository PSGallery `
            -Scope CurrentUser `
            -Force `
            -AllowClobber

      - name: Query Azure SQL using Microsoft Entra access token
        env:
          AZURE_SQL_SERVER_NAME: ${{ vars.AZURE_SQL_SERVER_NAME }}
          AZURE_SQL_DATABASE: ${{ vars.AZURE_SQL_DATABASE }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:AZURE_SQL_SERVER_NAME)) {
            throw 'AZURE_SQL_SERVER_NAME is not configured.'
          }

          if ([string]::IsNullOrWhiteSpace($env:AZURE_SQL_DATABASE)) {
            throw 'AZURE_SQL_DATABASE is not configured.'
          }

          $server = "$($env:AZURE_SQL_SERVER_NAME).database.windows.net"
          $accessToken = az account get-access-token `
            --resource https://database.windows.net/ `
            --query accessToken `
            --output tsv

          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($accessToken)) {
            throw 'Unable to obtain the Microsoft Entra access token for Azure SQL.'
          }

          Write-Output "::add-mask::$accessToken"

          $query = @'
          SELECT DB_NAME() AS DatabaseName;

          SELECT TOP 5
              name
          FROM sys.tables
          ORDER BY name;
          '@

          try {
            Invoke-Sqlcmd `
              -ServerInstance $server `
              -Database $env:AZURE_SQL_DATABASE `
              -AccessToken $accessToken `
              -ApplicationIntent ReadOnly `
              -ConnectionTimeout 15 `
              -QueryTimeout 30 `
              -AbortOnError `
              -OutputSqlErrors $true `
              -Query $query | Format-Table -AutoSize
          }
          catch {
            Write-Error ($_ | Out-String)
            throw
          }

      - name: Sign out of Azure
        if: always()
        run: az logout
