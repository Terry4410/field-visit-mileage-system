              foreach ($row in @($set.Rows)) {
                if ([string]::IsNullOrWhiteSpace([string]$row.CheckName) -or $null -eq $row.Violations) {
                  throw 'STOP: integrity evidence was incomplete.'
                }
                if ([int]$row.Violations -ne 0) { throw "STOP: integrity violations detected for $($row.CheckName)." }
              }
            }

            [pscustomobject]@{
              ResultSetCount = $resultSets.Count
              ResultSets = $resultSets
              CompletionMarker = $completion[0].Result
              SourceSha = $CheckedOutSha
              CapturedUtc = [DateTime]::UtcNow.ToString('o')
            }
          }

          if ($env:CONFIGURED_SERVER_NAME -ne 'sql-fieldvisit-jpe-uat') { throw 'Unexpected SQL server allow-list value.' }
          if ($env:CONFIGURED_DATABASE -ne $env:EXPECTED_DATABASE) { throw 'Unexpected SQL database allow-list value.' }

          $accessToken = az account get-access-token --resource https://database.windows.net/ --query accessToken --output tsv
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($accessToken)) {
            throw 'Unable to obtain the Microsoft Entra access token for Azure SQL.'
