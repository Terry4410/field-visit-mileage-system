            foreach ($name in @('IsDbOwner','IsDbDdlAdmin','IsDbDatawriter','CanCreateTable','CanAlterAnyUser','CanInsertChangeRequests','CanUpdateChangeRequests','CanDeleteChangeRequests','CanInsertSchemaVersions','CanUpdateLocations')) {
