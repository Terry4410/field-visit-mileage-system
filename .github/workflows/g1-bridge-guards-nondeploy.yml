name: G1 bridge isolation guards NONDEPLOY
on:
  push:
    branches: [work/g1-readonly-bridge-nondeploy-20261021]
    paths:
      - '.github/workflows/g1-bridge-guards-nondeploy.yml'
      - 'scripts/ci/g1_bridge_guard.py'
      - 'scripts/ci/test_g1_bridge_guard.py'
      - 'scripts/ci/g1_bridge_handoff_nondeploy.ps1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: g1-bridge-guards-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline:
    if: github.repository == 'Terry4410/field-visit-mileage-system' && github.ref == 'refs/heads/work/g1-readonly-bridge-nondeploy-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: none
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact SHA / source / identity separation guards
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: python3 scripts/ci/g1_bridge_guard.py
      - name: Negative and positive offline contract tests
        run: python3 -m unittest discover -s scripts/ci -p test_g1_bridge_guard.py -v
      - name: Install pinned SqlClient PowerShell provider (no Azure)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          try {
            Install-Module SqlServer -RequiredVersion 22.4.5.1 -Scope CurrentUser -Force -AllowClobber -Repository PSGallery -ErrorAction Stop | Out-Null
            Import-Module SqlServer -RequiredVersion 22.4.5.1 -Force -ErrorAction Stop
            if((Get-Module SqlServer).Version.ToString() -cne '22.4.5.1'){throw 'PIN'}
            Write-Output 'ProviderModule=PASS; AzureAccess=FALSE;'
          } catch { Write-Output 'ProviderModule=STOP; Details=SUPPRESSED;'; exit 1 }
      - name: Execute real closed SqlClient builder and candidate (no Open)
        shell: pwsh
        env:
          BRIDGE_MANIFEST_SHA: '7742024b9bb790acef0821d0dd10361dd284f4a44311d8045464d1a7f1db686f'
        run: |
          $ErrorActionPreference='Stop'
          $evidence=Join-Path $env:RUNNER_TEMP 'g1-bridge-not-created.json'
          if(Test-Path $evidence){throw 'EVIDENCE_PRESENT'}
          $output=@(& (Join-Path $env:GITHUB_WORKSPACE 'scripts/ci/g1_bridge_connection_candidate.ps1') -ExecuteIsolated -ReviewedManifestSha256 $env:BRIDGE_MANIFEST_SHA -ReviewedSourceSha $env:GITHUB_SHA -DiagnosticAccessToken 'SYNTHETIC_NON_AUTHENTICATING_TOKEN' -EvidenceFile $evidence)
          $expected='BridgeConnection=PREPARED_ONLY; SqlOpened=FALSE; ApiPrincipal=UNKNOWN; G1=HOLD;'
          if(@($output).Count -ne 1 -or @($output)[0] -cne $expected){
            $classification=if(@($output).Count -eq 1 -and @($output)[0] -ceq 'BridgeConnection=STOP; Details=SUPPRESSED;'){'CANDIDATE_STOP'}else{'OUTPUT_CONTRACT_REJECTED'}
            Write-Output "ClosedSqlClient=STOP; Classification=$classification; Details=SUPPRESSED;"
            exit 1
          }
          if(Test-Path $evidence){throw 'EVIDENCE_UNEXPECTED'}
          Write-Output 'ClosedSqlClient=PASS; SqlOpened=FALSE; G1=HOLD;'
      - name: Exercise isolated real SqlClient handoff without SQL Open
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Import-Module SqlServer -RequiredVersion 22.4.5.1 -Force -ErrorAction Stop
          . (Join-Path $env:GITHUB_WORKSPACE 'scripts/ci/g1_bridge_handoff_nondeploy.ps1')
          $b=[Microsoft.Data.SqlClient.SqlConnectionStringBuilder]::new()
          $b['Data Source']='127.0.0.1,1433'
          $b['Initial Catalog']='master'
          $b['Pooling']=$false
          $b['ConnectRetryCount']=0
          $b['Trust Server Certificate']=$true
          $conn=[Microsoft.Data.SqlClient.SqlConnection]::new($b.ConnectionString)
          $callback={ param($c) if($c.State -ne [Data.ConnectionState]::Closed){throw 'STOP'}; 'ISOLATED_COLLECTOR_SIMULATED' }
          $result=@(Invoke-G1IsolatedHandoff -Connection $conn -TestCollector $callback -SourceSha $env:GITHUB_SHA)
          if($result.Count -ne 1 -or $result[0] -cne 'IsolatedHandoff=PASS; LiveExecution=FALSE; ApiPrincipal=UNKNOWN;'){throw 'STOP'}
          if($conn.State -ne [Data.ConnectionState]::Closed){throw 'STOP'}
          $b['Data Source']='tcp:sql-fieldvisit-jpe-uat.database.windows.net,1433'
          $bad=[Microsoft.Data.SqlClient.SqlConnection]::new($b.ConnectionString)
          $rejected=$false
          try { $null=Invoke-G1IsolatedHandoff -Connection $bad -TestCollector $callback -SourceSha $env:GITHUB_SHA } catch { $rejected=$true }
          if(-not $rejected){throw 'STOP'}
          Write-Output 'IsolatedHandoffHarness=PASS; SqlOpened=FALSE; LiveTargetRejected=TRUE;'
