name: Path B ACL single result NONDEPLOY
on:
  pull_request:
    paths:
      - 'database/uat/PathB_UAT_Runtime_ACL_Readonly_SINGLE_RESULT_REVIEW.sql'
      - 'database/uat/PathB_UAT_Runtime_ACL_Readonly_SINGLE_RESULT_COLLATION_REVIEW.sql'
      - 'scripts/ci/test_pathb_acl_single_result_sqlserver.py'
      - 'database/uat/PathB_UAT_P0_Core_Runtime_ACL_GRANT_REVIEW_20261119.sql'
      - 'database/uat/PathB_UAT_P0_LeaderApproval_ACL_Readonly_REVIEW_20261119.sql'
      - 'scripts/ci/test_pathb_p0_core_acl_sqlserver.py'
      - 'database/uat/PathB_UAT_P0_MileageGovernanceEvents_OutputId_SELECT_REVIEW_20261119.sql'
      - 'scripts/ci/test_pathb_mileage_governance_output_acl_sqlserver.py'
      - '.github/workflows/pathb-acl-single-result-nondeploy.yml'
      - 'backend/src/FieldVisit.Application/Interfaces.cs'
      - 'backend/src/FieldVisit.Infrastructure/AppDbContext.cs'
      - 'backend/src/FieldVisit.Application/LeaderService.cs'
      - 'backend/tests/FieldVisit.Application.Tests/LeaderApprovalRetryTransactionTests.cs'
permissions:
  contents: read
jobs:
  sqlserver-acl-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Start disposable SQL Server 2022
        shell: bash
        run: |
          set -euo pipefail
          password="Aa7!$(python -c 'import secrets;print(secrets.token_hex(24))')"
          echo "::add-mask::$password"
          echo "PATHB_SQL_PASSWORD=$password" >> "$GITHUB_ENV"
          docker run -d --name pathb-acl-sql -p 127.0.0.1:1433:1433 \
            -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e "MSSQL_SA_PASSWORD=$password" \
            mcr.microsoft.com/mssql/server:2022-latest >/dev/null
      - name: Wait for SQL Server
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            docker exec pathb-acl-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa \
              -P "$PATHB_SQL_PASSWORD" -C -l 2 -Q 'SELECT 1' >/dev/null 2>&1 && exit 0
            sleep 2
          done
          exit 1
      - name: Validate exact source and one resultset against two collations
        run: python scripts/ci/test_pathb_acl_single_result_sqlserver.py
      - name: Validate P0 core ACL delta against two collations and negative security paths
        run: python scripts/ci/test_pathb_p0_core_acl_sqlserver.py
      - name: Verify mileage governance INSERT OUTPUT identity under minimal SELECT
        run: python scripts/ci/test_pathb_mileage_governance_output_acl_sqlserver.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test Leader serializable approval strategy against disposable SQL Server
        run: dotnet test backend/tests/FieldVisit.Application.Tests/FieldVisit.Application.Tests.csproj -c Release --filter FullyQualifiedName~LeaderApprovalRetryTransactionTests --logger 'console;verbosity=normal'
      - name: Parse Leader approval ACL readonly candidate without live SQL
        shell: bash
        run: |
          set -euo pipefail
          { printf 'SET PARSEONLY ON;\n'; cat database/uat/PathB_UAT_P0_LeaderApproval_ACL_Readonly_REVIEW_20261119.sql; } |
            docker exec -i pathb-acl-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$PATHB_SQL_PASSWORD" -C -b -V 11 -d master
      - name: Remove disposable SQL Server
        if: always()
        run: docker rm -f pathb-acl-sql >/dev/null 2>&1 || true
