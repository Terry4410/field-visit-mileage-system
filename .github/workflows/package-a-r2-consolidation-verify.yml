name: Package A R2 report consolidation candidate verification
on:
  push:
    branches:
      - work/v180-package-a-r2-report-consolidation
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-tests:
    if: github.repository == 'Terry4410/field-visit-mileage-system' && github.ref == 'refs/heads/work/v180-package-a-r2-report-consolidation'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify immutable baseline ancestry
        run: git merge-base --is-ancestor 9d0d96eb0c5b10619146ea0a1c1312378de2faca HEAD
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install CJK test fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Backend build
        run: dotnet build backend/src/FieldVisit.Api/FieldVisit.Api.csproj -c Release
      - name: Backend regression
        run: dotnet test backend/tests/FieldVisit.Application.Tests/FieldVisit.Application.Tests.csproj -c Release --logger 'console;verbosity=normal'
      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Frontend tests
        working-directory: frontend
        run: npm test -- --reporter=default
      - name: Frontend build
        working-directory: frontend
        run: npm run build
