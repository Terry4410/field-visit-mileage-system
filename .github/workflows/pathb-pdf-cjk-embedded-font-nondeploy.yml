name: Path B PDF CJK embedded font actual-glyph regression (NONDEPLOY)
on:
  push:
    branches: [fix/pathb-pdf-cjk-embedded-font-20261124]
permissions:
  contents: read
  actions: read
concurrency:
  group: pathb-pdf-cjk-source-20261124
  cancel-in-progress: false
jobs:
  pdf-font:
    if: github.repository == 'Terry4410/field-visit-mileage-system' && github.ref == 'refs/heads/fix/pathb-pdf-cjk-embedded-font-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 16
      - name: Limit all code changes to chosen LIVE API source and PDF only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from subprocess import check_call,check_output
          base='8442bae35a9099c1bd68505c6273f93a937d7045'
          check_call(['git','merge-base','--is-ancestor',base,'HEAD'])
          changed=set(check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          allowed={
            '.github/workflows/pathb-pdf-cjk-embedded-font-nondeploy.yml',
            'backend/src/FieldVisit.Infrastructure/FieldVisit.Infrastructure.csproj',
            'backend/src/FieldVisit.Infrastructure/ReportDocumentService.cs',
            'backend/tests/FieldVisit.Application.Tests/PathBQuery05PdfReadabilityTests.cs'
          }
          assert changed==allowed,sorted(changed.symmetric_difference(allowed))
          print('EXACT_DEPLOYED_API_SOURCE_AND_FOUR_FILE_PDF_DELTA=PASS')
          PY
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: PathB-REPORT-EXPORT-3ROLES-API-package-8442bae3
          run-id: 45312411080
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/source-package
      - name: Use exact previous source-verified Noto font as assembly resource
        shell: bash
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/source-package"
          pkg="$p/PathB_REPORT_EXPORT_3ROLES_API_fix_8442bae3_once_20261124.zip"
          test "$(sha256sum "$pkg" | cut -d' ' -f1)" = c4a35f4623fcffe03e5f83a9b1aeacdf57f1dc70083b1f6302fbca181b841d63
          mkdir -p backend/src/FieldVisit.Infrastructure/fonts
          unzip -p "$pkg" fonts/NotoSansCJK-Regular.ttc > backend/src/FieldVisit.Infrastructure/fonts/NotoSansCJK-Regular.ttc
          test "$(sha256sum backend/src/FieldVisit.Infrastructure/fonts/NotoSansCJK-Regular.ttc | cut -d' ' -f1)" = b76b0433203017ca80401b2ee0dd69350349871c4b19d504c34dbdd80541690a
          test "$(wc -c < backend/src/FieldVisit.Infrastructure/fonts/NotoSansCJK-Regular.ttc | tr -d ' ')" = 19484784
          echo 'CJK_RESOURCE_FONT_SHA_AND_LICENSED_PIN=PASS'
      - name: Build and run existing + new actual Chinese PDF tests with resource
        shell: bash
        run: |
          set -euo pipefail
          export PATHB_PDF_VERIFY_DIR="$RUNNER_TEMP/pdf"
          mkdir -p "$PATHB_PDF_VERIFY_DIR"
          dotnet test backend/tests/FieldVisit.Application.Tests/FieldVisit.Application.Tests.csproj \
            -c Release --filter 'FullyQualifiedName~PathBQuery05PdfReadabilityTests' \
            --logger 'console;verbosity=normal'
          test -s "$PATHB_PDF_VERIFY_DIR/query05_cjk_3_rows.pdf"
          test -s "$PATHB_PDF_VERIFY_DIR/query05_11_rows.pdf"
          echo 'PDF_GENERATION_TESTS=PASS'
      - name: Inspect actual PDF embedded face and Chinese Unicode with PyMuPDF
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/pdf-check"
          "$RUNNER_TEMP/pdf-check/bin/python" -m pip install --quiet --disable-pip-version-check pymupdf==1.24.14
          "$RUNNER_TEMP/pdf-check/bin/python" - <<'PY'
          import os,pathlib,fitz,unicodedata
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          pdf=root/'pdf/query05_cjk_3_rows.pdf'
          doc=fitz.open(pdf)
          assert len(doc)>0
          fonts=[f for page in doc for f in page.get_fonts(full=True)]
          assert fonts, 'FONT_EMBEDDED_NONE'
          names=[str(f[3]) for f in fonts]
          font_types=[str(f[2]) for f in fonts]
          print('PDF_FONT_TYPES='+','.join(sorted(set(font_types))))
          print('PDF_FONT_NAMES='+','.join(sorted(set(names))))
          # Skia TTC can be embedded as anonymous Type3 glyph faces: the
          # PDF's actual rendered text, not base-font metadata, is definitive.
          assert not any('DejaVuSerif' in font for font in names),names
          text='\n'.join(page.get_text(sort=True) for page in doc)
          print('PDF_EXTRACTED_TEXT_SAMPLE='+repr(text[:350]))
          # Skia/Type3 may assign a CJK Compatibility Radical (U+2Fxx)
          # to a visually identical unified ideograph; normalize that PDF
          # extraction before validating the visible report wording.
          normalized=unicodedata.normalize('NFKC',text)
          for phrase in ('外訪行程與里程管理系統','行程查詢報表','日期','外訪員','小組','查詢'):
              assert phrase in normalized,(phrase,repr(text[:450]))
          assert '\\x00' not in text,'NULL_GLYPHS_IN_PDF'
          assert len(text.strip())>200
          (root/'pdf-fonts.txt').write_text('\n'.join(map(str,fonts))+'\n')
          (root/'pdf-text.txt').write_text(text)
          print('ACTUAL_EMBEDDED_TRADITIONAL_CHINESE_FONT_AND_READABLE_UNICODE=PASS')
          PY
      - name: Upload only text test evidence, never font file
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/checked"
          cp "$RUNNER_TEMP/pdf-fonts.txt" "$RUNNER_TEMP/pdf-text.txt" "$RUNNER_TEMP/checked/"
          sha256sum "$RUNNER_TEMP/pdf/query05_cjk_3_rows.pdf" > "$RUNNER_TEMP/checked/pdf-sha256.txt"
          printf 'CODE_SHA=%s\nMODE=NONDEPLOY\nLIVE_AZURE_PDF=UNVERIFIED\n' "$(git rev-parse HEAD)" > "$RUNNER_TEMP/checked/manifest.txt"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: PathB-PDF-CJK-PROOF-NONDEPLOY
          path: ${{ runner.temp }}/checked/
          retention-days: 14
          if-no-files-found: error

      # Synthetic fixture only, for diagnosing glyph encoding if verification
      # fails. No real visitor records or licensed font files are uploaded.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PathB-PDF-CJK-SYNTHETIC-FIXTURE
          path: ${{ runner.temp }}/pdf/query05_cjk_3_rows.pdf
          retention-days: 3
          if-no-files-found: ignore
