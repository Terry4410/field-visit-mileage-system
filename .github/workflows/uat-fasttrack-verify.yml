name: UAT Fast-Track verification

on:
  push:
    branches: [feature/uat-fasttrack-v180]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uat-fasttrack-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protected-regression:
    if: github.repository == 'Terry4410/field-visit-mileage-system'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Traditional Chinese PDF test font
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Install frontend dependencies
        run: npm --prefix frontend ci --no-audit --no-fund
      - name: Install isolated browser dependencies
        run: |
          npm --prefix uat ci --no-audit --no-fund
          cd uat
          npx playwright install --with-deps chromium
      - name: Full protected validation
        env:
          RUN_ISOLATED_BROWSER_REGRESSION: '1'
        run: bash scripts/test-full-ai-validation.sh
