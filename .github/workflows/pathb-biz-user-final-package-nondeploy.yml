name: Biz User final Path B and IT package (NONDEPLOY)
on:
  push:
    branches: [work/biz-user-uat-people-package-20261126]
permissions:
  contents: read
  actions: read
jobs:
  verify-and-package:
    if: github.repository == 'Terry4410/field-visit-mileage-system' && github.ref == 'refs/heads/work/biz-user-uat-people-package-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_SHA: 'a444fea4d24e316c35c5881eece4b22217aabea7'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'a444fea4d24e316c35c5881eece4b22217aabea7'
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm exact tested source and prior CI receipt
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          gh api repos/Terry4410/field-visit-mileage-system/actions/runs/45775482345 > "$RUNNER_TEMP/accepted-ci.json"
          jq -e --arg sha "$SOURCE_SHA" '.head_sha == $sha and .status == "completed" and .conclusion == "success"' "$RUNNER_TEMP/accepted-ci.json"
          gh api repos/Terry4410/field-visit-mileage-system/actions/runs/45775482345/jobs > "$RUNNER_TEMP/accepted-jobs.json"
          jq -e '.jobs | any(.name == "verify-people-and-location-delta" and .conclusion == "success")' "$RUNNER_TEMP/accepted-jobs.json"
          gh api repos/Terry4410/field-visit-mileage-system/actions/runs/45763539116 > "$RUNNER_TEMP/backend-ci.json"
          jq -e '.head_sha == "8ba71f3e2660ecc972f2d8cd32be99998250db26" and .status == "completed" and .conclusion == "success"' "$RUNNER_TEMP/backend-ci.json"
          gh api repos/Terry4410/field-visit-mileage-system/compare/8ba71f3e2660ecc972f2d8cd32be99998250db26...1630ae07a6e764004d65c83346f8cbd9af8b0ff6 > "$RUNNER_TEMP/prior-delta.json"
          jq -e '.status == "ahead" and (.files | length == 9) and (.files | all(.filename | startswith("frontend/") or . == ".github/workflows/uat-final-nondeploy.yml"))' "$RUNNER_TEMP/prior-delta.json"
          gh api repos/Terry4410/field-visit-mileage-system/compare/1630ae07a6e764004d65c83346f8cbd9af8b0ff6...a444fea4d24e316c35c5881eece4b22217aabea7 > "$RUNNER_TEMP/delta.json"
          jq -e '.status == "ahead" and (.files | length == 28) and (.files | all(.filename | startswith("frontend/") or . == ".github/workflows/uat-final-nondeploy.yml"))' "$RUNNER_TEMP/delta.json"
      - name: Recover verified live API, Windows API and frontend rollback without rebuilding backend
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/previous" artifacts
          gh api repos/Terry4410/field-visit-mileage-system/actions/artifacts/15092330045/zip > "$RUNNER_TEMP/previous/1630-package.zip"
          echo "f561bf96e6866a1bd50ca29d9468b46936e302b329a3297b7075211c180c20d5  $RUNNER_TEMP/previous/1630-package.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/previous/1630-package.zip" PathB_Final_API_1630ae07.zip > artifacts/Rollback_API_1630ae07.zip
          unzip -p "$RUNNER_TEMP/previous/1630-package.zip" PathB_Final_Frontend_1630ae07.zip > artifacts/Rollback_Frontend_1630ae07.zip
          unzip -p "$RUNNER_TEMP/previous/1630-package.zip" API_Windows_IIS_1630ae07.zip > "artifacts/API_Windows_IIS_${SOURCE_SHA:0:8}.zip"
          unzip -p "$RUNNER_TEMP/previous/1630-package.zip" manifest.json > "$RUNNER_TEMP/previous/manifest.json"
          echo "0f74456321000b83c75112155e0e20ed84a3751ec9a9d76e390f3f59c8a3dfb5  artifacts/Rollback_API_1630ae07.zip" | sha256sum -c -
          echo "fe8f8741d1f50424ad06f138db827a1da34391e97bf650897ff8569de856091f  artifacts/Rollback_Frontend_1630ae07.zip" | sha256sum -c -
          jq -e --arg sha '1630ae07a6e764004d65c83346f8cbd9af8b0ff6' '.source == $sha' "$RUNNER_TEMP/previous/manifest.json"
          printf '%s  %s\n' "$(jq -er '.sha256["API_Windows_IIS_1630ae07.zip"]' "$RUNNER_TEMP/previous/manifest.json")" "artifacts/API_Windows_IIS_${SOURCE_SHA:0:8}.zip" | sha256sum -c -
          cp artifacts/Rollback_API_1630ae07.zip "artifacts/PathB_Final_API_${SOURCE_SHA:0:8}.zip"
          cmp artifacts/Rollback_API_1630ae07.zip "artifacts/PathB_Final_API_${SOURCE_SHA:0:8}.zip"
          unzip -tq artifacts/Rollback_API_1630ae07.zip
          unzip -tq artifacts/Rollback_Frontend_1630ae07.zip
      - name: Build static frontend and preserve exact Path B runtime config
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          # Exact-source UI tests passed in run 45775482345; backend unchanged from 45763539116.
          npm run build
          mkdir -p "$RUNNER_TEMP/it-frontend"
          cp -a dist/. "$RUNNER_TEMP/it-frontend/"
          rm "$RUNNER_TEMP/it-frontend/config.js"
          cat > "$RUNNER_TEMP/it-frontend/CONFIG_REQUIRED.md" <<'EOF'
          IT must provide config.js with company API URL, approved identity settings (AD / Windows SSO integration requires IT validation) and approved corporate feature flags before serving this frontend. The frontend fails closed without config.js. Do not use Path B Demo credentials in corporate IIS.
          EOF
          (cd "$RUNNER_TEMP/it-frontend" && zip -qr "$GITHUB_WORKSPACE/artifacts/Frontend_IIS_unconfigured_${SOURCE_SHA:0:8}.zip" .)
          node scripts/prepare-pathb-artifact.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dist/config.js')
          s=p.read_text()
          assert s.count('AUTH_MODE: "Demo",')==1
          p.write_text(s.replace('AUTH_MODE: "Demo",','AUTH_MODE: "Demo",\n  FORMAL_LOCATION_UAT: true,'))
          PY
          unzip -p "$GITHUB_WORKSPACE/artifacts/Rollback_Frontend_1630ae07.zip" config.js > "$RUNNER_TEMP/previous/config.js"
          cmp "$RUNNER_TEMP/previous/config.js" dist/config.js
          (cd dist && zip -qr "$GITHUB_WORKSPACE/artifacts/PathB_Final_Frontend_${SOURCE_SHA:0:8}.zip" .)
      - name: Seal source, schema and deployment candidates
        run: |
          set -euo pipefail
          git archive --format=zip -o "artifacts/Source_SQL_IT_${SOURCE_SHA:0:8}.zip" "$SOURCE_SHA"
          cat > artifacts/HANDOVER_README.txt <<EOF
          Exact source: $SOURCE_SHA
          Schema marker: 1.8.0-010 (unchanged)
          Path B target: existing API and Static Web App ONLY; deployment NOT EXECUTED
          Frontend-only runtime delta. Path B API and Windows/IIS API bytes reused from accepted 1630ae07, not rebuilt; no API redeployment needed. Both rollback packages are byte-for-byte the accepted 1630ae07 version.
          Windows/IIS package is an IT review candidate. Frontend config.js is deliberately absent until IT sets approved corporate URL and Entra settings. See Source_SQL_IT zip for database/clean-install, migrations, docs and source.
          Company master seed, AD/Windows SSO, service identity grants, Clean Build and Production Ready remain IT environment verification. Do not run UAT synthetic seed in production.
          Accepted isolated CI: 45775482345 (57 UI tests and build); unchanged backend and prior UI evidence from 45763539116 (74 backend / 10 frontend).
          Owner scope freeze: Email notification is excluded from this UAT and deferred to IT development after handover; preserve existing 1800_006 and design references, no activation or delivery.
          No SQL, ACL, Azure or environment write occurred in this workflow.
          EOF
          python3 - <<'PY'
          import hashlib,json,os,pathlib,zipfile
          p=pathlib.Path('artifacts')
          files=sorted(p.glob('*.zip'))
          assert len(files)==7, [x.name for x in files]
          hashes={}
          for z in files:
              with zipfile.ZipFile(z) as f:
                  assert f.testzip() is None,z
                  assert all(not pathlib.PurePosixPath(n).is_absolute() and '..' not in pathlib.PurePosixPath(n).parts for n in f.namelist()),z
              hashes[z.name]=hashlib.sha256(z.read_bytes()).hexdigest()
          assert hashes['Rollback_API_1630ae07.zip']=='0f74456321000b83c75112155e0e20ed84a3751ec9a9d76e390f3f59c8a3dfb5'
          assert hashes['Rollback_Frontend_1630ae07.zip']=='fe8f8741d1f50424ad06f138db827a1da34391e97bf650897ff8569de856091f'
          prefix=os.environ['SOURCE_SHA'][:8]
          assert hashes[f'PathB_Final_API_{prefix}.zip']==hashes['Rollback_API_1630ae07.zip']
          with zipfile.ZipFile(p/f'PathB_Final_API_{prefix}.zip') as z:
              assert {'FieldVisit.Api.dll','FieldVisit.Infrastructure.dll','appsettings.json'}.issubset(z.namelist())
          with zipfile.ZipFile(p/f'PathB_Final_Frontend_{prefix}.zip') as z:
              assert {'index.html','config.js'}.issubset(z.namelist())
          with zipfile.ZipFile(p/f'Source_SQL_IT_{prefix}.zip') as z:
              assert {'database/clean-install/v180/README.md','backend/src/FieldVisit.Api/Program.cs','docs/release/g1-execution/promotion/API-RUNTIME-SQL-GRANT-CANDIDATE.sql'}.issubset(z.namelist())
          (p/'manifest.json').write_text(json.dumps({'source':os.environ['SOURCE_SHA'],'schema':'1.8.0-010','rollbackSource':'1630ae07a6e764004d65c83346f8cbd9af8b0ff6','rollbackArtifact':15092330045,'apiBinarySource':'1630ae07a6e764004d65c83346f8cbd9af8b0ff6','runtimeDelta':'frontend-only','email':'deferred-to-IT','target':'Path B UAT only','mode':'NONDEPLOY','deployment':'NOT_EXECUTED','itCleanBuild':'NOT_RUN','verificationRun':45775482345,'backendVerificationRun':45763539116,'backendVerifiedSource':'8ba71f3e2660ecc972f2d8cd32be99998250db26','sha256':hashes},indent=2)+'\n')
          PY
          (cd artifacts && sha256sum *.zip manifest.json HANDOVER_README.txt > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: fieldvisit-biz-user-final-${{ env.SOURCE_SHA }}-nondeploy
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
