name: Package B B2-B3 controlled non-deploy verification
on:
  push:
    branches:
      - work/v180-package-b-b2-b3-controlled
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/ci/**"
      - "docs/release/PACKAGE-B*"
      - ".github/workflows/package-b-b2-b3-controlled-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-b-b2-b3-controlled-verify
  cancel-in-progress: false

jobs:
  isolated-tests:
    if: github.repository == 'Terry4410/field-visit-mileage-system' && github.ref == 'refs/heads/work/v180-package-b-b2-b3-controlled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Automated B3/B4 safety gates (NO DEPLOY)
        id: security_gate
        run: python3 scripts/ci/package_b_guard.py --report .ci-artifacts/guard.json --summary .ci-artifacts/guard.md
      - name: Python CI scripts syntax validation
        id: python_syntax
        run: python3 -m compileall -q scripts/ci
      - name: Verify CI evidence parser negative tests
        id: python_tests
        run: python3 -m unittest discover -s scripts/ci -p 'test_package_b_*.py'
      - name: Validate every B4 SQL runtime HOLD case (DOCUMENT ONLY)
        id: matrix_gate
        run: python3 scripts/ci/package_b_matrix.py --input docs/release/PACKAGE-B-B3-B4-REMAINING-RUNTIME-UAT-GATES-NONEXECUTABLE.md --report .ci-artifacts/b4-matrix.json --summary .ci-artifacts/b4-matrix.md
      - name: Verify immutable authorized baseline
        id: baseline_gate
        run: git merge-base --is-ancestor c1ee3c0c3df000491fd54df727482815d3c38917 HEAD
      - id: setup_dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - id: setup_node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Backend build (NO DEPLOY)
        id: backend_build
        run: dotnet build backend/src/FieldVisit.Api/FieldVisit.Api.csproj -c Release
      - name: Backend unit tests (NO DB)
        id: backend_tests
        run: dotnet test backend/tests/FieldVisit.Application.Tests/FieldVisit.Application.Tests.csproj -c Release --logger 'console;verbosity=normal' --logger 'trx;LogFileName=backend-tests.trx' --results-directory .ci-artifacts
      - name: Frontend restore
        id: frontend_restore
        working-directory: frontend
        run: npm ci
      - name: Frontend tests
        id: frontend_tests
        working-directory: frontend
        run: npm run test -- --reporter=default --reporter=junit --outputFile.junit=../.ci-artifacts/frontend-tests.xml
      - name: Frontend build (NO DEPLOY)
        id: frontend_build
        working-directory: frontend
        run: npm run build
      - name: Consolidate automated B3/B4 CI evidence (NO DEPLOY)
        if: always()
        env:
          PACKAGE_B_CI_STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: python3 scripts/ci/package_b_evidence.py --guard .ci-artifacts/guard.json --trx .ci-artifacts/backend-tests.trx --junit .ci-artifacts/frontend-tests.xml --matrix .ci-artifacts/b4-matrix.json --steps-json "$PACKAGE_B_CI_STEP_OUTCOMES" --output .ci-artifacts/ci-evidence.json --summary .ci-artifacts/ci-evidence.md
      - name: Publish security-gate summary
        if: always()
        shell: bash
        run: |
          if [ -f .ci-artifacts/guard.md ]; then
            cat .ci-artifacts/guard.md >> "$GITHUB_STEP_SUMMARY"
            if [ -f .ci-artifacts/ci-evidence.md ]; then
              cat .ci-artifacts/ci-evidence.md >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ -f .ci-artifacts/b4-matrix.md ]; then
              cat .ci-artifacts/b4-matrix.md >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "Package B guard report missing: FAIL CLOSED" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload read-only gate evidence (NO DEPLOY)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-b-b3-b4-security-evidence
          path: .ci-artifacts/*
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  sql-server-disposable-fixture:
    # Explicit Owner authorization covers isolated test DBs only.
    # This job does NOT touch Azure, UAT, Prod, existing DBs or migrations.
    if: github.repository == 'Terry4410/field-visit-mileage-system' && github.ref == 'refs/heads/work/v180-package-b-b2-b3-controlled'
    needs: isolated-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Start disposable localhost SQL Server 2022 (TEST ONLY)
        shell: bash
        run: |
          set -euo pipefail
          password="B3SqlCi!$(python3 -c 'import secrets;print(secrets.token_urlsafe(27))')"
          echo "::add-mask::$password"
          echo "B3_SQL_TEST_CONNECTION=Server=127.0.0.1,14335;Database=master;User ID=sa;Password=$password;Encrypt=False;TrustServerCertificate=True;Connection Timeout=4" >> "$GITHUB_ENV"
          docker run --rm -d --name b3-sql-fixture -p 127.0.0.1:14335:1433 \
            -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e MSSQL_SA_PASSWORD="$password" \
            mcr.microsoft.com/mssql/server:2022-latest
      - name: Execute real disposable SQL Server schema, concurrency and audit tests (NO UAT)
        shell: bash
        run: |
          dotnet test backend/tests/FieldVisit.B3.SqlServer.Tests/FieldVisit.B3.SqlServer.Tests.csproj \
            -c Release --logger 'console;verbosity=normal' \
            --logger 'trx;LogFileName=b3-sql-server-tests.trx' \
            --results-directory .ci-artifacts
      - name: Capture disposable SQL runtime test evidence
        if: always()
        shell: bash
        run: |
          mkdir -p .ci-artifacts
          {
            echo "SQL Server: disposable localhost GitHub runner container only"
            echo "Source SHA: $GITHUB_SHA"
            echo "Schema: per-test random B3SqlFixture database, not a formal migration"
            echo "UAT/Prod credentials or DB: never used"
            echo "Actual approval/apply: DENY ALL"
            echo "SQL Server partial B4 fixture is NOT Business UAT GO"
          } > .ci-artifacts/b3-sql-scope.txt
          docker logs b3-sql-fixture --tail 60 > .ci-artifacts/sql-container-logs.txt 2>&1 || true
      - name: Destroy disposable SQL Server container
        if: always()
        run: docker rm -f b3-sql-fixture || true
      - name: Upload disposable SQL test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-b-b3-real-sql-disposable-only
          path: .ci-artifacts/*
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
