name: Azure SQL UAT schema fidelity inventory (SELECT-only)

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/azure-sql-uat-schema-fidelity-readonly.yml

permissions:
  contents: read

concurrency:
  group: azure-sql-uat-schema-fidelity-registration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  registration-stub-static-validation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout exact proposal SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify one-file inert registration contract
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/azure-sql-uat-schema-fidelity-readonly.yml
          test "${GITHUB_BASE_REF}" = "main"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          mapfile -t changed < <(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$workflow"
          grep -Fxq "permissions:" "$workflow"
          grep -Fxq "  contents: read" "$workflow"
          grep -Fq "if: github.event_name == 'workflow_dispatch'" "$workflow"
          grep -Fq "exit 1" "$workflow"
          forbidden_oidc="id-token:""[[:space:]]*write"
          forbidden_azure="azure/""login"
          forbidden_environment="environment:""[[:space:]]*(uat|uat-migration)"
          forbidden_sql="Invoke-""Sqlcmd"
          forbidden_secret="secrets"":"
          forbidden_vars="vars""\."
          forbidden_artifact="actions/""upload-artifact"
          for pattern in "$forbidden_oidc" "$forbidden_azure" "$forbidden_environment" "$forbidden_sql" "$forbidden_secret" "$forbidden_vars" "$forbidden_artifact"; do
            if grep -Eq "$pattern" "$workflow"; then
              echo "Forbidden capability detected in inert registration stub." >&2
              exit 1
            fi
          done

  registration-only:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: none
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refuse default-branch execution
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Registration stub only. Select post-uat/v1.8.0 after the independently reviewed protected workflow is installed."
          exit 1
