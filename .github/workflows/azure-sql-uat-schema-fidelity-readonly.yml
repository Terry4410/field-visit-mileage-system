name: Azure SQL UAT schema fidelity inventory (SELECT-only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-sql-uat-schema-fidelity-readonly
  cancel-in-progress: false

env:
  EXPECTED_RESOURCE_GROUP: rg-fieldvisit-uat
  EXPECTED_SERVER_NAME: sql-fieldvisit-jpe-uat
  EXPECTED_SERVER: sql-fieldvisit-jpe-uat.database.windows.net
  EXPECTED_DATABASE: db-fieldvisit-uat
  INVENTORY_SQL_SHA256: 67551978bf16266ef8f38c018be87b7aadc321ee3db84d6d94b52a1538204734
  R3_PRIVATE_WORKFLOW_SHA256: 5f583a9337f4eaf6a88e4907e20ad3b2e1290e1cef48c7e83b6b76558b12ad51
  R3_MANIFEST_SHA256: 0a5c552554868d837c473f6a3ed9f33d39056f0f9e5a18292268e2dc88c7abe5
  EVIDENCE_VALIDATOR_SHA256: 5b71d40b58c6119fc1d694f3b934f89745ee4633c873da8dfd50fa1bd3309653

jobs:
  branch-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout exact protected source for pre-identity pins
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Enforce protected source and repository
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "Terry4410/field-visit-mileage-system"
          test "${GITHUB_REF}" = "refs/heads/post-uat/v1.8.0" || {
            echo "::error::Schema fidelity inventory may only run from post-uat/v1.8.0."
            exit 1
          }
          test "${GITHUB_SHA}" != "" && test "${#GITHUB_SHA}" -eq 40

      - name: Verify exact source and private workflow before identity handoff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(sha256sum .github/workflows/r3-private-uat-execution.yml | cut -d' ' -f1)" = "$R3_PRIVATE_WORKFLOW_SHA256"
          test "$(sha256sum scripts/ci/uat_schema_r3.hashes.json | cut -d' ' -f1)" = "$R3_MANIFEST_SHA256"
          python3 scripts/ci/test_uat_schema_r3_contract.py --verify-hashes

  identity-handoff:
    needs: branch-guard
    runs-on: ubuntu-latest
    environment: uat
    permissions:
      contents: none
    timeout-minutes: 2
    outputs:
      client: ${{ job.status == 'success' && vars.AZURE_CLIENT_ID || '' }}
      tenant: ${{ job.status == 'success' && vars.AZURE_TENANT_ID || '' }}
      subscription: ${{ job.status == 'success' && vars.AZURE_SUBSCRIPTION_ID || '' }}
    steps:
      - name: Refuse debug disclosure before evaluating identity outputs
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_DEBUG:-}" != "1" || { echo 'STOP: debug logging is not permitted.'; exit 1; }
          echo 'PASS: identity handoff prerequisites.'

  metadata-only-inventory:
    needs: [branch-guard, identity-handoff]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/r3-private-uat-execution.yml
    secrets:
      r3_client_value: ${{ needs.identity-handoff.outputs.client }}
      r3_tenant_value: ${{ needs.identity-handoff.outputs.tenant }}
      r3_subscription_value: ${{ needs.identity-handoff.outputs.subscription }}
