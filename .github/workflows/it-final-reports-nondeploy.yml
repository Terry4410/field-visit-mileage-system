name: IT 10 report workbook bytes and policy denial (NONDEPLOY)
on:
  push:
    branches: [work/pathb-it-cleanbuild-020-20261123]
    paths: ['docs/release/pathb/it-final-admin/FinalAdminReportBytesSqlTests.cs']
permissions:
  contents: read
jobs:
  report-bytes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 03508fda5852ffd66705db9c49ab311eede753ee
          path: app
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: delivery
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run ten enabled actual report HTTP and XLSX content checks in disposable SQL Server 2022
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C app rev-parse HEAD)" = 03508fda5852ffd66705db9c49ab311eede753ee
          cp delivery/docs/release/pathb/it-final-admin/FinalAdminReportBytesSqlTests.cs app/backend/tests/FieldVisit.Application.Tests/
          pw="Aa9!$(openssl rand -hex 18)"
          echo "::add-mask::$pw"
          docker run -d --name fv-final-reports -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$pw" -p 127.0.0.1:1433:1433 mcr.microsoft.com/mssql/server:2022-latest >/dev/null
          trap 'docker rm -f fv-final-reports >/dev/null 2>&1 || true' EXIT
          ready=NO
          for _ in $(seq 1 60); do if docker exec fv-final-reports /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$pw" -C -Q 'SELECT 1' >/dev/null 2>&1; then ready=YES; break; fi; sleep 2; done
          test "$ready" = YES
          export FV_FINAL_SQL="Server=127.0.0.1,1433;Database=master;User Id=sa;Password=$pw;Encrypt=True;TrustServerCertificate=True"
          export FV_FINAL_REPORT_DIR="$RUNNER_TEMP/report-xlsx"
          dotnet test app/backend/tests/FieldVisit.Application.Tests/FieldVisit.Application.Tests.csproj -c Release --filter FullyQualifiedName~FinalAdminReportBytesSqlTests --logger 'console;verbosity=normal'
          test "$(find "$FV_FINAL_REPORT_DIR" -maxdepth 1 -name '*.xlsx' | wc -l)" = 10
          (cd "$FV_FINAL_REPORT_DIR" && sha256sum *.xlsx) > "$RUNNER_TEMP/report-sha256.txt"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: final-admin-10-report-workbooks-03508fda
          path: |
            ${{ runner.temp }}/report-xlsx/*.xlsx
            ${{ runner.temp }}/report-sha256.txt
          retention-days: 30
