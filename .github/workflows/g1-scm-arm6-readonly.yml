name: G1 SCM ARM6 management read-only (NEW SEPARATE APPROVAL)
on:
  workflow_dispatch:
    inputs:
      approved_source_sha:
        description: NEW separately approved final Protected source SHA
        required: true
        type: string
      authorization_comment:
        description: NEW Issue41 G1_ARM6_EXECUTION_APPROVED consent comment
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: g1-scm-arm6-only-once
  cancel-in-progress: false
jobs:
  source:
    if: github.repository == 'Terry4410/field-visit-mileage-system' && github.ref == 'refs/heads/post-uat/v1.8.0' && github.actor == 'Terry4410' && github.triggering_actor == 'Terry4410' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
      issues: read
    env:
      G1_MODE: SCM_ARM6_READONLY
      ACCEPT_COST: 'false'
      APPROVED_SHA: ${{ inputs.approved_source_sha }}
      APPROVAL_COMMENT: ${{ inputs.authorization_comment }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fail-closed source plus fresh Owner run history guard before identity access
        run: |
          set -euo pipefail
          sha256sum --check scripts/ci/g1_bounded/checksums.sha256
          sha256sum --check scripts/ci/g1_arm6/checksums.sha256
          python3 scripts/ci/g1_arm6/guard.py
  identity:
    needs: source
    runs-on: ubuntu-latest
    environment: uat
    timeout-minutes: 1
    permissions:
      contents: none
    outputs:
      client: ${{ vars.AZURE_CLIENT_ID }}
      tenant: ${{ vars.AZURE_TENANT_ID }}
      subscription: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - run: test "${RUNNER_DEBUG:-}" != 1
  inspect:
    needs: [source, identity]
    permissions:
      contents: read
      actions: read
      issues: read
      id-token: write
    uses: ./.github/workflows/g1-arm6-worker.yml
    with:
      approved_source_sha: ${{ inputs.approved_source_sha }}
      authorization_comment: ${{ inputs.authorization_comment }}
    secrets:
      client: ${{ needs.identity.outputs.client }}
      tenant: ${{ needs.identity.outputs.tenant }}
      subscription: ${{ needs.identity.outputs.subscription }}
