name: Path B admin navigation frontend (NONDEPLOY)
on:
  push:
    branches: [fix/pathb-admin-navigation-20261124]
permissions:
  contents: read
concurrency:
  group: pathb-admin-navigation
  cancel-in-progress: false
jobs:
  frontend:
    if: github.repository == 'Terry4410/field-visit-mileage-system' && github.ref == 'refs/heads/fix/pathb-admin-navigation-20261124'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend tests and build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test -- --reporter=default
          npm run build
      - name: Seal exact Path B frontend candidate (activation requires separate approval)
        working-directory: frontend
        run: |
          set -euo pipefail
          node scripts/prepare-pathb-artifact.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path("dist/config.js")
          s=p.read_text()
          assert s.count('AUTH_MODE: "Demo",')==1
          p.write_text(s.replace('AUTH_MODE: "Demo",','AUTH_MODE: "Demo",\n  FORMAL_LOCATION_UAT: true,'))
          PY
          mkdir -p "$GITHUB_WORKSPACE/artifacts/frontend-release"
          (cd dist && zip -qr "$GITHUB_WORKSPACE/artifacts/frontend-release/PathB_FormalLocations_Frontend.zip" .)
          cd "$GITHUB_WORKSPACE/artifacts/frontend-release"
          unzip -tq PathB_FormalLocations_Frontend.zip
          sha256sum PathB_FormalLocations_Frontend.zip > SHA256SUMS
          printf 'SOURCE_SHA=%s\nMODE=NONDEPLOY\nTARGET=PathB\n' "$GITHUB_SHA" > manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pathb-admin-navigation-frontend-nondeploy
          path: artifacts/frontend-release
          if-no-files-found: error
          retention-days: 14
