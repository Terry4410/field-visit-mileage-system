permissions:
  contents: read
jobs:
  verify-stdlib-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify frozen G1 files remain bound
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib
          base=pathlib.Path("scripts/nondeploy/pathb_g1_install_acceptance_20261110")
          binding=json.loads((base/"binding-index.json").read_text())
          mismatches=[name for name,want in binding["files"].items()
                      if hashlib.sha256((base/name).read_bytes()).hexdigest()!=want]
          print("FROZEN_BINDING_MISMATCH_COUNT="+str(len(mismatches)))
          assert not mismatches
          PY
      - name: Offline stdlib unit tests — tools and Select22
        shell: bash
        run: |
          set -euo pipefail
          cd scripts/nondeploy/pathb_g1_install_acceptance_20261110
          python3 -m py_compile pathb_connection_only_tool_stage_nondeploy.py test_pathb_connection_only_tool_stage_nondeploy.py pathb_select22_app_once_candidate.py test_pathb_select22_app_once_candidate.py pathb_select22_ssh_session_nondeploy.py test_pathb_select22_ssh_session_nondeploy.py pathb_select22_receipt_bridge_nondeploy.py test_pathb_select22_receipt_bridge_nondeploy.py pathb_select22_persistent_claim_gate_nondeploy.py test_pathb_select22_persistent_claim_gate_nondeploy.py pathb_select22_bounded_sql_nondeploy.py test_pathb_select22_bounded_sql_nondeploy.py pathb_select22_isolated_stage_nondeploy.py test_pathb_select22_isolated_stage_nondeploy.py pathb_select22_isolated_ssh_stage_nondeploy.py test_pathb_select22_isolated_ssh_stage_nondeploy.py pathb_select22_remote_command_nondeploy.py test_pathb_select22_remote_command_nondeploy.py pathb_select22_session_receipt_nondeploy.py test_pathb_select22_session_receipt_nondeploy.py pathb_select22_handoff_nondeploy.py test_pathb_select22_handoff_nondeploy.py pathb_select22_storage_once_nondeploy.py test_pathb_select22_storage_once_nondeploy.py pathb_select22_owner_parent_nondeploy.py test_pathb_select22_owner_parent_nondeploy.py pathb_select22_management_snapshot_nondeploy.py test_pathb_select22_management_snapshot_nondeploy.py pathb_select22_storage_https_nondeploy.py test_pathb_select22_storage_https_nondeploy.py pathb_select22_direct_https_nondeploy.py test_pathb_select22_direct_https_nondeploy.py pathb_select22_storage_claim_bridge_nondeploy.py test_pathb_select22_storage_claim_bridge_nondeploy.py pathb_select22_owner_management_fetch_nondeploy.py test_pathb_select22_owner_management_fetch_nondeploy.py pathb_select22_mi_preflight_nondeploy.py test_pathb_select22_mi_preflight_nondeploy.py pathb_select22_mi_claims_nondeploy.py test_pathb_select22_mi_claims_nondeploy.py pathb_select22_owner_shared_receiver_nondeploy.py test_pathb_select22_owner_shared_receiver_nondeploy.py pathb_select22_owner_shared_parent_nondeploy.py test_pathb_select22_owner_shared_parent_nondeploy.py pathb_select22_owner_flow_simulation_nondeploy.py test_pathb_select22_owner_flow_simulation_nondeploy.py
          python3 -m unittest -v test_pathb_connection_only_tool_stage_nondeploy.py test_pathb_select22_app_once_candidate.py test_pathb_select22_ssh_session_nondeploy.py test_pathb_select22_receipt_bridge_nondeploy.py test_pathb_select22_persistent_claim_gate_nondeploy.py test_pathb_select22_bounded_sql_nondeploy.py test_pathb_select22_isolated_stage_nondeploy.py test_pathb_select22_isolated_ssh_stage_nondeploy.py test_pathb_select22_remote_command_nondeploy.py test_pathb_select22_session_receipt_nondeploy.py test_pathb_select22_handoff_nondeploy.py test_pathb_select22_storage_once_nondeploy.py test_pathb_select22_owner_parent_nondeploy.py test_pathb_select22_management_snapshot_nondeploy.py test_pathb_select22_storage_https_nondeploy.py test_pathb_select22_direct_https_nondeploy.py test_pathb_select22_storage_claim_bridge_nondeploy.py test_pathb_select22_owner_management_fetch_nondeploy.py test_pathb_select22_mi_preflight_nondeploy.py test_pathb_select22_mi_claims_nondeploy.py test_pathb_select22_owner_shared_receiver_nondeploy.py test_pathb_select22_owner_shared_parent_nondeploy.py test_pathb_select22_owner_flow_simulation_nondeploy.py
          python3 pathb_connection_only_tool_stage_nondeploy.py --check-config
      - name: Missing debs fail closed, zero connections
        shell: bash
        run: |
          set -euo pipefail
          cd scripts/nondeploy/pathb_g1_install_acceptance_20261110
          set +e
          output=$(python3 pathb_connection_only_tool_stage_nondeploy.py --offline-stage --debs-dir /nonexistent-pathb-debs)
          code=$?
          set -e
          test "$code" -eq 1
          printf '%s\n' "$output" | grep -Fx 'TOOL_STAGE=HOLD_DEBS_ABSENT'
          printf '%s\n' "$output" | grep -Fx 'SQL_CONNECTION=NO'
          echo 'MISSING_PACKAGE_FAIL_CLOSED=PASS'
          echo 'AZURE_TOKEN_SQL_INSTALLER_BLOB=NOT_RUN'

  build-verified-real-stage:
    name: Build real pinned Select22 NONDEPLOY stage
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[parent-gate-only]')
    needs: verify-stdlib-only
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: One-time pinned official .deb retrieval and exact ZIP verification
        shell: bash
        run: |
          set -euo pipefail
          cd scripts/nondeploy/pathb_g1_install_acceptance_20261110
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import ssl
          import tempfile
          from urllib.parse import urlparse
          from urllib.request import HTTPRedirectHandler, HTTPSHandler, Request, build_opener

          from pathb_connection_only_tool_stage_nondeploy import load_bound_config, stage_offline
          from pathb_select22_isolated_stage_nondeploy import build_stage, verify_stage

          class HTTPSOnlyRedirect(HTTPRedirectHandler):
              def __init__(self):
                  super().__init__()
                  self.redirects = 0

              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  dest = urlparse(newurl)
                  self.redirects += 1
                  if (self.redirects > 3 or dest.scheme != "https"
                      or not dest.hostname or dest.username or dest.password
                      or dest.port not in (None, 443)):
                      raise ValueError("OFFICIAL_REDIRECT_HOLD")
                  return super().redirect_request(req, fp, code, msg, headers, newurl)

          config = load_bound_config()
          opener = build_opener(HTTPSOnlyRedirect(), HTTPSHandler(context=ssl.create_default_context()))
          output = Path(os.environ["GITHUB_WORKSPACE"]) / "select22-verified"
          output.mkdir(mode=0o700)
          with tempfile.TemporaryDirectory(prefix="select22-pinned-debs-") as temp:
              debdir = Path(temp)
              for item in config["tools"]:
                  name = item["name"]
                  parsed = urlparse(item["url"])
                  if (parsed.scheme != "https"
                      or parsed.hostname not in {"packages.microsoft.com", "deb.debian.org"}
                      or parsed.port not in (None, 443)
                      or parsed.username or parsed.password or parsed.query or parsed.fragment
                      or not parsed.path.endswith(".deb")):
                      raise SystemExit("OFFICIAL_PACKAGE_URL_HOLD")
                  target = debdir / (name + ".deb")
                  digest = hashlib.sha256()
                  total = 0
                  try:
                      with opener.open(Request(item["url"], headers={"User-Agent": "PathB-SELECT22-pinned-nondeploy"}), timeout=30) as response, target.open("xb") as fout:
                          if response.status != 200:
                              raise ValueError("HTTP_NOT_200")
                          while True:
                              chunk = response.read(1024 * 1024)
                              if not chunk:
                                  break
                              total += len(chunk)
                              if total > 75_000_000:
                                  raise ValueError("PACKAGE_OVERSIZE")
                              digest.update(chunk)
                              fout.write(chunk)
                  except Exception as exc:
                      code = getattr(exc, "code", None)
                      reason = ("HTTP_" + str(code)) if type(code) is int else "TRANSPORT_OR_REDIRECT"
                      raise SystemExit("OFFICIAL_PACKAGE_RETRIEVAL_HOLD_" + name + "_" + reason) from None
                  if digest.hexdigest() != item["sha256"]:
                      raise SystemExit("PINNED_PACKAGE_SHA_HOLD_" + name)
                  print("VERIFIED_OFFICIAL_DEB_" + name.replace("-", "_").upper() + "=PASS")
              try:
                  if stage_offline(config, debdir) != "PASS":
                      raise ValueError("stage not verified")
              except Exception:
                  # Pure package metadata; never dump environment/identity/tokens.
                  import subprocess
                  with tempfile.TemporaryDirectory(prefix="select22-links-only-") as inspect:
                      tree = Path(inspect)
                      for item in config["tools"]:
                          subprocess.run(["dpkg-deb", "-x", str(debdir / (item["name"] + ".deb")), str(tree)],
                                         check=True, capture_output=True, timeout=30)
                      seen = 0
                      for link in tree.rglob("*"):
                          if not link.is_symlink():
                              continue
                          raw = os.readlink(link)
                          target = (link.parent / raw).resolve(strict=False)
                          if os.path.isabs(raw) or not target.is_relative_to(tree):
                              seen += 1
                              if seen <= 20:
                                  print("PINNED_DEB_LINK_" + str(link.relative_to(tree)) + "=" + raw)
                      print("PINNED_DEB_UNSAFE_LINK_COUNT=" + str(seen))
                  raise SystemExit("REAL_PINNED_BINARY_EXTRACTION_HOLD") from None
              print("REAL_PINNED_BINARY_HASHES_5_OF_5=PASS")
              stage, sha = build_stage(debdir)
              receipt = verify_stage(stage, sha)
              if receipt["packages"] != 5:
                  raise SystemExit("STAGE_PACKAGE_COUNT_HOLD")
              (output / "select22-stage.zip").write_bytes(stage)
              (output / "SHA256SUMS.txt").write_text(sha + "  select22-stage.zip\n", encoding="ascii")
              print("SELECT22_REAL_STAGE_SHA256=" + sha)
              print("SELECT22_REAL_STAGE_BYTES=" + str(len(stage)))
              print("ORIGINAL_INSTALLER=NOT_INCLUDED")
              print("AZURE_BLOB_SQL_TOKEN_DDL_DEPLOY=NOT_RUN")
          PY
      - name: Publish SHA-verified NONDEPLOY delivery artifact
        uses: actions/upload-artifact@v4
        with:
          name: pathb-select22-verified-stage
          path: select22-verified/
          if-no-files-found: error
          retention-days: 7
