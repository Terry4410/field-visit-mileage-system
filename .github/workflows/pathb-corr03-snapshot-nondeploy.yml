name: Path B CORR-03 immutable Snapshot NONDEPLOY check
on:
  push:
    branches:
      - fix/pathb-corr03-snapshot-append-only-20261123
permissions:
  contents: read
jobs:
  source-only-backend-check:
    if: github.repository == 'Terry4410/field-visit-mileage-system'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Enforce exact last-documented Path B backend source and minimal file scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor ba951287eff40e17003bd2de3166c7b913b86b8f HEAD
          git diff --name-only ba951287eff40e17003bd2de3166c7b913b86b8f HEAD | sort > "$RUNNER_TEMP/actual"
          printf '%s\n' \
            .github/workflows/pathb-corr03-snapshot-nondeploy.yml \
            backend/src/FieldVisit.Application/V180GoogleMileageContracts.cs \
            backend/src/FieldVisit.Infrastructure/V160FinalRepository.cs \
            backend/src/FieldVisit.Infrastructure/V180CorrectionClosureService.cs \
            backend/tests/FieldVisit.Application.Tests/V180CorrectionDecisionEvidenceTests.cs | sort > "$RUNNER_TEMP/expected"
          diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/actual"
          echo 'EXACT_SOURCE_AND_SCOPE=PASS'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install existing PDF test font
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk >/dev/null
      - name: Restore existing backend projects
        run: |
          dotnet restore backend/src/FieldVisit.Api/FieldVisit.Api.csproj
          dotnet restore backend/tests/FieldVisit.Application.Tests/FieldVisit.Application.Tests.csproj
      - name: Build backend without deployment
        run: dotnet build backend/src/FieldVisit.Api/FieldVisit.Api.csproj -c Release --no-restore
      - name: Run existing and focused backend tests
        run: dotnet test backend/tests/FieldVisit.Application.Tests/FieldVisit.Application.Tests.csproj -c Release --no-restore
      - name: Explicit nondeploy boundary
        run: |
          echo 'MODE=NONDEPLOY'
          echo 'API_DEPLOY=NOT_AUTHORIZED'
          echo 'SQL_GRANT=NOT_AUTHORIZED'
          echo 'UAT_WRITE=NOT_AUTHORIZED'
