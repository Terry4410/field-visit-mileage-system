name: G1 integrated UAT candidate NONDEPLOY
on:
  push:
    branches: [work/g1-single-uat-integration-20261021]
permissions:
  contents: read
jobs:
  focused:
    if: github.repository == 'Terry4410/field-visit-mileage-system' && github.ref == 'refs/heads/work/g1-single-uat-integration-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source and accepted histories
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor df03f8176f756cc5e243cd0593947b931ff7d3ce HEAD
          git merge-base --is-ancestor 1a1db58e8dfa2e6162f11a882f39e7bc41234952 HEAD
          git merge-base --is-ancestor 32f01677d0a0e25913d69443876089aff6a72cc9 HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Verify default OFF and activated candidate interfaces
        working-directory: frontend
        run: |
          npm test -- src/optionc-default-build.test.ts src/optionc-approval-ui.test.ts src/optionc-leader-review-ui.test.ts src/location-ownership-ui.test.ts src/optionc-excel-import-ui.test.ts src/optionc-activation-candidate.test.tsx
          npm run build
          if grep -R -q 'NONDEPLOY OPTION C ACTIVATION CANDIDATE' dist; then exit 1; fi
          npm run build:optionc-candidate
          grep -R -q 'NONDEPLOY OPTION C ACTIVATION CANDIDATE' dist
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Start isolated SQL Server 2022
        shell: bash
        run: |
          python3 - <<'PY'
          import os, secrets, subprocess, time
          from pathlib import Path
          password=secrets.token_urlsafe(30)+'!A9a'
          connection='Server=localhost,1433;Database=master;User Id=sa;Password='+password+';Encrypt=False;TrustServerCertificate=True;Connect Timeout=5'
          print('::add-mask::'+password,flush=True)
          print('::add-mask::'+connection,flush=True)
          env=Path(os.environ['RUNNER_TEMP'])/'g1-report-fixture.env'
          env.write_text('ACCEPT_EULA=Y\nMSSQL_PID=Developer\nMSSQL_SA_PASSWORD='+password+'\n')
          env.chmod(0o600)
          try:
              subprocess.run(['docker','run','-d','--name','g1-report-disposable','-p','127.0.0.1:1433:1433','--env-file',str(env),'mcr.microsoft.com/mssql/server:2022-latest'],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          finally: env.unlink(missing_ok=True)
          for _ in range(18):
              try:
                  probe=subprocess.run(['docker','exec','-e','SQLCMDPASSWORD='+password,'g1-report-disposable','/opt/mssql-tools18/bin/sqlcmd','-S','localhost','-U','sa','-C','-l','3','-Q','SELECT 1'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=5)
                  if probe.returncode == 0: break
              except subprocess.TimeoutExpired: pass
              time.sleep(5)
          else: raise SystemExit('DISPOSABLE_SQL_NOT_READY')
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('E1_R1_SQL_CONNECTION='+connection+'\n')
          print('DISPOSABLE_SQL_READY')
          PY
      - name: UAT denial through HTTP and disposable SQL
        env:
          E1_R1_REQUIRED: '1'
          OPTIONC_EXECUTION_MODE: Uat
        run: dotnet test backend/tests/FieldVisit.Application.Tests/FieldVisit.Application.Tests.csproj -c Release --filter 'FullyQualifiedName~G1_untrusted_uat_rejects_http_writes_before_business_changes|FullyQualifiedName~G1_http_write_endpoints_reach_guard_and_leave_no_partial_writes' --verbosity quiet
      - name: Isolated SQL low-risk writer regression
        env:
          E1_R1_REQUIRED: '1'
          OPTIONC_EXECUTION_MODE: IsolatedSqlTest
        run: dotnet test backend/tests/FieldVisit.Application.Tests/FieldVisit.Application.Tests.csproj -c Release --filter 'FullyQualifiedName~Frozen_lowrisk_policy_direct_save_uses_live_write_scope_and_atomic_version_audit' --verbosity quiet
      - name: RBAC and report focused real HTTP SQL regression
        env:
          E1_R1_REQUIRED: '1'
          OPTIONC_EXECUTION_MODE: IsolatedSqlTest
        run: dotnet test backend/tests/FieldVisit.Application.Tests/FieldVisit.Application.Tests.csproj -c Release --filter 'FullyQualifiedName~G1ReportExportHttpSqlTests' --verbosity quiet
      - name: Remove disposable SQL Server
        if: always()
        run: docker rm -f g1-report-disposable >/dev/null 2>&1 || true

  package-candidate:
    if: github.repository == 'Terry4410/field-visit-mileage-system' && github.ref == 'refs/heads/work/g1-single-uat-integration-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      api_sha: ${{ steps.hash.outputs.api_sha }}
      frontend_off_sha: ${{ steps.hash.outputs.frontend_off_sha }}
      frontend_candidate_sha: ${{ steps.hash.outputs.frontend_candidate_sha }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build API deployment package
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          dotnet restore backend/src/FieldVisit.Api/FieldVisit.Api.csproj
          dotnet publish backend/src/FieldVisit.Api/FieldVisit.Api.csproj -c Release --no-restore -o "$RUNNER_TEMP/api-publish"
          mkdir -p "$RUNNER_TEMP/api-publish/fonts" out
          cp /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc "$RUNNER_TEMP/api-publish/fonts/NotoSansCJK-Regular.ttc"
          test -s "$RUNNER_TEMP/api-publish/fonts/NotoSansCJK-Regular.ttc"
          python3 - <<'PY'
          import json,os,pathlib
          c=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'api-publish/appsettings.json').read_text())
          assert c['OptionC']['Candidate']['Enabled'] is False
          assert c['OptionC']['Approval']['Enabled'] is False
          assert c['ConnectionStrings']['DefaultConnection']=='SET-IN-AZURE-APP-SERVICE'
          print('API_DEFAULT_OFF_VERIFIED')
          PY
          (cd "$RUNNER_TEMP/api-publish" && zip -qr "$GITHUB_WORKSPACE/out/api.zip" .)
          dotnet list backend/src/FieldVisit.Api/FieldVisit.Api.csproj package --include-transitive > out/api-dependencies.txt
      - name: Build default OFF and marked candidate frontend packages
        shell: bash
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          if grep -R -q 'NONDEPLOY OPTION C ACTIVATION CANDIDATE' dist; then exit 1; fi
          (cd dist && zip -qr "$GITHUB_WORKSPACE/out/frontend-off.zip" .)
          npm run build:optionc-candidate
          grep -R -q 'NONDEPLOY OPTION C ACTIVATION CANDIDATE' dist
          (cd dist && zip -qr "$GITHUB_WORKSPACE/out/frontend-candidate.zip" .)
          sha256sum package-lock.json > "$GITHUB_WORKSPACE/out/frontend-lock.sha256"
      - name: Bind source, dependencies and package digests
        id: hash
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path('out')
          names=['api.zip','frontend-off.zip','frontend-candidate.zip','api-dependencies.txt','frontend-lock.sha256']
          digests={n:hashlib.sha256((p/n).read_bytes()).hexdigest() for n in names}
          manifest={'schema':1,'source_sha':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'packages':digests,'status':'BUILT_NOT_DEPLOYED','api_default_optionc':'OFF','frontend_modes':['OFF','NONDEPLOY_CANDIDATE']}
          (p/'manifest.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              for k,n in [('api_sha','api.zip'),('frontend_off_sha','frontend-off.zip'),('frontend_candidate_sha','frontend-candidate.zip')]:
                  f.write(k+'='+digests[n]+'\n')
          print('PACKAGE_SOURCE_AND_DIGESTS_BOUND')
          PY
      - name: Upload nondeploy packages
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: g1-deploy-packages-${{ github.sha }}
          path: out/
          if-no-files-found: error
          retention-days: 14
  verify-packages:
    needs: package-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Independently download exact artifact
        uses: actions/download-artifact@v4
        with:
          name: g1-deploy-packages-${{ github.sha }}
          path: retrieved
      - name: Verify package bytes and exact source
        env:
          EXPECTED_API: ${{ needs.package-candidate.outputs.api_sha }}
          EXPECTED_OFF: ${{ needs.package-candidate.outputs.frontend_off_sha }}
          EXPECTED_CANDIDATE: ${{ needs.package-candidate.outputs.frontend_candidate_sha }}
          ARTIFACT_ID: ${{ needs.package-candidate.outputs.artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re
          p=pathlib.Path('retrieved')
          m=json.loads((p/'manifest.json').read_text())
          assert m['source_sha']==os.environ['GITHUB_SHA'] and m['run_id']==os.environ['GITHUB_RUN_ID']
          assert m['run_attempt']==os.environ['GITHUB_RUN_ATTEMPT'] and m['status']=='BUILT_NOT_DEPLOYED'
          assert re.fullmatch(r'[0-9]+',os.environ['ARTIFACT_ID'])
          expected={'api.zip':os.environ['EXPECTED_API'],'frontend-off.zip':os.environ['EXPECTED_OFF'],'frontend-candidate.zip':os.environ['EXPECTED_CANDIDATE']}
          assert set(m['packages'])==set(expected)|{'api-dependencies.txt','frontend-lock.sha256'}
          for name,digest in m['packages'].items():
              assert re.fullmatch(r'[0-9a-f]{64}',digest)
              assert hashlib.sha256((p/name).read_bytes()).hexdigest()==digest
              if name in expected: assert digest==expected[name]
          print('INDEPENDENT_DOWNLOAD_HASH_VERIFIED source='+m['source_sha']+' artifact='+os.environ['ARTIFACT_ID'])
          for name,digest in expected.items(): print('PACKAGE_SHA256 '+name+' '+digest)
          PY
