name: UAT Automation Checks

on:
  push:
    branches:
      - work/v180-p2b-internal-uat-run20
    paths:
      - ".github/workflows/uat-smoke.yml"
      - "backend/tests/FieldVisit.Application.Tests/P2BBackgroundJobRuntimeHarnessTests.cs"
      - "uat/tests/trip-lifecycle.spec.ts"
      - "uat/tests/uat-test-helpers.ts"
  workflow_dispatch:
    inputs:
      base_url:
        description: UAT frontend URL
        required: false
        default: https://terry4410.github.io/field-visit-mileage-system/
      include_write_flow:
        description: Run Phase 2 write/cleanup lifecycle UAT
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      base_url:
        description: UAT frontend URL
        required: false
        type: string
        default: https://terry4410.github.io/field-visit-mileage-system/
      include_write_flow:
        description: Run Phase 2 write/cleanup lifecycle UAT
        required: false
        type: boolean
        default: false
    secrets:
      UAT_DEMO_PASSWORD:
        required: true
  pull_request:
    branches: [ v1.7.0-uat-candidate ]
    paths:
      - "uat/**"
      - ".github/workflows/uat-smoke.yml"
      - "backend/src/FieldVisit.Api/Controllers/UatAutomationController.cs"
      - "backend/tests/FieldVisit.Application.Tests/UatAutomationSafetyTests.cs"

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend regression and UAT safety tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Traditional Chinese PDF font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Run backend tests
        run: dotnet test backend/tests/FieldVisit.Application.Tests/FieldVisit.Application.Tests.csproj --configuration Release

  smoke:
    name: Playwright UAT checks
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      AUTHORITATIVE_SHA: 2fe86208da6d8c10767fd6309a6d467e5448d92a
      UAT_BASE_URL: ${{ inputs.base_url || 'https://terry4410.github.io/field-visit-mileage-system/' }}
      UAT_API_BASE_URL: https://api-fieldvisit-uat-cxauf4g8fzdyfsd9.eastasia-01.azurewebsites.net
      UAT_API_HEALTH_URL: https://api-fieldvisit-uat-cxauf4g8fzdyfsd9.eastasia-01.azurewebsites.net/health
      UAT_API_READY_URL: https://api-fieldvisit-uat-cxauf4g8fzdyfsd9.eastasia-01.azurewebsites.net/health/ready
      UAT_DEMO_PASSWORD: ${{ secrets.UAT_DEMO_PASSWORD }}
      P2B_SQL_PASSWORD: "P2B-Uat-Harness-2026!"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact harness event source
        if: (github.event_name == 'workflow_dispatch' && inputs.include_write_flow == true) || (github.event_name == 'push' && github.ref == 'refs/heads/work/v180-p2b-internal-uat-run20')
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          echo "HARNESS_SHA=$actual"
          echo "EVENT_SHA=$GITHUB_SHA"
          echo "HARNESS_TREE=$tree"
          test "$actual" = "$GITHUB_SHA"

      - name: Verify authoritative ancestor and harness-only scope
        if: (github.event_name == 'workflow_dispatch' && inputs.include_write_flow == true) || (github.event_name == 'push' && github.ref == 'refs/heads/work/v180-p2b-internal-uat-run20')
        shell: bash
        run: |
          set -euo pipefail

          test "$(git merge-base "$AUTHORITATIVE_SHA" HEAD)" = "$AUTHORITATIVE_SHA"
          git merge-base --is-ancestor "$AUTHORITATIVE_SHA" HEAD

          cat > /tmp/p2b-uat-expected-files.txt <<'EOF'
          .github/workflows/uat-smoke.yml
          backend/tests/FieldVisit.Application.Tests/P2BBackgroundJobRuntimeHarnessTests.cs
          uat/tests/trip-lifecycle.spec.ts
          uat/tests/uat-test-helpers.ts
          EOF

          git diff --name-only "$AUTHORITATIVE_SHA"...HEAD | sort > /tmp/p2b-uat-actual-files.txt
          sort /tmp/p2b-uat-expected-files.txt -o /tmp/p2b-uat-expected-files.txt

          echo "HARNESS_CHANGED_FILES:"
          cat /tmp/p2b-uat-actual-files.txt

          diff -u /tmp/p2b-uat-expected-files.txt /tmp/p2b-uat-actual-files.txt

          if git diff --name-only "$AUTHORITATIVE_SHA"...HEAD -- backend/src frontend/src database/migrations | grep -q .; then
            echo "Application source or migration drift detected."
            exit 1
          fi

      - name: Setup .NET 8 for P2B runtime proof
        if: (github.event_name == 'workflow_dispatch' && inputs.include_write_flow == true) || (github.event_name == 'push' && github.ref == 'refs/heads/work/v180-p2b-internal-uat-run20')
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Start ephemeral SQL Server for P2B runtime proof
        if: (github.event_name == 'workflow_dispatch' && inputs.include_write_flow == true) || (github.event_name == 'push' && github.ref == 'refs/heads/work/v180-p2b-internal-uat-run20')
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach \
            --name p2b-internal-uat-sql \
            --env ACCEPT_EULA=Y \
            --env MSSQL_PID=Developer \
            --env MSSQL_SA_PASSWORD="$P2B_SQL_PASSWORD" \
            --publish 1433:1433 \
            mcr.microsoft.com/mssql/server:2022-latest

          for attempt in $(seq 1 45); do
            if (echo > /dev/tcp/127.0.0.1/1433) >/dev/null 2>&1; then
              echo "Ephemeral SQL Server TCP endpoint is ready."
              exit 0
            fi
            echo "Waiting for ephemeral SQL Server ($attempt/45)..."
            sleep 2
          done

          echo "Ephemeral SQL Server did not become ready." >&2
          docker logs p2b-internal-uat-sql || true
          exit 1

      - name: P2B background mixed-failure runtime proof
        if: (github.event_name == 'workflow_dispatch' && inputs.include_write_flow == true) || (github.event_name == 'push' && github.ref == 'refs/heads/work/v180-p2b-internal-uat-run20')
        env:
          P2B_TEST_SQL_CONNECTION: "Server=127.0.0.1,1433;Database=P2BBackgroundJobHarness_${{ github.run_id }};User Id=sa;Password=${{ env.P2B_SQL_PASSWORD }};TrustServerCertificate=True;Encrypt=False"
        run: |
          dotnet test backend/tests/FieldVisit.Application.Tests/FieldVisit.Application.Tests.csproj \
            --configuration Release \
            --filter "FullyQualifiedName~P2BBackgroundJobRuntimeHarnessTests" \
            --logger "console;verbosity=normal"

      - name: Stop ephemeral SQL Server
        if: ${{ always() && ((github.event_name == 'workflow_dispatch' && inputs.include_write_flow == true) || (github.event_name == 'push' && github.ref == 'refs/heads/work/v180-p2b-internal-uat-run20')) }}
        run: docker rm --force p2b-internal-uat-sql || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install UAT dependencies
        working-directory: uat
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        working-directory: uat
        run: npx playwright install --with-deps chromium

      - name: Wait for API readiness
        shell: bash
        run: |
          set -euo pipefail
          consecutive=0
          for attempt in $(seq 1 18); do
            body="$(curl --silent --show-error --fail --max-time 15 "$UAT_API_READY_URL" || true)"

            if printf '%s' "$body" | python3 -c '
          import json
          import sys

          try:
              data = json.load(sys.stdin)
          except Exception:
              sys.exit(1)

          sys.exit(0 if data.get("status") == "ready" else 1)
          '
            then
              consecutive=$((consecutive + 1))
              echo "API readiness PASS ($consecutive/2)"
            else
              consecutive=0
              echo "API readiness not ready — attempt $attempt/18"
            fi

            if [ "$consecutive" -ge 2 ]; then
              echo "API readiness stabilized."
              exit 0
            fi

            if [ "$attempt" -lt 18 ]; then
              sleep 10
            fi
          done

          echo "API readiness did not stabilize within retry window." >&2
          exit 1

      - name: Run Phase 1 non-destructive smoke
        if: github.event_name != 'workflow_dispatch' || inputs.include_write_flow != true
        working-directory: uat
        run: npm run test:smoke

      - name: Run Phase 2 trip lifecycle
        if: github.event_name == 'workflow_call' && inputs.include_write_flow == true
        working-directory: uat
        run: npm run test:lifecycle

      - name: Run P2B Internal UAT
        if: (github.event_name == 'workflow_dispatch' && inputs.include_write_flow == true) || (github.event_name == 'push' && github.ref == 'refs/heads/work/v180-p2b-internal-uat-run20')
        working-directory: uat
        run: npm run test:internal-uat

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uat-playwright-report
          path: |
            uat/playwright-report
            uat/test-results
          if-no-files-found: ignore
          retention-days: 14
