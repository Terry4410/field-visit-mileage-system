name: UAT Automation Checks

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: UAT frontend URL
        required: false
        default: https://terry4410.github.io/field-visit-mileage-system/
      include_write_flow:
        description: Run Phase 2 write/cleanup lifecycle UAT
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      base_url:
        description: UAT frontend URL
        required: false
        type: string
        default: https://terry4410.github.io/field-visit-mileage-system/
      include_write_flow:
        description: Run Phase 2 write/cleanup lifecycle UAT
        required: false
        type: boolean
        default: false
    secrets:
      UAT_DEMO_PASSWORD:
        required: true
  pull_request:
    branches: [ v1.7.0-uat-candidate ]
    paths:
      - "uat/**"
      - ".github/workflows/uat-smoke.yml"
      - "backend/src/FieldVisit.Api/Controllers/UatAutomationController.cs"
      - "backend/tests/FieldVisit.Application.Tests/UatAutomationSafetyTests.cs"

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend regression and UAT safety tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Traditional Chinese PDF font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Run backend tests
        run: dotnet test backend/tests/FieldVisit.Application.Tests/FieldVisit.Application.Tests.csproj --configuration Release

  smoke:
    name: Playwright UAT checks
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      UAT_BASE_URL: ${{ inputs.base_url || 'https://terry4410.github.io/field-visit-mileage-system/' }}
      UAT_API_BASE_URL: https://api-fieldvisit-uat-cxauf4g8fzdyfsd9.eastasia-01.azurewebsites.net
      UAT_API_HEALTH_URL: https://api-fieldvisit-uat-cxauf4g8fzdyfsd9.eastasia-01.azurewebsites.net/health
      UAT_API_READY_URL: https://api-fieldvisit-uat-cxauf4g8fzdyfsd9.eastasia-01.azurewebsites.net/health/ready
      UAT_DEMO_PASSWORD: ${{ secrets.UAT_DEMO_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install UAT dependencies
        working-directory: uat
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        working-directory: uat
        run: npx playwright install --with-deps chromium

      - name: Wait for API readiness
        shell: bash
        run: |
          set -euo pipefail
          consecutive=0
          for attempt in $(seq 1 18); do
            body="$(curl --silent --show-error --fail --max-time 15 "$UAT_API_READY_URL" || true)"

            if printf '%s' "$body" | python3 -c '
          import json
          import sys

          try:
              data = json.load(sys.stdin)
          except Exception:
              sys.exit(1)

          sys.exit(0 if data.get("status") == "ready" else 1)
          '
            then
              consecutive=$((consecutive + 1))
              echo "API readiness PASS ($consecutive/2)"
            else
              consecutive=0
              echo "API readiness not ready — attempt $attempt/18"
            fi

            if [ "$consecutive" -ge 2 ]; then
              echo "API readiness stabilized."
              exit 0
            fi

            if [ "$attempt" -lt 18 ]; then
              sleep 10
            fi
          done

          echo "API readiness did not stabilize within retry window." >&2
          exit 1

      - name: Run Phase 1 non-destructive smoke
        working-directory: uat
        run: npm run test:smoke

      - name: Run Phase 2 trip lifecycle
        if: github.event_name != 'pull_request' && inputs.include_write_flow == true
        working-directory: uat
        run: npm run test:lifecycle

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uat-playwright-report
          path: |
            uat/playwright-report
            uat/test-results
          if-no-files-found: ignore
          retention-days: 14
