name: G1 D0 v3 focused offline NONDEPLOY
on:
  push:
    branches: [work/g1-d0-v3-offline-diagnostic-20261024]
    paths: ['scripts/ci/g1_d0_v3/**', 'docs/release/g1-d0-v3/**', '.github/workflows/g1-version-observation-v3.yml', '.github/workflows/g1-d0-v3-offline.yml', '.github/workflows/g1-d0-v3-worker.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Synthetic stage, redaction, count and source-boundary tests only
        run: |
          set -euo pipefail
          mkdir -p verification
          sha256sum --check scripts/ci/g1_bounded/checksums.sha256
          sha256sum --check scripts/ci/g1_d0_v3/checksums.sha256
          python3 -m unittest discover -s scripts/ci/g1_d0_v3 -p 'test_*.py' -v > verification/d0-v3-offline.txt 2>&1
          git rev-parse HEAD > verification/source-sha.txt
          git diff --name-status 0f81cc0878b3e29e90512c5a58ad2ee5afa8713e HEAD > verification/source-delta.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: g1-d0-v3-offline-${{ github.sha }}
          path: verification/
          retention-days: 30
