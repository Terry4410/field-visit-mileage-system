name: PR30 preflight output nondeploy validation

on:
  push:
    branches:
      - staging/preflight-output-visible-20261015
      - staging/pr30-preflight-failure-diagnostic-20261015
    paths:
      - .github/workflows/azure-sql-readonly-uat-smoke.yml
      - .github/workflows/pr30-preflight-output-nondeploy.yml
      - scripts/ci/test_pr30_preflight_output.ps1
      - scripts/ci/pr30_preflight_evidence.ps1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr30-preflight-output-nondeploy
  cancel-in-progress: false

jobs:
  synthetic-runtime:
    if: github.repository == 'Terry4410/field-visit-mileage-system' && (github.ref == 'refs/heads/staging/preflight-output-visible-20261015' || github.ref == 'refs/heads/staging/pr30-preflight-failure-diagnostic-20261015')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact staging source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify nondeploy execution boundary
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/pr30-preflight-output-nondeploy.yml
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(sha256sum docs/release/optionc-canonical-sql-draft/preflight/UAT_ReadOnly_Preflight.sql | cut -d' ' -f1)" = "44c20438c8125150d8cdbfae5e2dab40f23acea6386507b96bec31ff3cb10955"
          grep -Fxq "permissions:" "$workflow"
          grep -Fxq "  contents: read" "$workflow"
          forbidden_azure="azure/""login"
          forbidden_environment="environment:""[[:space:]]*uat"
          forbidden_oidc="id-token:""[[:space:]]*write"
          forbidden_sql="Invoke-""Sqlcmd"
          forbidden_cli="az ""login"
          for pattern in "$forbidden_azure" "$forbidden_environment" "$forbidden_oidc" "$forbidden_sql" "$forbidden_cli"; do
            if grep -Eq "$pattern" "$workflow"; then
              echo "Forbidden protected-access capability detected in nondeploy workflow." >&2
              exit 1
            fi
          done

      - name: Execute synthetic PowerShell DataSet matrix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/ci/test_pr30_preflight_output.ps1 `
            -WorkflowPath .github/workflows/azure-sql-readonly-uat-smoke.yml `
            -ModulePath scripts/ci/pr30_preflight_evidence.ps1 `
            -ExpectedSourceSha '${{ github.sha }}'
