name: P2B pilotv01 master-data atomic enablement

on:
  push:
    branches:
      - uat/p2b-pilotv01-master-data-enable-2fe86208
    paths:
      - ".github/workflows/p2b-pilotv01-master-data-enable.yml"

permissions:
  contents: read

concurrency:
  group: p2b-pilotv01-master-data-enable
  cancel-in-progress: false

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UAT_API_BASE_URL: https://api-fieldvisit-uat-cxauf4g8fzdyfsd9.eastasia-01.azurewebsites.net
      UAT_DEMO_PASSWORD: ${{ secrets.UAT_DEMO_PASSWORD }}

    steps:
      - name: Checkout exact enablement source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce enablement-only source boundary
        shell: bash
        run: |
          set -euo pipefail
          APPROVED=2fe86208da6d8c10767fd6309a6d467e5448d92a
          git merge-base --is-ancestor "$APPROVED" HEAD

          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/p2b-pilotv01-master-data-enable.yml
          scripts/p2b_pilotv01_master_data_enable.py
          EOF
          sort /tmp/expected.txt -o /tmp/expected.txt
          git diff --name-only "$APPROVED"...HEAD | sort > /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

          git diff --quiet "$APPROVED"...HEAD -- backend frontend database/migrations uat

      - name: Install controlled client dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet requests==2.32.5 openpyxl==3.1.5

      - name: Preview and atomically confirm pilotv01 master data
        run: python3 scripts/p2b_pilotv01_master_data_enable.py
