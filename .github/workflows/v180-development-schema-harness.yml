name: v1.8 development schema harness
# Trigger-only comment: 2026-09-09 BOM-normalized empty-db proof; no other harness logic change.

on:
  push:
    branches:
      - feature/uat-fasttrack-v180
    paths:
      - .github/workflows/v180-development-schema-harness.yml
  workflow_dispatch:

concurrency:
  group: v180-development-schema-harness
  cancel-in-progress: false

jobs:
  harness:
    if: github.repository == 'Terry4410/field-visit-mileage-system'
    runs-on: ubuntu-latest
    environment: uat
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate protected migration artifacts and ordered inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          printf 'commit=%s\nenvironment=uat\nazureMutation=false\n' "$GITHUB_SHA" > artifacts/harness-context.txt
          bash scripts/validate-fasttrack-strategy.sh
          bash scripts/validate-v180-development-compat.sh
          mapfile -t ups < <(find database/migrations -maxdepth 2 -path '*/1800_00*/Up.sql' | sort)
          mapfile -t verifies < <(find database/migrations -maxdepth 2 -path '*/1800_00*/Verify.sql' | sort)
          [[ "${#ups[@]}" -eq 7 && "${#verifies[@]}" -eq 7 ]] || { echo 'Expected exactly seven 1.8 migration pairs.' >&2; exit 1; }
          printf '%s\n' "${ups[@]}" | grep -q '1800_001_' 
          printf '%s\n' "${ups[@]}" | grep -q '1800_007_'

      - name: Install SqlPackage
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://aka.ms/sqlpackage-linux -o /tmp/sqlpackage.zip
          mkdir -p "$RUNNER_TEMP/sqlpackage"
          unzip -q /tmp/sqlpackage.zip -d "$RUNNER_TEMP/sqlpackage"
          chmod +x "$RUNNER_TEMP/sqlpackage/sqlpackage"
          echo "$RUNNER_TEMP/sqlpackage" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/sqlpackage/sqlpackage" /Version

      - name: Sign in to Azure with existing read-only UAT identity
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate fixed UAT target and extract one schema-only v1.7 source
        env:
          EXPECTED_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_SQL_SERVER_NAME: ${{ vars.AZURE_SQL_SERVER_NAME }}
          AZURE_SQL_DATABASE: ${{ vars.AZURE_SQL_DATABASE }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$AZURE_RESOURCE_GROUP" == rg-fieldvisit-uat ]] || exit 1
          [[ "$AZURE_SQL_SERVER_NAME" == sql-fieldvisit-jpe-uat ]] || exit 1
          [[ "$AZURE_SQL_DATABASE" == db-fieldvisit-uat ]] || exit 1
          az sql db show --resource-group "$AZURE_RESOURCE_GROUP" --server "$AZURE_SQL_SERVER_NAME" --name "$AZURE_SQL_DATABASE" --subscription "$EXPECTED_SUBSCRIPTION_ID" --query '{name:name,status:status}' --output json
          mkdir -p artifacts
          token="$(az account get-access-token --resource https://database.windows.net/ --query accessToken --output tsv)"
          [[ -n "$token" ]] || { echo 'Azure SQL access token unavailable' >&2; exit 1; }
          sqlpackage /Action:Extract \
            /SourceServerName:"${AZURE_SQL_SERVER_NAME}.database.windows.net" \
            /SourceDatabaseName:"$AZURE_SQL_DATABASE" \
            /AccessToken:"$token" \
            /TargetFile:"$RUNNER_TEMP/uat-v17-schema.dacpac" \
            /p:VerifyExtraction=True \
            /p:CommandTimeout=120
          test -s "$RUNNER_TEMP/uat-v17-schema.dacpac"

      - name: Start disposable SQL Server
        shell: bash
        env:
          SA_PASSWORD: ${{ secrets.DEV_SQL_SA_PASSWORD }}
        run: |
          set -euo pipefail
          password="${SA_PASSWORD:-DevHarness-$(openssl rand -hex 16)-Aa1!}"
          echo "DEV_SQL_SA_PASSWORD=$password" >> "$GITHUB_ENV"
          docker run --detach --name v180-dev-sql \
            --env ACCEPT_EULA=Y --env MSSQL_PID=Developer --env MSSQL_SA_PASSWORD="$password" \
            --publish 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          for i in $(seq 1 60); do
            if docker exec v180-dev-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$password" -C -Q 'SELECT 1' >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker logs v180-dev-sql
          exit 1

      - name: Publish v1.7 foundation into disposable database A
        shell: bash
        run: |
          set -euo pipefail
          sqlpackage /Action:Publish /SourceFile:"$RUNNER_TEMP/uat-v17-schema.dacpac" \
            /TargetConnectionString:"Server=localhost,1433;Database=DevV17Foundation;User ID=sa;Password=$DEV_SQL_SA_PASSWORD;Encrypt=False;TrustServerCertificate=True" \
            /p:CreateNewDatabase=True /p:BlockOnPossibleDataLoss=False \
            '/p:ExcludeObjectTypes=Users;DatabaseRoles;RoleMembership;Permissions;Logins;Credentials;DatabaseScopedCredentials'
          docker exec -i v180-dev-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$DEV_SQL_SA_PASSWORD" -C -b -d DevV17Foundation <<'SQL'
          IF NOT EXISTS (SELECT 1 FROM dbo.SchemaVersions WHERE VersionNumber = N'1.7.0-008')
              INSERT dbo.SchemaVersions (VersionNumber, Description, AppliedAt, AppliedBy)
              VALUES (N'1.7.0-008', N'Trusted v1.7 schema extraction marker', SYSUTCDATETIME(), N'development-harness');
          SQL

      - name: Capture 1800_005 predecessor constraint diagnostic
        shell: bash
        run: |
          set -euo pipefail
          sqlcmd=(docker exec -i v180-dev-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$DEV_SQL_SA_PASSWORD" -C -I -b -d DevV17Foundation)
          "${sqlcmd[@]}" -Q "SET NOCOUNT ON; SELECT cc.parent_object_id, cc.type_desc, cc.is_disabled, cc.is_not_trusted, cc.definition AS RawDefinition, LOWER(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(cc.definition, N'[', N''), N']', N''), N'(', N''), N')', N''), N' ', N''), CHAR(13), N''), CHAR(10), N''), CHAR(9), N'')) AS NormalizedDefinition FROM sys.check_constraints cc WHERE cc.parent_object_id = OBJECT_ID(N'dbo.MileageRateRules') AND cc.name = N'CK_MileageRateRules_VehicleType'; SELECT VehicleType, COUNT_BIG(*) AS VehicleCount FROM dbo.MileageRateRules GROUP BY VehicleType ORDER BY VehicleType;" | tee artifacts/1800_005-predecessor-constraint.txt

      - name: Apply development compatibility evolution and every original Verify.sql to database A
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          : > artifacts/v180-development-migration-matrix.txt
          sqlcmd=(docker exec -i v180-dev-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$DEV_SQL_SA_PASSWORD" -C -I -b -d DevV17Foundation)
          session_options=database/development/v1.8.0/compat/session-options.sql
          while IFS=$'\t' read -r migration apply verify; do
            echo "::group::$migration DEV APPLY"
            if cat "$session_options" "$apply" | "${sqlcmd[@]}"; then
              echo "$migration DEV APPLY | PASS" | tee -a artifacts/v180-development-migration-matrix.txt
            else
              echo "$migration DEV APPLY | FAIL" | tee -a artifacts/v180-development-migration-matrix.txt
              exit 1
            fi
            echo '::endgroup::'

            echo "::group::$migration ORIGINAL VERIFY"
            if cat "$session_options" "$verify" | "${sqlcmd[@]}"; then
              echo "$migration ORIGINAL VERIFY | PASS" | tee -a artifacts/v180-development-migration-matrix.txt
            else
              echo "$migration ORIGINAL VERIFY | FAIL" | tee -a artifacts/v180-development-migration-matrix.txt
              exit 1
            fi
            echo '::endgroup::'
          done < <(jq -r '.entries[] | [.migration,.developmentApply,.verify] | @tsv' database/development/v1.8.0/compat/manifest.json)

      - name: Prove database A structure and cleanliness
        shell: bash
        run: |
          set -euo pipefail
          sqlcmd=(docker exec -i v180-dev-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$DEV_SQL_SA_PASSWORD" -C -b -d DevV17Foundation)
          "${sqlcmd[@]}" < database/baseline/v1.8.0/Verify.sql
          "${sqlcmd[@]}" < database/development/v1.8.0/Verify.sql

      - name: Generate schema-only script and prove empty database B
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          sqlpackage /Action:Extract \
            /SourceConnectionString:"Server=localhost,1433;Database=DevV17Foundation;User ID=sa;Password=$DEV_SQL_SA_PASSWORD;Encrypt=False;TrustServerCertificate=True" \
            /TargetFile:artifacts/v180-development.dacpac \
            /p:ExtractAllTableData=False /p:VerifyExtraction=True
          sqlcmd=(docker exec -i v180-dev-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$DEV_SQL_SA_PASSWORD" -C -b)
          "${sqlcmd[@]}" -d master -Q 'CREATE DATABASE DevV18EmptyProof'
          sqlpackage /Action:Script /SourceFile:artifacts/v180-development.dacpac \
            /TargetConnectionString:"Server=localhost,1433;Database=DevV18EmptyProof;User ID=sa;Password=$DEV_SQL_SA_PASSWORD;Encrypt=False;TrustServerCertificate=True" \
            /OutputPath:artifacts/v180-development-schema.sql \
            /p:ScriptDatabaseOptions=False \
            '/p:ExcludeObjectTypes=Users;DatabaseRoles;RoleMembership;Permissions;Logins;Credentials;DatabaseScopedCredentials'
          test -s artifacts/v180-development-schema.sql
          python3 -c 'from pathlib import Path; p=Path("artifacts/v180-development-schema.sql"); d=p.read_bytes(); p.write_bytes(d[3:] if d.startswith(b"\xef\xbb\xbf") else d)'
          "${sqlcmd[@]}" -d DevV18EmptyProof < artifacts/v180-development-schema.sql
          "${sqlcmd[@]}" -d DevV18EmptyProof < database/development/v1.8.0/SchemaVersions.sql
          "${sqlcmd[@]}" -d DevV18EmptyProof < database/baseline/v1.8.0/Verify.sql
          "${sqlcmd[@]}" -d DevV18EmptyProof < database/development/v1.8.0/Verify.sql
          "${sqlcmd[@]}" -d DevV18EmptyProof -Q "SELECT COUNT(*) AS CustomPrincipalCount FROM sys.database_principals WHERE name NOT IN (N'dbo',N'guest',N'INFORMATION_SCHEMA',N'sys',N'public') AND type IN ('S','U','G','E','X'); SELECT COUNT(*) AS UserRows FROM dbo.Users; SELECT COUNT(*) AS TripRows FROM dbo.VisitTrips;"

      - name: Normalize and hash development artifact
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/\r$//' artifacts/v180-development-schema.sql
          sha256sum artifacts/v180-development-schema.sql | tee artifacts/v180-development-schema.sha256
          cat > artifacts/v180-development-result.json <<'JSON'
          {"status":"mutable-development-harness-pass","finalBaseline":false,"frozen":false,"azureUatMutation":false,"source":"one-read-only-UAT-schema-only-extraction","migrationRange":"1800_001 through 1800_007"}
          JSON

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install frontend dependencies
        run: npm --prefix frontend ci --no-audit --no-fund

      - name: Run Fast Regression once
        shell: bash
        run: bash scripts/test-fast-regression.sh

      - name: Upload disposable harness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v180-development-schema-harness-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
