name: PR29 isolated read-only preflight runtime verification

on:
  push:
    branches:
      - work/v180-optionc-final-gates-recovery-r1

permissions:
  contents: read

concurrency:
  group: pr29-runtime-${{ github.ref }}
  cancel-in-progress: false

env:
  STAGING_SHA: 6e26755f4a19fa63b4331d8fb7fc1e6cc97533cd
  STAGING_SQL_SHA256: 44c20438c8125150d8cdbfae5e2dab40f23acea6386507b96bec31ff3cb10955

jobs:
  runtime-verification:
    if: ${{ github.repository == 'Terry4410/field-visit-mileage-system' && github.ref == 'refs/heads/work/v180-optionc-final-gates-recovery-r1' }}
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: FieldVisit_Recovery!Sql2022
        ports:
          - 1433:1433
        options: >-
          --health-cmd "(/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'FieldVisit_Recovery!Sql2022' -C -Q 'SELECT 1' || exit 1)"
          --health-interval 10s --health-timeout 5s --health-retries 30

    steps:
      - name: Checkout Recovery exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Checkout PR29 staging exact SHA
        uses: actions/checkout@v4
        with:
          repository: Terry4410/field-visit-mileage-system
          ref: 2ab1e91daafc28b5fba0ac7a5e115cb716b4c804
          path: staging-source
          fetch-depth: 1

      - name: Verify exact staging SQL and target boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/work/v180-optionc-final-gates-recovery-r1"
          test "$(git -C staging-source rev-parse HEAD)" = "${STAGING_SHA}"
          sql="staging-source/docs/release/optionc-canonical-sql-draft/preflight/UAT_ReadOnly_Preflight.sql"
          actual="$(sha256sum "$sql" | cut -d' ' -f1)"
          test "$actual" = "${STAGING_SQL_SHA256}"
          ! grep -Eiq '(^|[[:space:]])(INSERT|UPDATE|DELETE|MERGE|CREATE|ALTER|DROP|TRUNCATE|GRANT|DENY|REVOKE)[[:space:]]' "$sql"
          echo "staging_sha=$(git -C staging-source rev-parse HEAD)"
          echo "sql_sha256=$actual"
          echo "mutation_keyword_scan=PASS"

      - name: Install pinned PowerShell and SqlServer module
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          Write-Host 'Available SqlServer versions:'
          Find-Module -Name SqlServer -AllVersions -Repository PSGallery -ErrorAction Stop | Select-Object -First 12 Version | Format-Table -AutoSize
          Install-Module -Name SqlServer -RequiredVersion 22.4.5.1 -Scope CurrentUser -Force -AllowClobber -Repository PSGallery -ErrorAction Stop
          Import-Module SqlServer -RequiredVersion 22.4.5.1 -Force -ErrorAction Stop
          $m = Get-Module SqlServer
          if (-not $m -or $m.Version -ne [version]'22.4.5.1') { throw 'SqlServer 22.4.5.1 not available' }
          Write-Host "SqlServerVersion=$($m.Version)"

      - name: Execute Invoke-Sqlcmd runtime matrix
        shell: pwsh
        env:
          SA_PASSWORD: FieldVisit_Recovery!Sql2022
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Import-Module SqlServer -Force
          $server = 'localhost,1433'
          $sa = 'sa'
          $saPassword = $env:SA_PASSWORD
          $roLogin = 'pr29_preflight_ro'
          $roPassword = 'Pr29_ReadOnly_2026!xY7'
          $source = Join-Path $env:GITHUB_WORKSPACE 'staging-source/docs/release/optionc-canonical-sql-draft/preflight/UAT_ReadOnly_Preflight.sql'
          $varsBase = @{ EXPECTED_SERVER = 'localhost,1433'; EXPECTED_DATABASE = 'OptionCIsolated_PR29_Runtime' }
          function Admin([string]$q,[string]$db='master') {
            Invoke-Sqlcmd -ServerInstance $server -Database $db -Username $sa -Password $saPassword -TrustServerCertificate -ApplicationIntent ReadWrite -Query $q -AbortOnError -QueryTimeout 60 | Out-Null
          }
          function RunPreflight([hashtable]$v,[string]$db,[string]$user=$roLogin,[string]$password=$roPassword) {
            Invoke-Sqlcmd -ServerInstance $server -Database $db -Username $user -Password $password -TrustServerCertificate -ApplicationIntent ReadOnly -ConnectionTimeout 10 -QueryTimeout 60 -AbortOnError -Variable $v -InputFile $source | Out-Null
          }
          function ExpectSqlGuard([string]$name,[int]$code,[scriptblock]$action) {
            try { & $action; throw "EXPECTED_FAILURE_NOT_OBSERVED:$name" }
            catch {
              $message = $_.Exception.ToString()
              if ($message -like 'EXPECTED_FAILURE_NOT_OBSERVED:*') { throw }
              if ($message -notmatch "(?i)(Msg\s+$code\b|ErrorNumber[^0-9]*$code\b|\b$code\b)") {
                throw "UNEXPECTED_FAILURE:$name:$message"
              }
              Write-Host "FAIL_CLOSED_PASS $name code=$code"
            }
          }
          function ExpectPreprocessFailure([string]$name,[scriptblock]$action) {
            try { & $action; throw "EXPECTED_FAILURE_NOT_OBSERVED:$name" }
            catch {
              $message = $_.Exception.ToString()
              if ($message -like 'EXPECTED_FAILURE_NOT_OBSERVED:*') { throw }
              if ($message -notmatch '(?i)(sqlcmd|variable|not defined|undefined|not found)') {
                throw "UNEXPECTED_PREPROCESS_FAILURE:$name:$message"
              }
              Write-Host "PREPROCESS_FAIL_CLOSED_PASS $name"
            }
          }
          function NewDb([string]$name,[string]$version,[bool]$canonical,[string]$stage='none',[bool]$withLocations=$true) {
            Admin "IF DB_ID(N'$name') IS NOT NULL BEGIN ALTER DATABASE [$name] SET SINGLE_USER WITH ROLLBACK IMMEDIATE; DROP DATABASE [$name]; END; CREATE DATABASE [$name];"
            Admin "CREATE USER [$roLogin] FOR LOGIN [$roLogin]; ALTER ROLE db_datareader ADD MEMBER [$roLogin];" $name
            Admin "CREATE TABLE dbo.SchemaVersions(VersionNumber NVARCHAR(64) NOT NULL,AppliedAt DATETIME2 NOT NULL); INSERT dbo.SchemaVersions VALUES(N'$version',SYSUTCDATETIME());" $name
            if ($withLocations) { Admin "CREATE TABLE dbo.Locations(LocationId INT NOT NULL PRIMARY KEY,Name NVARCHAR(100) NOT NULL); INSERT dbo.Locations VALUES(1,N'Fixture');" $name }
            if ($canonical) {
              Admin "CREATE TABLE dbo.ChangeRequests(RequestPublicId NVARCHAR(100) NOT NULL PRIMARY KEY,DecisionKey NVARCHAR(100) NOT NULL); CREATE TABLE dbo.ChangeRequestEvents(ChangeRequestId NVARCHAR(100) NOT NULL,EventType NVARCHAR(100) NOT NULL,DecisionKey NVARCHAR(100) NOT NULL);" $name
            }
            if ($stage -eq 'partial') { Admin "CREATE TABLE dbo.LocationPublicationStages(StageId INT NOT NULL PRIMARY KEY);" $name }
          }
          try {
            Admin "IF SUSER_ID(N'$roLogin') IS NOT NULL DROP LOGIN [$roLogin]; CREATE LOGIN [$roLogin] WITH PASSWORD = N'$roPassword', CHECK_POLICY = OFF;"
            NewDb 'OptionCIsolated_PR29_Runtime' '1.8.0-010' $false
            RunPreflight $varsBase 'OptionCIsolated_PR29_Runtime'
            Write-Host 'CORRECT_VARIABLES_PASS'
            ExpectPreprocessFailure 'missing-server' { RunPreflight @{ EXPECTED_DATABASE='OptionCIsolated_PR29_Runtime' } 'OptionCIsolated_PR29_Runtime' }
            ExpectSqlGuard 'empty-server' 51000 { RunPreflight @{ EXPECTED_SERVER=''; EXPECTED_DATABASE='OptionCIsolated_PR29_Runtime' } 'OptionCIsolated_PR29_Runtime' }
            ExpectSqlGuard 'wrong-database' 51002 { RunPreflight @{ EXPECTED_SERVER='localhost,1433'; EXPECTED_DATABASE='WrongDb' } 'OptionCIsolated_PR29_Runtime' }
            ExpectSqlGuard 'wrong-server' 51023 { RunPreflight @{ EXPECTED_SERVER='wrong.example.invalid'; EXPECTED_DATABASE='OptionCIsolated_PR29_Runtime' } 'OptionCIsolated_PR29_Runtime' }
            ExpectSqlGuard 'quote-injection' 51004 { RunPreflight @{ EXPECTED_SERVER="localhost,1433'"; EXPECTED_DATABASE='OptionCIsolated_PR29_Runtime' } 'OptionCIsolated_PR29_Runtime' }
            ExpectSqlGuard 'semicolon-injection' 51004 { RunPreflight @{ EXPECTED_SERVER='localhost,1433;DROP DATABASE master'; EXPECTED_DATABASE='OptionCIsolated_PR29_Runtime' } 'OptionCIsolated_PR29_Runtime' }
            ExpectSqlGuard 'approved-fqdn-on-disposable' 51003 { RunPreflight @{ EXPECTED_SERVER='sql-fieldvisit-jpe-uat.database.windows.net'; EXPECTED_DATABASE='db-fieldvisit-uat' } 'OptionCIsolated_PR29_Runtime' }
            ExpectSqlGuard 'non-loopback' 51023 { RunPreflight @{ EXPECTED_SERVER='10.0.0.1'; EXPECTED_DATABASE='OptionCIsolated_PR29_Runtime' } 'OptionCIsolated_PR29_Runtime' }
            ExpectSqlGuard 'db-owner' 51022 { RunPreflight $varsBase 'OptionCIsolated_PR29_Runtime' $sa $saPassword }
            Admin "ALTER ROLE db_datawriter ADD MEMBER [$roLogin];" 'OptionCIsolated_PR29_Runtime'
            ExpectSqlGuard 'db-datawriter' 51022 { RunPreflight $varsBase 'OptionCIsolated_PR29_Runtime' }
            Admin "ALTER ROLE db_datawriter DROP MEMBER [$roLogin]; GRANT UPDATE ON dbo.Locations TO [$roLogin];" 'OptionCIsolated_PR29_Runtime'
            ExpectSqlGuard 'table-write-permission' 51022 { RunPreflight $varsBase 'OptionCIsolated_PR29_Runtime' }
            Admin "REVOKE UPDATE ON dbo.Locations FROM [$roLogin];" 'OptionCIsolated_PR29_Runtime'
            NewDb 'OptionCIsolated_PR29_008' '1.8.0-008' $false
            RunPreflight @{ EXPECTED_SERVER='localhost,1433'; EXPECTED_DATABASE='OptionCIsolated_PR29_008' } 'OptionCIsolated_PR29_008'
            NewDb 'OptionCIsolated_PR29_009' '1.8.0-009' $false
            RunPreflight @{ EXPECTED_SERVER='localhost,1433'; EXPECTED_DATABASE='OptionCIsolated_PR29_009' } 'OptionCIsolated_PR29_009'
            NewDb 'OptionCIsolated_PR29_Partial011' '1.8.0-008' $true
            ExpectSqlGuard '008-canonical-unrecorded' 51026 { RunPreflight @{ EXPECTED_SERVER='localhost,1433'; EXPECTED_DATABASE='OptionCIsolated_PR29_Partial011' } 'OptionCIsolated_PR29_Partial011' }
            NewDb 'OptionCIsolated_PR29_Partial014' '1.8.0-014' $false 'partial'
            ExpectSqlGuard 'partial-014' 51016 { RunPreflight @{ EXPECTED_SERVER='localhost,1433'; EXPECTED_DATABASE='OptionCIsolated_PR29_Partial014' } 'OptionCIsolated_PR29_Partial014' }
            NewDb 'OptionCIsolated_PR29_NoLocations' '1.8.0-010' $false 'none' $false
            ExpectSqlGuard 'missing-required-locations-unknown-permissions' 51024 { RunPreflight @{ EXPECTED_SERVER='localhost,1433'; EXPECTED_DATABASE='OptionCIsolated_PR29_NoLocations' } 'OptionCIsolated_PR29_NoLocations' }
            NewDb 'OptionCIsolated_PR29_Unexpected013' '1.8.0-014' $false
            Admin "INSERT dbo.SchemaVersions VALUES(N'1.8.0-013',SYSUTCDATETIME());" 'OptionCIsolated_PR29_Unexpected013'
            ExpectSqlGuard 'unexpected-013-marker' 51027 { RunPreflight @{ EXPECTED_SERVER='localhost,1433'; EXPECTED_DATABASE='OptionCIsolated_PR29_Unexpected013' } 'OptionCIsolated_PR29_Unexpected013' }
            NewDb 'OptionCIsolated_PR29_Integrity' '1.8.0-010' $false
            Admin "CREATE TABLE dbo.ProjectLocations(LocationId INT NOT NULL); INSERT dbo.ProjectLocations VALUES(999);" 'OptionCIsolated_PR29_Integrity'
            ExpectSqlGuard 'orphan-project-location' 51030 { RunPreflight @{ EXPECTED_SERVER='localhost,1433'; EXPECTED_DATABASE='OptionCIsolated_PR29_Integrity' } 'OptionCIsolated_PR29_Integrity' }
            Write-Host 'PR29_RUNTIME_MATRIX=PASS'
          } finally {
            foreach ($db in @('OptionCIsolated_PR29_Runtime','OptionCIsolated_PR29_008','OptionCIsolated_PR29_009','OptionCIsolated_PR29_Partial011','OptionCIsolated_PR29_Partial014','OptionCIsolated_PR29_NoLocations','OptionCIsolated_PR29_Unexpected013','OptionCIsolated_PR29_Integrity')) {
              try { Admin "IF DB_ID(N'$db') IS NOT NULL BEGIN ALTER DATABASE [$db] SET SINGLE_USER WITH ROLLBACK IMMEDIATE; DROP DATABASE [$db]; END;" } catch { Write-Warning "cleanup $db failed: $($_.Exception.Message)" }
            }
            try { Admin "IF SUSER_ID(N'$roLogin') IS NOT NULL DROP LOGIN [$roLogin];" } catch { Write-Warning "cleanup login failed: $($_.Exception.Message)" }
          }

      - name: Validate Azure CLI read-only syntax
        shell: bash
        run: |
          az sql db str-policy show --help | grep -E -- '--name' >/dev/null
          ! az sql db str-policy show --help | grep -E -- '--database'
          echo "azure_cli_str_policy_name_argument=PASS"
