name: Build Test and Deploy Frontend to GitHub Pages
on:
  push:
    branches: [ main ]
    paths: [ "frontend/**", ".github/workflows/frontend-pages.yml" ]
  workflow_dispatch:
    inputs:
      approved_sha:
        description: "Owner-approved exact 40-character commit SHA"
        required: true
        type: string
      operation:
        description: "deploy_candidate or rollback to pinned prior UAT source"
        required: true
        type: choice
        default: deploy_candidate
        options:
          - deploy_candidate
          - rollback
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Gate manual deployment to exact Owner-approved candidate SHA
        if: github.event_name == 'workflow_dispatch'
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/work/v180-visitor-only-uat010-security-fix"
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          case "${{ inputs.operation }}" in
            deploy_candidate) test "$APPROVED_SHA" = "$GITHUB_SHA" ;;
            rollback) test "$APPROVED_SHA" = "007b79dba12a1668b66164ac9f8440bbb8ac8e90" ;;
            *) echo "::error::Unsupported deployment operation"; exit 1 ;;
          esac
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.approved_sha || github.sha }}
      - name: Verify checkout source SHA
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.approved_sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run test
      - run: npm run build
      - name: Stamp and verify frontend artifact provenance
        run: |
          git rev-parse HEAD > dist/source-sha.txt
          test "$(cat dist/source-sha.txt)" = "$(git rev-parse HEAD)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  uat-browser-smoke:
    name: UAT Automation Checks
    needs: deploy
    uses: ./.github/workflows/uat-smoke.yml
    with:
      include_write_flow: false
    secrets:
      UAT_DEMO_PASSWORD: ${{ secrets.UAT_DEMO_PASSWORD }}
