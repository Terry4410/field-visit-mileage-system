name: Run17 residual application cleanup

on:
  workflow_dispatch:
    inputs:
      confirm_cleanup:
        description: "Type CLEAN_RUN17_RESIDUAL to confirm exact Run17 UAT cleanup"
        required: true
        type: string

permissions:
  contents: read

jobs:
  cleanup:
    if: ${{ inputs.confirm_cleanup == 'CLEAN_RUN17_RESIDUAL' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      API: https://api-fieldvisit-uat-cxauf4g8fzdyfsd9.eastasia-01.azurewebsites.net
      UAT_DEMO_PASSWORD: ${{ secrets.UAT_DEMO_PASSWORD }}

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Guard authoritative application baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE=894435039ff7b04ef0007b73c6d60d592d3cada9

          git fetch origin post-uat/v1.8.0 --depth=50
          CURRENT="$(git rev-parse FETCH_HEAD)"
          echo "CURRENT_AUTHORITATIVE_SHA=$CURRENT"
          echo "APPROVED_APPLICATION_BASE=$BASE"

          git merge-base --is-ancestor "$BASE" "$CURRENT"

          git diff --quiet "$BASE" "$CURRENT" -- \
            backend \
            frontend \
            database/migrations \
            uat

          changed="$(git diff --name-only "$BASE" "$CURRENT" | sort)"
          echo "CHANGED_SINCE_APPROVED_BASE:"
          printf '%s\n' "$changed"

          allowed=".github/workflows/run17-residual-application-cleanup.yml"
          unexpected="$(printf '%s\n' "$changed" | grep -v -x "$allowed" || true)"
          test -z "$unexpected"

      - name: Cleanup exact Run17 UAT-AUTO residual trips and jobs
        shell: bash
        run: |
          set -euo pipefail

          login() {
            local account="$1"
            curl --silent --show-error --fail \
              -H 'Content-Type: application/json' \
              -d "{\"account\":\"$account\",\"password\":\"$UAT_DEMO_PASSWORD\"}" \
              "$API/api/v1/auth/demo-login"
          }

          admin_json="$(login pilota01)"
          visitor_json="$(login pilotv01)"
          leader_json="$(login pilotl01)"

          admin_token="$(printf '%s' "$admin_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["accessToken"])')"
          visitor_token="$(printf '%s' "$visitor_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["accessToken"])')"
          leader_token="$(printf '%s' "$leader_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["accessToken"])')"

          cleanup_trip() {
            local id="$1"
            local purpose="$2"
            local job="${3:-}"
            local payload

            if [ -n "$job" ]; then
              payload="$(python3 - "$id" "$purpose" "$job" <<'PY'
import json,sys
print(json.dumps({
    "visitTripId": int(sys.argv[1]),
    "expectedPurpose": sys.argv[2],
    "backgroundJobId": sys.argv[3]
}))
PY
)"
            else
              payload="$(python3 - "$id" "$purpose" <<'PY'
import json,sys
print(json.dumps({
    "visitTripId": int(sys.argv[1]),
    "expectedPurpose": sys.argv[2]
}))
PY
)"
            fi

            response="$(curl --silent --show-error --fail \
              -H "Authorization: Bearer $admin_token" \
              -H 'X-Active-Role: admin' \
              -H "X-UAT-Automation-Key: $UAT_DEMO_PASSWORD" \
              -H 'Content-Type: application/json' \
              -d "$payload" \
              "$API/api/v1/uat-automation/cleanup-trip")"

            printf '%s' "$response" > "/tmp/cleanup-$id.json"

            python3 - "$id" "${job:-}" "/tmp/cleanup-$id.json" <<'PY'
import json,sys
trip = int(sys.argv[1])
job = sys.argv[2]
path = sys.argv[3]
d = json.load(open(path, encoding="utf-8"))

assert d["visitTripId"] == trip, d
assert d["tripsDeleted"] == 1, d
if job:
    assert d["backgroundJobsDeleted"] == 1, d

print(
    f"RUN17_CLEANUP|{trip}|PASS|"
    f"jobsDeleted={d['backgroundJobsDeleted']}|"
    f"snapshotsDeleted={d['snapshotsDeleted']}|"
    f"correctionsDeleted={d['correctionRequestsDeleted']}"
)
PY

            trip_code="$(curl --silent \
              --output "/tmp/trip-$id.json" \
              --write-out '%{http_code}' \
              -H "Authorization: Bearer $visitor_token" \
              -H 'X-Active-Role: visitor' \
              "$API/api/v1/trips/$id")"
            test "$trip_code" = "404"

            if [ -n "$job" ]; then
              job_code="$(curl --silent \
                --output "/tmp/job-$id.json" \
                --write-out '%{http_code}' \
                -H "Authorization: Bearer $leader_token" \
                -H 'X-Active-Role: leader' \
                "$API/api/v1/jobs/$job")"
              test "$job_code" = "404"
            fi
          }

          cleanup_trip 96 'UAT-AUTO-VIS-01-VIS-05-1790233650799-vhb8pt'
          cleanup_trip 97 'UAT-AUTO-VIS-04-1790233660385-cv08hw'
          cleanup_trip 98 'UAT-AUTO-LEAD-04-VIS-06-1790233668886-6n6lba' 'fc702eca-40a2-4bf5-a0e6-10e048002650'
          cleanup_trip 99 'UAT-AUTO-VIS-03-1790233722649-ubcprw'
          cleanup_trip 100 'UAT-AUTO-QUERY-01-05-1790233731855-uzroza' 'a907b50f-7da2-4ea6-91ac-b7512d5a78e7'
          cleanup_trip 101 'UAT-AUTO-CORR-01-04-1790233786859-djnzui' 'c16b3497-3836-4003-8b9f-e635d0e49b43'
          cleanup_trip 102 'UAT-AUTO-SUP-01-1790233840520-jbk5lm' 'f4b2bcb1-cc72-4428-abba-08771d966d79'
          cleanup_trip 103 'UAT-AUTO-1790233914687-v2vv63' 'cdc13e64-ff21-4af4-a53a-0a8b37745914'

          echo "RUN17_EXACT_TRIP_JOB_CLEANUP=PASS"
