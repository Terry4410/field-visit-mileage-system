name: UAT schema fidelity protected proposal (nondeploy)

on:
  push:
    branches:
      - work/uat-schema-fidelity-protected-proposal-20261016
      - work/uat-schema-inventory-failure-diagnostic-20261016
      - work/uat-schema-r2-unknown-failure-diagnostic-20261016
  pull_request:
    branches:
      - post-uat/v1.8.0
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uat-schema-fidelity-proposal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static-and-comparator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: Disposable_SQL_2026!Only
        ports:
          - 1433:1433
    steps:
      - name: Checkout exact proposal SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Enforce nondeploy boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          workflow=.github/workflows/uat-schema-fidelity-proposal-nondeploy.yml
          grep -Fxq "permissions:" "$workflow"
          grep -Fxq "  contents: read" "$workflow"
          forbidden_azure="azure/""login"
          forbidden_environment="environment:""[[:space:]]*uat"
          forbidden_oidc="id-token:""[[:space:]]*write"
          forbidden_sql="Invoke-""Sqlcmd"
          for pattern in "$forbidden_azure" "$forbidden_environment" "$forbidden_oidc" "$forbidden_sql"; do
            if grep -Eq "$pattern" "$workflow"; then
              echo "Forbidden protected-access capability detected in proposal CI." >&2
              exit 1
            fi
          done

      - name: Run fail-closed proposal tests
        run: python3 -m unittest -v scripts/ci/test_uat_schema_fidelity_proposal.py

      - name: Run PowerShell seven-result-set DataSet contract tests
        shell: pwsh
        run: |
          Install-Module -Name SqlServer -RequiredVersion 22.4.5.1 -Repository PSGallery -Scope CurrentUser -Force -AllowClobber
          ./scripts/ci/test_uat_schema_fidelity_evidence.ps1

      - name: Run disposable SQL Invoke-Sqlcmd negative tests
        shell: pwsh
        env:
          SCHEMA_TEST_SQL_SERVER: localhost,1433
          SCHEMA_TEST_SQL_DATABASE: master
          SCHEMA_TEST_SQL_USER: sa
          SCHEMA_TEST_SQL_PASSWORD: Disposable_SQL_2026!Only
        run: ./scripts/ci/test_uat_schema_fidelity_invoke_sqlcmd.ps1

      - name: Compile comparator
        run: python3 -m py_compile scripts/ci/compare_uat010_schema_inventory.py
