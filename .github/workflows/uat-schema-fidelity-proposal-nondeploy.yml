name: UAT schema fidelity protected proposal (nondeploy)

on:
  push:
    branches:
      - work/uat-schema-fidelity-protected-proposal-20261016
      - work/uat-schema-inventory-failure-diagnostic-20261016
      - work/uat-schema-r2-unknown-failure-diagnostic-20261016
      - work/r3-staged-diagnostic-20261019
      - work/c1-r3-timeout-privacy-recovery-20261019
  pull_request:
    branches:
      - post-uat/v1.8.0
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uat-schema-fidelity-proposal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthetic-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      client: ${{ steps.fixture.outputs.client }}
      tenant: ${{ steps.fixture.outputs.tenant }}
      subscription: ${{ steps.fixture.outputs.subscription }}
      password: ${{ steps.fixture.outputs.password }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Generate synthetic fixture outputs without printing their values
        id: fixture
        run: python3 scripts/ci/test_r3_login_privacy.py --generate-fixture
  static-and-comparator-tests:
    needs: synthetic-handoff
    permissions:
      contents: read
    uses: ./.github/workflows/r3-recovery-nondeploy-worker.yml
    secrets:
      fixture_client: ${{ needs.synthetic-handoff.outputs.client }}
      fixture_tenant: ${{ needs.synthetic-handoff.outputs.tenant }}
      fixture_subscription: ${{ needs.synthetic-handoff.outputs.subscription }}
      fixture_sql_password: ${{ needs.synthetic-handoff.outputs.password }}
