name: Path B correction + Leader P0 integrated NONDEPLOY
on:
  push:
    branches: [work/pathb-correction-p0-integrated-leader-20261120]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'Terry4410/field-visit-mileage-system'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact pinned Leader P0 release source and focused file scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 1006bfb2b31f6735ad37e7816a5d76d6b0195bd4 HEAD
          git diff --name-only 1006bfb2b31f6735ad37e7816a5d76d6b0195bd4 HEAD | sort > "$RUNNER_TEMP/actual"
          printf '%s\n' \
            .github/workflows/pathb-correction-p0-integration-nondeploy.yml \
            backend/src/FieldVisit.Infrastructure/V160FinalRepository.cs \
            backend/src/FieldVisit.Application/V160CorrectionDiffRules.cs \
            backend/tests/FieldVisit.Application.Tests/V160CorrectionDiffRulesTests.cs \
            frontend/src/leader-review-queue.ts \
            frontend/src/leader-review-queue.test.ts \
            frontend/src/pages/LeaderPage.tsx | sort > "$RUNNER_TEMP/expected"
          diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/actual"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend tests and production build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Traditional Chinese PDF font
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk >/dev/null
      - name: Backend build and regression suite
        run: |
          dotnet build backend/src/FieldVisit.Api/FieldVisit.Api.csproj -c Release
          dotnet test backend/tests/FieldVisit.Application.Tests/FieldVisit.Application.Tests.csproj -c Release --no-restore
      - name: Non-deploy manifest
        run: |
          echo "BASE_LEADER_P0_SHA=1006bfb2b31f6735ad37e7816a5d76d6b0195bd4"
          echo "SOURCE_SHA=$GITHUB_SHA"
          echo "AZURE_SQL_DEPLOY=NOT_AUTHORIZED"
