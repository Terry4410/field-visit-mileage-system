name: Windows IIS application package review (NONDEPLOY)
on:
  push:
    branches: [work/pathb-it-cleanbuild-020-20261123]
    paths: ['docs/release/pathb/it-iis-review/**','.github/workflows/it-iis-review-nondeploy.yml']
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a4281b4d488448153ef3cd09f6ed698d146d3c77
          path: app
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: delivery
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: PathB-REPORT-EXPORT-3ROLES-API-package-8442bae3
          run-id: 45312411080
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/source-package
      - name: Preserve verified embedded CJK resource (no standalone font in output)
        run: |
          set -euo pipefail
          pkg="$RUNNER_TEMP/source-package/PathB_REPORT_EXPORT_3ROLES_API_fix_8442bae3_once_20261124.zip"
          echo "c4a35f4623fcffe03e5f83a9b1aeacdf57f1dc70083b1f6302fbca181b841d63  $pkg" | sha256sum -c -
          mkdir -p app/backend/src/FieldVisit.Infrastructure/fonts
          unzip -p "$pkg" fonts/NotoSansCJK-Regular.ttc > app/backend/src/FieldVisit.Infrastructure/fonts/NotoSansCJK-Regular.ttc
          echo "b76b0433203017ca80401b2ee0dd69350349871c4b19d504c34dbdd80541690a  app/backend/src/FieldVisit.Infrastructure/fonts/NotoSansCJK-Regular.ttc" | sha256sum -c -
      - name: Frontend focused enterprise gate tests and build
        working-directory: app/frontend
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test -- src/corporate-formal-location-flags.test.ts
          npm run build
      - name: Publish Windows x64 framework-dependent API
        run: |
          set -euo pipefail
          dotnet publish app/backend/src/FieldVisit.Api/FieldVisit.Api.csproj -c Release -r win-x64 --self-contained false -p:UseAppHost=true -o "$RUNNER_TEMP/review/api"
          mkdir -p "$RUNNER_TEMP/review/frontend"
          cp -a app/frontend/dist/. "$RUNNER_TEMP/review/frontend/"
          cp delivery/docs/release/pathb/it-iis-review/appsettings.json "$RUNNER_TEMP/review/api/appsettings.json"
          cp delivery/docs/release/pathb/it-iis-review/config.js "$RUNNER_TEMP/review/frontend/config.js"
          cp delivery/docs/release/pathb/it-iis-review/README.md "$RUNNER_TEMP/review/"
          # Hash routing requires no URL rewrite. Explicit static default doc and no browsing.
          cat > "$RUNNER_TEMP/review/frontend/web.config" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration><system.webServer><directoryBrowse enabled="false"/><defaultDocument enabled="true"><files><clear/><add value="index.html"/></files></defaultDocument></system.webServer></configuration>
          XML
      - name: Validate package contents and fail-closed config, no IIS deployment
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,os,json,hashlib,xml.etree.ElementTree as E
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'review'
          a=p/'api'; f=p/'frontend'
          assert (a/'FieldVisit.Api.exe').read_bytes()[:2]==b'MZ'
          assert (a/'FieldVisit.Api.dll').is_file() and (a/'libSkiaSharp.dll').is_file()
          assert (a/'FieldVisit.Infrastructure.dll').stat().st_size>19484784
          assert (f/'index.html').is_file() and (f/'redirect.html').is_file()
          x=E.parse(a/'web.config').getroot().find('.//aspNetCore')
          assert x is not None and x.attrib.get('hostingModel','').lower()=='inprocess'
          assert x.attrib.get('processPath','').lower().endswith('fieldvisit.api.exe')
          assert x.attrib.get('stdoutLogEnabled','').lower()=='false'
          c=json.loads((a/'appsettings.json').read_text())
          assert c['CorporateHosting']['Required'] and c['Auth']['Mode']=='Entra' and not c['Auth']['JwtKey'] and not c['Auth']['DemoPassword']
          assert not c['Auth']['Entra']['AllowFirstLoginEmailBinding'] and not c['ConnectionStrings']['DefaultConnection']
          assert not c['UatAutomation']['CleanupEnabled'] and not c['Swagger']['Enabled']
          assert not c['OptionC']['Candidate']['Enabled'] and not c['OptionC']['Approval']['Enabled']
          assert not c['BackgroundJobs']['WorkerEnabled']
          assert not list(p.rglob('*.ttc')) and not list(p.rglob('*.otf'))
          assert 'azurewebsites.net' not in (f/'config.js').read_text() and '"AUTH_MODE": "Entra"' in (f/'config.js').read_text()
          (p/'manifest.json').write_text(json.dumps({'source':'a4281b4d488448153ef3cd09f6ed698d146d3c77','target':'Windows x64 IIS .NET 8 framework-dependent','status':'NONDEPLOY_REVIEW_ONLY','actualIIS':'NOT_RUN','actualEntra':'NOT_RUN','runtimeACL':'INCOMPLETE','font':'embedded resource preserved; actual Windows PDF not tested'},indent=2)+'\n')
          (p/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(q.read_bytes()).hexdigest()+'  '+q.relative_to(p).as_posix()+'\n' for q in sorted(p.rglob('*')) if q.is_file() and q.name!='SHA256SUMS.txt'))
          print('WINDOWS_X64_IIS_PACKAGE_CONTENTS_AND_SAFE_DEFAULTS=PASS')
          PY
          (cd "$RUNNER_TEMP/review" && sha256sum -c SHA256SUMS.txt >/dev/null)
      - uses: actions/upload-artifact@v4
        with:
          name: fieldvisit-v180-windows-iis-review
          path: ${{ runner.temp }}/review
          if-no-files-found: error
          retention-days: 30
