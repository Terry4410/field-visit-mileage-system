name: Build v1.7.2 IT Local Package

on:
  push:
    branches:
      - chore/it-local-package-v172
    paths:
      - .github/workflows/build-it-local-package-v172.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact UAT candidate source
        uses: actions/checkout@v4
        with:
          ref: v1.7.0-uat-candidate
          fetch-depth: 1

      - name: Capture version
        id: version
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build IT handoff package
        shell: bash
        run: |
          set -euo pipefail
          PKG="it-local-package"
          mkdir -p "$PKG/01_Source_Code" "$PKG/02_DB_Schema" "$PKG/03_Config_Templates" "$PKG/04_Deployment_Guide"

          # Exact source snapshot from v1.7.0-uat-candidate.
          rsync -a \
            --exclude='.git/' \
            --exclude='外訪行程里程管理系統_Gate1_設計簽核包_v1.0.zip' \
            ./ "$PKG/01_Source_Code/"

          # DB schema/migrations are copied separately for IT convenience.
          cp -R database/. "$PKG/02_DB_Schema/"

          cat > "$PKG/VERSION.txt" <<EOF
          System: 外訪行程與里程管理系統
          Package: IT Local Deployment Package
          UAT Application Version: 1.7.2-uat-candidate
          DB Schema Version: 1.7.0-008
          Source Branch: v1.7.0-uat-candidate
          Source Commit: ${{ steps.version.outputs.sha }}
          Generated UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF

          cat > "$PKG/03_Config_Templates/appsettings.Local.example.json" <<'EOF'
          {
            "App": {
              "Version": "1.7.2-local",
              "DbSchemaVersion": "1.7.0-008",
              "BusinessTimeZone": "Asia/Taipei"
            },
            "ConnectionStrings": {
              "DefaultConnection": "Server=localhost;Database=FieldVisitLocal;Trusted_Connection=True;TrustServerCertificate=True;"
            },
            "Auth": {
              "Mode": "Demo",
              "Issuer": "FieldVisit.Local",
              "Audience": "FieldVisit.Local.Users",
              "JwtKey": "REPLACE-WITH-LOCAL-KEY-AT-LEAST-32-CHARS",
              "DemoPassword": "REPLACE-WITH-LOCAL-DEMO-PASSWORD",
              "Entra": {
                "Instance": "https://login.microsoftonline.com",
                "TenantId": "",
                "Audience": "",
                "RequiredScope": "access_as_user",
                "AllowFirstLoginEmailBinding": false
              }
            },
            "Cors": {
              "AllowedOrigins": ["http://localhost:5173"]
            },
            "Providers": {
              "Route": "Mock",
              "Geocoding": "Mock"
            },
            "BackgroundJobs": {
              "WorkerEnabled": true,
              "RecoverOnStartup": true
            },
            "Swagger": {
              "Enabled": true
            }
          }
          EOF

          cat > "$PKG/03_Config_Templates/config.local.example.js" <<'EOF'
          window.APP_CONFIG = {
            API_BASE_URL: "http://localhost:5000/api/v1",
            AUTH_MODE: "Demo",
            ENTRA: {
              TENANT_ID: "",
              SPA_CLIENT_ID: "",
              API_SCOPE: "",
              REDIRECT_URI: "http://localhost:5173/"
            }
          };
          EOF

          cat > "$PKG/02_DB_Schema/LOCAL_SETUP_ORDER.md" <<'EOF'
          # Local DB 建置順序 — Schema 1.7.0-008

          ## 1. 建立空白資料庫
          先在 SQL Server 建立資料庫，例如 `FieldVisitLocal`。

          ## 2. 依序執行 Up.sql
          1. `migrations/1600_001_foundation/Up.sql`
          2. `migrations/1600_002_final/Up.sql`
          3. `migrations/1700_001_identity_access/Up.sql`
          4. `migrations/1700_002_location_scale/Up.sql`
          5. `migrations/1700_003_auth_people_bulk/Up.sql`
          6. `migrations/1700_004_legacy_supervisor_normalization/Up.sql`
          7. `migrations/1700_005_people_bulk_confirm_claim/Up.sql`
          8. `migrations/1700_006_legacy_uat_supervisor_export/Up.sql`
          9. `migrations/1700_007_orphan_temporary_location_cleanup/Up.sql`
          10. `migrations/1700_008_location_promotion_history_action/Up.sql`

          建議每一個 Up.sql 後執行同資料夾的 `Verify.sql`。

          ## 3. UAT 測試資料（選用）
          - `020_uat_demo_seed.sql`：UAT Demo 帳號／基礎測試資料。
          - `030_uat_sample_transactions.sql`：UAT 範例交易資料。

          **正式或準正式 Local 環境若不需要測試帳號，請不要執行 UAT seed。**

          ## 4. Schema 目標
          完成後應符合系統設定的 `DbSchemaVersion = 1.7.0-008`。
          EOF

          cat > "$PKG/04_Deployment_Guide/LOCAL_DEPLOYMENT_README.md" <<'EOF'
          # 外訪行程與里程管理系統 — IT Local 部署指南

          ## 交付基準
          - UAT 應用程式版本：`1.7.2-uat-candidate`
          - DB Schema：`1.7.0-008`
          - Backend：ASP.NET Core / .NET 8
          - Frontend：React 18 + TypeScript + Vite
          - Database：Microsoft SQL Server / Azure SQL 相容 SQL

          ## Package 結構
          - `01_Source_Code/`：UAT candidate 完整原始碼快照。
          - `02_DB_Schema/`：Schema、migration、Verify、UAT seed。
          - `03_Config_Templates/`：Local 設定範本，不含任何真實密碼或 Azure secret。
          - `04_Deployment_Guide/`：本文件。
          - `VERSION.txt`：來源版本與 Commit SHA。

          ## 建議 Local 前置環境
          - .NET SDK 8.x
          - Node.js 20 LTS + npm
          - SQL Server 2019+（Developer / Express / Standard 均可依 IT 規範）
          - SSMS 或 sqlcmd（執行 SQL migration）

          ## Step 1 — 建立 Local DB
          1. 建立空白 DB，例如 `FieldVisitLocal`。
          2. 依 `02_DB_Schema/LOCAL_SETUP_ORDER.md` 順序執行 migration。
          3. 每一階段執行 Verify.sql。
          4. 若只做 Business UAT 模擬，可選擇執行 `020_uat_demo_seed.sql`；正式資料環境不要執行。

          ## Step 2 — Backend
          將 `03_Config_Templates/appsettings.Local.example.json` 複製到：
          `01_Source_Code/backend/src/FieldVisit.Api/appsettings.Local.json`

          修改：
          - `ConnectionStrings:DefaultConnection`
          - `Auth:JwtKey`（Local 自建，至少 32 字元）
          - `Auth:DemoPassword`（只供 Local 測試）

          執行：
          ```powershell
          cd 01_Source_Code
          dotnet restore backend/FieldVisitSystem.sln
          dotnet build backend/FieldVisitSystem.sln --configuration Release
          dotnet test backend/tests/FieldVisit.Application.Tests/FieldVisit.Application.Tests.csproj --configuration Release
          dotnet run --project backend/src/FieldVisit.Api/FieldVisit.Api.csproj --urls http://localhost:5000
          ```

          驗證：
          - `http://localhost:5000/health`
          - Swagger（Local 開啟時）：`http://localhost:5000/swagger`

          ## Step 3 — Frontend
          將 `03_Config_Templates/config.local.example.js` 的內容套用到：
          `01_Source_Code/frontend/public/config.js`

          執行：
          ```powershell
          cd 01_Source_Code/frontend
          npm ci
          npm run test
          npm run build
          npm run dev -- --host 0.0.0.0
          ```

          瀏覽：`http://localhost:5173`

          ## Step 4 — Local 驗證
          建議至少驗證：
          1. `/health` 回傳 status=ok、schema=1.7.0-008。
          2. Demo Login 可登入（若使用 UAT seed）。
          3. 外訪員建立／送出行程。
          4. 小組長里程計算與核准／退回。
          5. 管理者地點批次匯入 `.xlsx/.xls/.csv`。
          6. 督導查詢／匯出維持唯讀。

          ## Secrets / 憑證注意
          本交付包**不包含**：
          - Azure SQL 真實 Connection String
          - Azure App Service Publish Profile
          - GitHub Actions Secrets
          - UAT_DEMO_PASSWORD 真實值
          - Entra Client Secret / Tenant credentials

          IT 應依公司環境自行建立 Local / DEV 憑證與連線資訊。

          ## 切換 Entra ID
          Local 初驗可先使用 Demo Mode。若 IT 要驗證企業 Entra：
          - Backend `Auth:Mode` 改為 `Entra`
          - 設定 TenantId、Audience、RequiredScope
          - Frontend `AUTH_MODE` 改為 `Entra`
          - 設定 SPA Client ID、API Scope、Redirect URI
          
          請勿沿用 UAT 的憑證到 Local/正式環境。
          EOF

          # Produce checksums for traceability.
          (cd "$PKG" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$PKG/CHECKSUMS.sha256"

          # Make one portable ZIP inside the artifact as well.
          zip -qr "FieldVisit_UAT_v1.7.2_IT_Local_Deployment_${{ steps.version.outputs.short_sha }}.zip" "$PKG"

      - name: Upload IT local deployment package
        uses: actions/upload-artifact@v4
        with:
          name: FieldVisit-UAT-v1.7.2-IT-Local-Deployment
          path: |
            it-local-package/
            FieldVisit_UAT_v1.7.2_IT_Local_Deployment_${{ steps.version.outputs.short_sha }}.zip
          if-no-files-found: error
          retention-days: 14
