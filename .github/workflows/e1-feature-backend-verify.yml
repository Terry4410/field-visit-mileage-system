name: E1 feature backend validation

on:
  push:
    branches:
      - feature/v180-p2b-uat-master-data-self-service
    paths:
      - "backend/**"
      - ".github/workflows/e1-feature-backend-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-verify:
    if: github.repository == 'Terry4410/field-visit-mileage-system' && github.ref == 'refs/heads/feature/v180-p2b-uat-master-data-self-service'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact feature source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce E1 source boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE=3e7b905a31c7ad9e5793256f7571593efb7fa61e
          git merge-base --is-ancestor "$BASE" HEAD
          unexpected="$(git diff --name-only "$BASE" HEAD | grep -Ev '^(backend/|\.github/workflows/e1-feature-backend-verify\.yml$)' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "::error::Unexpected E1 path(s):"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          test -z "$(git diff --name-only "$BASE" HEAD -- database/migrations frontend uat)"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Traditional Chinese PDF font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Restore backend
        run: |
          dotnet restore backend/src/FieldVisit.Api/FieldVisit.Api.csproj
          dotnet restore backend/tests/FieldVisit.Application.Tests/FieldVisit.Application.Tests.csproj

      - name: Build backend
        run: dotnet build backend/src/FieldVisit.Api/FieldVisit.Api.csproj -c Release --no-restore

      - name: E1 focused tests
        run: dotnet test backend/tests/FieldVisit.Application.Tests/FieldVisit.Application.Tests.csproj -c Release --no-restore --filter "FullyQualifiedName~V180MasterDataAdmin|FullyQualifiedName~V180TripContextReader|FullyQualifiedName~V180SqlServerTriggerCompatibilityTests"

      - name: Full backend regression
        run: dotnet test backend/tests/FieldVisit.Application.Tests/FieldVisit.Application.Tests.csproj -c Release --no-restore
