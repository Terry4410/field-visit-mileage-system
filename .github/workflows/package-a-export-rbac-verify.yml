name: Package A report export RBAC and workbook verification

on:
  push:
    branches: [work/package-a-export-rbac-20261016]
  pull_request:
    branches: [post-uat/v1.8.0]
    paths:
      - "backend/src/**"
      - "backend/tests/FieldVisit.Application.Tests/**"
      - "docs/package-a/**"
      - ".github/workflows/package-a-export-rbac-verify.yml"

permissions:
  contents: read

concurrency:
  group: package-a-export-rbac-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'Terry4410/field-visit-mileage-system'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install PDF test font
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Backend Release build
        run: dotnet build backend/src/FieldVisit.Api/FieldVisit.Api.csproj -c Release
      - name: Backend tests and synthetic workbook samples
        env:
          PACKAGE_A_SAMPLE_OUTPUT_DIR: ${{ github.workspace }}/verification/samples
        run: dotnet test backend/tests/FieldVisit.Application.Tests/FieldVisit.Application.Tests.csproj -c Release --logger "trx;LogFileName=package-a.trx" --results-directory verification
      - name: Frontend tests
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm test -- --reporter=default
      - name: Frontend production build
        working-directory: frontend
        run: npm run build
      - name: Bind evidence to exact source
        if: always()
        run: |
          mkdir -p verification
          git rev-parse HEAD > verification/source-commit.txt
          git status --short > verification/worktree-status.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-a-export-rbac-${{ github.sha }}
          path: |
            verification/
            backend/tests/FieldVisit.Application.Tests/TestResults/
          retention-days: 30
