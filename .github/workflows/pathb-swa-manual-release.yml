name: Path B SWA Manual Release (OWNER APPROVAL REQUIRED)
on:
  workflow_dispatch:
    inputs:
      owner_approval:
        description: 'Enter DEPLOY_PATHB_SWA_ONCE only after explicit separate Owner approval'
        required: true
        type: string
      artifact_id:
        description: 'Pinned GitHub artifact ID'
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: pathb-swa-production-single-release
  cancel-in-progress: false
jobs:
  input-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      approved: ${{ steps.gate.outputs.approved }}
    steps:
      - name: Evaluate inputs without secrets or deployment
        id: gate
        env:
          APPROVAL: ${{ inputs.owner_approval }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          RUN_REF: ${{ github.ref }}
          RUN_EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          if [[ "$RUN_EVENT" == "workflow_dispatch" && "$RUN_REF" == "refs/heads/main" && "$APPROVAL" == "DEPLOY_PATHB_SWA_ONCE" && "$ARTIFACT_ID" == "14195477350" ]]; then
            echo 'approved=true' >> "$GITHUB_OUTPUT"
            echo 'INPUT_GATE=PASS'
          else
            echo 'approved=false' >> "$GITHUB_OUTPUT"
            echo 'INPUT_GATE=HOLD'
          fi
          echo 'DEPLOYMENT=NO'
  verify-and-deploy:
    needs: input-preflight
    # Deliberately inactive on feature branches and PR events.
    if: ${{ needs.input-preflight.outputs.approved == 'true' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pathb-swa-production
    steps:
      - name: Check out verified release gate
        uses: actions/checkout@v4
      - name: Fetch pinned artifact only
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/Terry4410/field-visit-mileage-system/actions/artifacts/14195477350/zip > /tmp/pathb.zip
      - name: Validate pinned archive before secret access
        run: python3 scripts/nondeploy/verify_pathb_static_artifact.py /tmp/pathb.zip
      - name: Unpack pinned static assets
        run: |
          mkdir -p pathb-dist
          unzip -q /tmp/pathb.zip -d pathb-dist
          test -f pathb-dist/index.html
          test -f pathb-dist/config.js
      - name: Deploy only Path B SWA (separate Owner approval required)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PATHB_UAT }}
          repo_token: ${{ github.token }}
          action: upload
          app_location: pathb-dist
          skip_app_build: true
          skip_api_build: true
          output_location: ''
          production_branch: main
