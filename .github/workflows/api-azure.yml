name: Build Test and Deploy API to Azure UAT
on:
  push:
    branches: [ main ]
    paths: [ "backend/**", ".github/workflows/api-azure.yml" ]
  workflow_dispatch:
    inputs:
      approved_sha:
        description: "Owner-approved exact 40-character commit SHA"
        required: true
        type: string
      operation:
        description: "deploy_candidate or rollback to pinned prior UAT source"
        required: true
        type: choice
        default: deploy_candidate
        options:
          - deploy_candidate
          - rollback
permissions:
  contents: read
jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Gate manual deployment to exact Owner-approved candidate SHA
        if: github.event_name == 'workflow_dispatch'
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/work/v180-visitor-only-uat010-security-fix"
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          case "${{ inputs.operation }}" in
            deploy_candidate) test "$APPROVED_SHA" = "$GITHUB_SHA" ;;
            rollback) test "$APPROVED_SHA" = "68b94138e2b79d9bff694d3bf8dcb4825d0dcbe2" ;;
            *) echo "::error::Unsupported deployment operation"; exit 1 ;;
          esac
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.approved_sha || github.sha }}
      - name: Verify checkout source SHA
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.approved_sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install Traditional Chinese PDF font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Restore API
        run: dotnet restore backend/src/FieldVisit.Api/FieldVisit.Api.csproj
      - name: Restore tests
        run: dotnet restore backend/tests/FieldVisit.Application.Tests/FieldVisit.Application.Tests.csproj
      - name: Build API
        run: dotnet build backend/src/FieldVisit.Api/FieldVisit.Api.csproj -c Release --no-restore
      - name: Unit tests
        run: dotnet test backend/tests/FieldVisit.Application.Tests/FieldVisit.Application.Tests.csproj -c Release --no-restore
      - name: Publish
        run: dotnet publish backend/src/FieldVisit.Api/FieldVisit.Api.csproj -c Release --no-build -o ./publish
      - name: Stamp and verify backend artifact provenance
        run: |
          git rev-parse HEAD > ./publish/source-sha.txt
          test "$(cat ./publish/source-sha.txt)" = "$(git rev-parse HEAD)"
      - name: Bundle Traditional Chinese PDF font
        run: |
          mkdir -p ./publish/fonts
          cp /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc ./publish/fonts/NotoSansCJK-Regular.ttc
          test -s ./publish/fonts/NotoSansCJK-Regular.ttc
      - name: Deploy Azure UAT
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish

  uat-browser-smoke:
    name: UAT Automation Checks
    needs: build-test-deploy
    uses: ./.github/workflows/uat-smoke.yml
    with:
      include_write_flow: false
    secrets:
      UAT_DEMO_PASSWORD: ${{ secrets.UAT_DEMO_PASSWORD }}
