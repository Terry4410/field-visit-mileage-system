name: Path B UAT seed NONDEPLOY
on:
  pull_request:
    paths:
      - 'database/uat/FieldVisit_PathB_UAT_ThreeRole_Seed_*'
      - 'database/uat/FieldVisit_PathB_VIS01_Context_Seed_LOCKED_REVIEW.sql'
      - 'database/uat/FieldVisit_PathB_VIS01_Context_SELECT_ACL_LOCKED_TEST.sql'
      - 'database/uat/FieldVisit_PathB_VIS01_Context_Seed_READBACK.sql'
      - 'scripts/ci/pathb_uat_seed_schema.sql'
      - 'scripts/ci/run_pathb_uat_seed_sqlserver.sh'
      - 'scripts/ci/test_pathb_uat_seed_contract.py'
      - 'scripts/ci/test_pathb_vis01_context_seed_contract.py'
      - 'scripts/ci/pathb_vis01_disposable_1800_subset.sql'
      - 'scripts/ci/test_pathb_vis01_disposable_sqlserver.py'
      - '.github/workflows/pathb-uat-seed-nondeploy.yml'
permissions:
  contents: read
concurrency:
  group: pathb-uat-seed-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  sqlserver-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Static source and safety contract
        run: python -m unittest scripts/ci/test_pathb_uat_seed_contract.py -v
      - name: Static VIS01 context contract
        run: python -m unittest scripts/ci/test_pathb_vis01_context_seed_contract.py -v
      - name: Start disposable SQL Server 2022
        shell: bash
        run: |
          set -euo pipefail
          password="Aa7!$(python -c 'import secrets;print(secrets.token_hex(24))')"
          echo "::add-mask::$password"
          echo "PATHB_SQL_PASSWORD=$password" >> "$GITHUB_ENV"
          docker run -d --name pathb-seed-sql -p 127.0.0.1:1433:1433 \
            -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e "MSSQL_SA_PASSWORD=$password" \
            mcr.microsoft.com/mssql/server:2022-latest >/dev/null
      - name: Wait for SQL Server
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            docker exec pathb-seed-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa \
              -P "$PATHB_SQL_PASSWORD" -C -l 2 -Q 'SELECT 1' >/dev/null 2>&1 && exit 0
            sleep 2
          done
          exit 1
      - name: Parse complete locked VIS01 SQL without executing DML
        shell: bash
        run: |
          set -euo pipefail
          { printf 'SET PARSEONLY ON;\n'; cat database/uat/FieldVisit_PathB_VIS01_Context_Seed_LOCKED_REVIEW.sql; } |
            docker exec -i pathb-seed-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$PATHB_SQL_PASSWORD" -C -b -V 11 -d master
      - name: Parse VIS01 ten-table ACL locked fixture only (never grant)
        shell: bash
        run: |
          set -euo pipefail
          { printf 'SET PARSEONLY ON;\n'; cat database/uat/FieldVisit_PathB_VIS01_Context_SELECT_ACL_LOCKED_TEST.sql; } |
            docker exec -i pathb-seed-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$PATHB_SQL_PASSWORD" -C -b -V 11 -d master
      - name: Parse VIS01 independent readback (never SELECT production)
        shell: bash
        run: |
          set -euo pipefail
          { printf 'SET PARSEONLY ON;\n'; cat database/uat/FieldVisit_PathB_VIS01_Context_Seed_READBACK.sql; } |
            docker exec -i pathb-seed-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$PATHB_SQL_PASSWORD" -C -b -V 11 -d master
      - name: Positive negative repeat collision rollback and login eligibility
        run: bash scripts/ci/run_pathb_uat_seed_sqlserver.sh
      - name: VIS01 actual SQL Server disposable insert and rollback contract
        run: python scripts/ci/test_pathb_vis01_disposable_sqlserver.py
      - name: Remove disposable SQL Server
        if: always()
        run: docker rm -f pathb-seed-sql >/dev/null 2>&1 || true
