name: v1.8.0 P2B Internal UAT

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v180-p2b-internal-uat
  cancel-in-progress: false

jobs:
  internal-uat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AUTHORITATIVE_SHA: 3e7b905a31c7ad9e5793256f7571593efb7fa61e
      UAT_BASE_URL: https://terry4410.github.io/field-visit-mileage-system/
      UAT_API_BASE_URL: https://api-fieldvisit-uat-cxauf4g8fzdyfsd9.eastasia-01.azurewebsites.net
      UAT_API_READY_URL: https://api-fieldvisit-uat-cxauf4g8fzdyfsd9.eastasia-01.azurewebsites.net/health/ready
      UAT_DEMO_PASSWORD: ${{ secrets.UAT_DEMO_PASSWORD }}
      P2B_SQL_PASSWORD: "P2B-Uat-Harness-2026!"

    steps:
      - name: Checkout isolated Internal UAT harness
        uses: actions/checkout@v4
        with:
          ref: work/v180-p2b-internal-uat-harness
          fetch-depth: 0

      - name: Verify authoritative ancestor and harness-only scope
        shell: bash
        run: |
          set -euo pipefail

          test "$(git merge-base "$AUTHORITATIVE_SHA" HEAD)" = "$AUTHORITATIVE_SHA"
          git merge-base --is-ancestor "$AUTHORITATIVE_SHA" HEAD

          cat > /tmp/p2b-uat-expected-files.txt <<'EOF'
          .github/workflows/v180-p2b-internal-uat.yml
          backend/tests/FieldVisit.Application.Tests/P2BBackgroundJobRuntimeHarnessTests.cs
          uat/tests/trip-lifecycle.spec.ts
          uat/tests/uat-test-helpers.ts
          EOF

          git diff --name-only "$AUTHORITATIVE_SHA"...HEAD | sort > /tmp/p2b-uat-actual-files.txt
          sort /tmp/p2b-uat-expected-files.txt -o /tmp/p2b-uat-expected-files.txt

          echo "HARNESS_CHANGED_FILES:"
          cat /tmp/p2b-uat-actual-files.txt

          diff -u /tmp/p2b-uat-expected-files.txt /tmp/p2b-uat-actual-files.txt

          if git diff --name-only "$AUTHORITATIVE_SHA"...HEAD -- backend/src frontend/src database/migrations | grep -q .; then
            echo "Application source or migration drift detected."
            exit 1
          fi

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Start ephemeral SQL Server
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach             --name p2b-internal-uat-sql             --env ACCEPT_EULA=Y             --env MSSQL_PID=Developer             --env MSSQL_SA_PASSWORD="$P2B_SQL_PASSWORD"             --publish 1433:1433             mcr.microsoft.com/mssql/server:2022-latest

          for attempt in $(seq 1 45); do
            if (echo > /dev/tcp/127.0.0.1/1433) >/dev/null 2>&1; then
              echo "Ephemeral SQL Server TCP endpoint is ready."
              exit 0
            fi
            echo "Waiting for ephemeral SQL Server ($attempt/45)..."
            sleep 2
          done

          echo "Ephemeral SQL Server did not become ready." >&2
          docker logs p2b-internal-uat-sql || true
          exit 1

      - name: P2B background mixed-failure runtime proof
        env:
          P2B_TEST_SQL_CONNECTION: "Server=127.0.0.1,1433;Database=P2BBackgroundJobHarness_${{ github.run_id }};User Id=sa;Password=${{ env.P2B_SQL_PASSWORD }};TrustServerCertificate=True;Encrypt=False"
        run: |
          dotnet test backend/tests/FieldVisit.Application.Tests/FieldVisit.Application.Tests.csproj             --configuration Release             --filter "FullyQualifiedName~P2BBackgroundJobRuntimeHarnessTests"             --logger "console;verbosity=normal"

      - name: Stop ephemeral SQL Server
        if: always()
        run: docker rm --force p2b-internal-uat-sql || true

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: uat/package-lock.json

      - name: Install UAT dependencies
        working-directory: uat
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        working-directory: uat
        run: npx playwright install --with-deps chromium

      - name: Wait for deployed UAT API readiness
        shell: bash
        run: |
          set -euo pipefail
          consecutive=0

          for attempt in $(seq 1 18); do
            body="$(curl --silent --show-error --fail --max-time 15 "$UAT_API_READY_URL" || true)"

            if printf '%s' "$body" | python3 -c '
          import json
          import sys

          try:
              data = json.load(sys.stdin)
          except Exception:
              sys.exit(1)

          sys.exit(0 if data.get("status") == "ready" else 1)
          '
            then
              consecutive=$((consecutive + 1))
              echo "API readiness PASS ($consecutive/2)"
            else
              consecutive=0
              echo "API readiness not ready — attempt $attempt/18"
            fi

            if [ "$consecutive" -ge 2 ]; then
              echo "API readiness stabilized."
              exit 0
            fi

            if [ "$attempt" -lt 18 ]; then
              sleep 10
            fi
          done

          echo "API readiness did not stabilize within retry window." >&2
          exit 1

      - name: Playwright Internal UAT
        working-directory: uat
        run: npm run test

      - name: Upload Internal UAT diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2b-internal-uat-${{ github.run_id }}
          path: |
            uat/playwright-report/
            uat/test-results/
          if-no-files-found: ignore
          retention-days: 14
