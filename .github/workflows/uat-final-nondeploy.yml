name: Biz User change batch verification (NONDEPLOY)
on:
  push:
    branches: [work/biz-user-uat-final-ci-20261126, work/biz-user-uat-people-20261126]
permissions:
  contents: read
jobs:
  verify-and-package:
    if: github.ref == 'refs/heads/work/biz-user-uat-final-ci-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'FieldVisit_Recovery!Sql2022'
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'FieldVisit_Recovery!Sql2022' -C -Q 'SELECT 1' || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      OPTIONC_EXECUTION_MODE: IsolatedSqlTest
      E1_R1_REQUIRED: '1'
      E1_R1_SQL_CONNECTION: Server=localhost,1433;Database=master;User Id=sa;Password=FieldVisit_Recovery!Sql2022;Encrypt=False;TrustServerCertificate=True;Connect Timeout=5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PDF font used by the existing API
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Backend build and affected regression
        run: |
          dotnet build backend/src/FieldVisit.Api/FieldVisit.Api.csproj -c Release
          dotnet test backend/tests/FieldVisit.Application.Tests/FieldVisit.Application.Tests.csproj -c Release --filter 'FullyQualifiedName~V180QueryExportTests|FullyQualifiedName~V180TripContextContractTests|FullyQualifiedName~V180PeopleResponsibilitySplitTests|FullyQualifiedName~V170PeopleQueryRulesTests|FullyQualifiedName~Frozen_lowrisk_policy_direct_save_uses_live_write_scope_and_atomic_version_audit' --logger 'console;verbosity=normal'
      - name: Frontend build and affected navigation
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test -- src/admin-navigation.test.ts src/leader-batch-return.test.ts src/query-ux.test.ts src/leader-review-queue.test.ts src/leader-mileage-filter.test.ts src/location-ownership-ui.test.ts src/optionc-approval-ui.test.ts src/people-completeness.test.ts
          npm run build
      - name: Package exact source Windows IIS candidate
        run: |
          dotnet publish backend/src/FieldVisit.Api/FieldVisit.Api.csproj -c Release -r win-x64 --self-contained false -o "$RUNNER_TEMP/api"
          mkdir -p "$RUNNER_TEMP/api/fonts" artifacts
          cp /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc "$RUNNER_TEMP/api/fonts/NotoSansCJK-Regular.ttc"
          (cd "$RUNNER_TEMP/api" && zip -q -r "$GITHUB_WORKSPACE/artifacts/api-win-x64.zip" .)
          (cd frontend/dist && zip -q -r "$GITHUB_WORKSPACE/artifacts/frontend-iis.zip" .)
          printf 'SOURCE_SHA=%s\nDEPLOYMENT=NOT_AUTHORIZED\nSCHEMA=1.8.0-010\n' "$GITHUB_SHA" > artifacts/source.txt
          (cd artifacts && sha256sum api-win-x64.zip frontend-iis.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: fieldvisit-biz-user-final-candidate-nondeploy
          path: artifacts/
          retention-days: 30
  verify-people-and-location-delta:
    if: github.ref == 'refs/heads/work/biz-user-uat-people-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Backend build and personnel delta tests
        run: |
          dotnet build backend/src/FieldVisit.Api/FieldVisit.Api.csproj -c Release
          dotnet test backend/tests/FieldVisit.Application.Tests/FieldVisit.Application.Tests.csproj -c Release --filter 'FullyQualifiedName~V180InternalUserCreateRulesTests|FullyQualifiedName~V170AccessRulesTests|FullyQualifiedName~V180PeopleResponsibilitySplitTests|FullyQualifiedName~V180AdminInformationArchitectureTests' --logger 'console;verbosity=normal'
      - name: Frontend focused verification
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test -- src/official-site-admin.test.ts src/official-site-location-first.test.ts src/admin-navigation.test.ts src/people-completeness.test.ts
          npm run build
