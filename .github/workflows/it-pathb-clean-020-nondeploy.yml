name: Path B IT 020 source-lock and isolated SQL (NONDEPLOY)
on:
  push:
    branches: [work/pathb-it-cleanbuild-020-20261123]
    paths:
      - 'scripts/ci/clean_install/build_optionc_final_checks.py'
      - 'scripts/ci/clean_install/test_build_optionc_final_checks.py'
      - 'scripts/ci/uat_release/prepare_candidate.py'
      - '.github/workflows/it-pathb-clean-020-nondeploy.yml'
permissions:
  contents: read
concurrency:
  group: pathb-it-020
  cancel-in-progress: false
jobs:
  isolated-020:
    if: github.repository == 'Terry4410/field-visit-mileage-system' && github.ref == 'refs/heads/work/pathb-it-cleanbuild-020-20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 9d431ea318fcec34f04f3cc36a8fb6d01d00c48a
          path: runtime-source
          persist-credentials: false
      - name: Verify immutable source and generate 020 effective SQL
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C runtime-source rev-parse HEAD)" = '9d431ea318fcec34f04f3cc36a8fb6d01d00c48a'
          python3 -m compileall -q scripts/ci/clean_install scripts/ci/uat_release/prepare_candidate.py
          PYTHONPATH=scripts/ci/clean_install python3 -m unittest discover -s scripts/ci/clean_install -p test_build_optionc_final_checks.py -v
          mkdir -p "$RUNNER_TEMP/it020"
          python3 scripts/ci/clean_install/build_optionc_final_checks.py --rc-root runtime-source --output "$RUNNER_TEMP/it020"
          python3 - <<'PY'
          import os,pathlib,json
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'it020'
          manifest=json.loads((out/'optionc-final-target-checks-manifest.json').read_text())
          assert manifest['checkCount']==15
          assert manifest['effective020ApprovedGitBlob']=='ce7bbb6f204bf1ab69c106ae59a5b139077494bc'
          text=(out/'optionc-final-target-checks.sql').read_text()
          blocks=[]
          for name in ('ImportBatches.CK_ImportBatches_Status','ImportBatchItems.CK_ImportBatchItems_Status'):
              marker='-- FINAL dbo.'+name+' from '
              assert text.count(marker)==1
              chunk=text.split(marker,1)[1].split('\nGO\n',1)[0]
              blocks.append(marker+chunk+'\nGO\n')
          assert "N'Previewed',N'Confirming',N'Confirmed'" in blocks[0]
          assert 'Confirming' not in blocks[1]
          sql="IF DB_NAME()<>N'OptionCIsolated_PathBIT020' THROW 57301,N'NONDISPOSABLE_TARGET',1;\nGO\n"
          sql+="CREATE TABLE dbo.ImportBatches(Status nvarchar(30) NOT NULL);\nCREATE TABLE dbo.ImportBatchItems(Status nvarchar(30) NOT NULL);\nGO\n"
          sql+=''.join(blocks)
          sql+="INSERT dbo.ImportBatches(Status) VALUES(N'Confirming'),(N'Confirmed');\n"
          sql+="INSERT dbo.ImportBatchItems(Status) VALUES(N'Valid'),(N'Applied');\n"
          sql+="BEGIN TRY INSERT dbo.ImportBatches(Status) VALUES(N'Invalid'); THROW 57305,N'INVALID_BATCH_ACCEPTED',1; END TRY\n"
          sql+="BEGIN CATCH IF ERROR_NUMBER()<>547 THROW; END CATCH;\n"
          sql+="BEGIN TRY INSERT dbo.ImportBatchItems(Status) VALUES(N'Invalid'); THROW 57306,N'INVALID_ITEM_ACCEPTED',1; END TRY\n"
          sql+="BEGIN CATCH IF ERROR_NUMBER()<>547 THROW; END CATCH;\n"
          sql+="IF (SELECT COUNT(*) FROM sys.check_constraints WHERE name IN(N'CK_ImportBatches_Status',N'CK_ImportBatchItems_Status') AND is_disabled=0 AND is_not_trusted=0)<>2 THROW 57307,N'CHECK_NOT_TRUSTED',1;\n"
          sql+="SELECT 'PATHB_IT_020_SQL2022=PASS' AS Result;\nGO\n"
          (out/'isolated-fixture.sql').write_text(sql)
          print('PATHB_IT_020_GENERATOR=PASS')
          PY
      - name: Start disposable SQL Server 2022
        shell: bash
        run: |
          set -euo pipefail
          pw="Aa7!$(python3 -c 'import secrets; print(secrets.token_hex(24))')"
          echo "::add-mask::$pw"
          echo "IT020_PASSWORD=$pw" >> "$GITHUB_ENV"
          docker run -d --name fieldvisit-it020-sql --publish 127.0.0.1:1433:1433 -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e "MSSQL_SA_PASSWORD=$pw" mcr.microsoft.com/mssql/server:2022-latest >/dev/null
          for _ in $(seq 1 60); do
            if docker exec fieldvisit-it020-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$pw" -C -I -b -l 3 -Q 'SELECT 1' >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo 'PATHB_IT_020_SQL_READY=HOLD' >&2
          exit 1
      - name: Validate source-generated trusted CHECKs with allowed and denied writes
        shell: bash
        run: |
          set -euo pipefail
          docker exec fieldvisit-it020-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$IT020_PASSWORD" -C -I -b -l 10 -Q "CREATE DATABASE OptionCIsolated_PathBIT020" >/dev/null
          docker exec -i fieldvisit-it020-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$IT020_PASSWORD" -C -I -b -l 10 -d OptionCIsolated_PathBIT020 < "$RUNNER_TEMP/it020/isolated-fixture.sql" | grep -F 'PATHB_IT_020_SQL2022=PASS'
      - name: Remove disposable SQL container
        if: always()
        shell: bash
        run: docker rm -f fieldvisit-it020-sql >/dev/null 2>&1 || true
      - name: Hash and upload nondeploy evidence
        if: success()
        shell: bash
        run: |
          cd "$RUNNER_TEMP/it020"
          sha256sum optionc-final-target-checks.sql optionc-final-target-checks-manifest.json isolated-fixture.sql > checksums.sha256
          sha256sum --check --quiet checksums.sha256
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: pathb-it020-nondeploy
          path: ${{ runner.temp }}/it020/
          retention-days: 14
          if-no-files-found: error
