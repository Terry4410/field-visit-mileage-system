    branches:
      - tmp/v180-005-throw-fix-20260909
    paths:
      - database/development/v1.8.0/compat/1800_005.dev.sql

jobs:
  hash:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
