name: UAT010 combined source identity and compile NONDEPLOY
on:
  push:
    branches: [work/uat010-existing-rc-integration-20261025]
permissions:
  contents: read
concurrency:
  group: uat010-integrated-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  combined-source:
    if: github.repository == 'Terry4410/field-visit-mileage-system' && github.ref == 'refs/heads/work/uat010-existing-rc-integration-20261025'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exact immutable source overlays and fail-closed release boundary
        shell: python
        run: |
          import hashlib,json,os,pathlib,subprocess
          p=pathlib.Path
          def git(*a):return subprocess.check_output(['git',*a],text=True).strip()
          j=json.loads(p('docs/release/g1-execution/promotion/integration-ledger.json').read_text())
          assert j['contract']=='uat010-combined-source-review-v1'
          assert j['sourceBranches']=={'PR82_BASE':'ae9ca02cf2d9539fe9bed61a073d60d63731cbb9','PR48_CLEAN':'9ee5dacceed2bf55c39310d663f3258bcb545989','PR81_HISTORY':'5bab502f20d9590d415d6a25a238d1629057989d'}
          assert git('rev-parse','HEAD')==os.environ['GITHUB_SHA']
          assert subprocess.run(['git','merge-base','--is-ancestor','ae9ca02cf2d9539fe9bed61a073d60d63731cbb9','HEAD']).returncode==0
          changed=set(git('diff','--name-only','ae9ca02cf2d9539fe9bed61a073d60d63731cbb9','HEAD').splitlines())
          expected=set(j['integratedFiles'])|{'docs/release/g1-execution/promotion/integration-ledger.json','docs/release/g1-execution/promotion/EXISTING010-INTEGRATION-BOUNDARY.md','.github/workflows/uat010-integrated-source-nondeploy.yml','docs/uat/BUSINESS-UAT-GUIDE-v1.8.0.md','scripts/ci/uat010_014_readonly.py','scripts/ci/test_uat010_014_readonly.py','docs/release/g1-execution/promotion/UAT010-014-READONLY.md','scripts/ci/test_uat010_014_readonly.ps1','scripts/ci/uat_release/build_optionc_frontend_dual_nondeploy.py','docs/release/g1-execution/promotion/UAT010-FRONTEND-DUAL-NONDEPLOY.md','docs/release/g1-execution/promotion/HISTORIC-API-DLL-REBUILD-NONDEPLOY.md','scripts/ci/uat010_legacy_batch_check_drift.py','docs/release/g1-execution/promotion/EXISTING010-SYNTHETIC-CHECK-DRIFT.md','scripts/ci/uat010_catalog_facets.py','scripts/ci/test_uat010_catalog_facets.py','scripts/ci/uat010_generate_facet_reference.ps1','scripts/ci/compare_uat010_schema_inventory.py','docs/release/g1-execution/promotion/EXISTING010-API-RUNTIME-ACL-OBSERVE-READONLY.sql','backend/src/FieldVisit.Api/Controllers/UatAutomationController.cs','backend/src/FieldVisit.Api/appsettings.json','backend/tests/FieldVisit.Application.Tests/UatAutomationSafetyTests.cs','scripts/ci/test_api_runtime_acl_matrix.py','scripts/ci/test_api_runtime_acl_matrix.ps1','docs/release/g1-execution/promotion/API-RUNTIME-SQL-CRUD-MATRIX.csv','docs/release/g1-execution/promotion/API-RUNTIME-SQL-GRANT-CANDIDATE.sql','docs/release/g1-execution/promotion/API-RUNTIME-SQL-CRUD-MATRIX.md','docs/release/g1-execution/promotion/Promotion.sql','docs/release/g1-execution/promotion/Verify.sql','docs/release/g1-execution/promotion/manifest.json','docs/release/g1-execution/promotion/reference.json','scripts/ci/test_existing010_full_schema_capture.py','docs/release/g1-execution/promotion/EXISTING010-FULL-SCHEMA-READONLY-ONCE.sql','docs/release/g1-execution/promotion/EXISTING010-FULL-SCHEMA-CAPTURE.md','scripts/ci/pathb_clean_install_acl.py'}
          assert len(j['integratedFiles'])==53 and changed==expected
          guide=p('docs/uat/BUSINESS-UAT-GUIDE-v1.8.0.md').read_text()
          assert 'Business User Access：**NOT RELEASED**' in guide
          assert 'Business UAT：**NO-GO / NOT STARTED**' in guide
          assert 'terry4410.github.io/field-visit-mileage-system/' not in guide
          assert 'pilotv01' not in guide and 'pilotl01' not in guide and 'pilota01' not in guide
          acl=p('docs/release/g1-execution/promotion/EXISTING010-API-RUNTIME-ACL-OBSERVE-READONLY.sql').read_text()
          import re
          assert all(s in acl for s in ('PrivateApiSidHex','sys.database_role_members','SchemaVersions','SchemaMigrationDataBaselines','FieldVisitMigrationLedger','BROAD_DB_DATAWRITER_ROLE','HOLD_REQUIRES_API_BOUND_NEGATIVE_AND_POSITIVE_TEST'))
          noncomments='\n'.join(line for line in acl.splitlines() if not line.lstrip().startswith('--'))
          assert not re.search(r'(?im)^\s*(?:GRANT|REVOKE|DENY|EXEC(?:UTE)?|CREATE|ALTER|DROP|TRUNCATE|DELETE|UPDATE|INSERT|MERGE)\b',noncomments), 'G1_ACL_READONLY_BREACH'

          assert j.get('securityDelta',{}).get('kind')=='runtime-sql-broad-writer-role-rejection'
          assert j['securityDelta']['codePath']=='tools/uat-release-candidate/runtime/V180UatReleaseTrust.cs'
          trust_source=p('tools/uat-release-candidate/runtime/V180UatReleaseTrust.cs').read_text()
          assert trust_source.count("AND IS_ROLEMEMBER(N'db_datawriter')=0")==1, 'G1_BROAD_WRITER_ROLE_STOP'
          assert sum(x['source']=='PR48' for x in j['integratedFiles'].values())==44
          assert sum(x['source']=='PR81' for x in j['integratedFiles'].values())==9
          for path,item in j['integratedFiles'].items():
            assert git('hash-object',path)==item['sha']
          m=json.loads(p('docs/release/g1-execution/promotion/manifest.json').read_text())
          ref=json.loads(p('docs/release/g1-execution/promotion/reference.json').read_text())
          sql=p('docs/release/optionc-canonical-sql-draft/candidate/1800_020/Up.sql').read_bytes()
          sha=hashlib.sha256(sql).hexdigest()
          assert sha=='b64a0e63261fd7ea32a329579cb7a67c9b96bede0a71653d2b1647e0fd48401c'
          assert m['sourceHashes']['docs/release/optionc-canonical-sql-draft/candidate/1800_020/Up.sql']==sha
          assert m['steps'][-1]['postCatalogSha256'].upper()==ref['steps'][-1]['catalog'].upper()
          assert ref['corrected020Evidence']['sourceSha']=='b031aa1d7c3181cbce6b8bc0f7892eae86a43ed8' and ref['corrected020Evidence']['deploymentAllowed'] is False
          assert m['approval']=='PROPOSED_NOT_AUTHORIZED' and m['schema010SourceBoundBaseline']['status']=='HOLD'
          assert j['deploymentAllowed'] is False and j['promotionPackageAligned'] is False
          api=p('backend/src/FieldVisit.Api/Controllers/UatAutomationController.cs').read_text()
          api_settings=json.loads(p('backend/src/FieldVisit.Api/appsettings.json').read_text())
          assert 'config["UatAutomation:CleanupEnabled"]' in api
          assert '&& IsCleanupEnabled(cleanupEnabled);' in api
          assert api_settings['UatAutomation']['CleanupEnabled'] is False
          assert not os.environ.get('UAT_SQL_CONNECTION') and not os.environ.get('PRODUCTION_SQL_CONNECTION')
          out=p('artifacts/uat010-integrated');out.mkdir(parents=True,exist_ok=True)
          payload={'sourceSHA':os.environ['GITHUB_SHA'],'sourceOverlays':53,'sourceIdentity':'PASS','schemaFidelity':'HOLD','promotionPackageAligned':False,'liveG1':'HOLD','deploymentAllowed':False,'azureAccess':False,'liveSqlAccess':False}
          (out/'receipt.json').write_text(json.dumps(payload,sort_keys=True)+'\n')
          print('SourceIntegration=PASS; Promotion=HOLD; LiveG1=HOLD; Azure=NONE;')
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Focused runtime history profile compile only
        if: ${{ !contains(github.event.head_commit.message, '[pathb-clean-install]') }}
        run: dotnet build tools/uat-release-candidate/upgrade-profile-tests/UpgradeProfileTests.csproj --configuration Release --nologo
      - name: Publish exact integrated API candidate (NONDEPLOY; no runtime flags)
        if: ${{ !contains(github.event.head_commit.message, '[pathb-clean-install]') }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/uat010-api-candidate"
          publish="$out/publish"
          mkdir -p "$publish"
          dotnet publish backend/src/FieldVisit.Api/FieldVisit.Api.csproj \
            --configuration Release --output "$publish" --nologo
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"uat010-api-candidate"
          publish=root/"publish"
          settings=json.loads((publish/"appsettings.json").read_text(encoding="utf-8"))
          assert settings["UatAutomation"]["CleanupEnabled"] is False
          assert settings["Auth"]["Mode"]=="Demo"
          assert settings["ConnectionStrings"]["DefaultConnection"]=="SET-IN-AZURE-APP-SERVICE"
          assert settings["Auth"]["JwtKey"]=="SET-IN-AZURE-APP-SERVICE-AT-LEAST-32-CHARS"
          assert settings["Auth"]["DemoPassword"]=="SET-IN-AZURE-APP-SERVICE"
          entries=[]
          for path in sorted(p for p in publish.rglob("*") if p.is_file()):
              entries.append({"path":path.relative_to(publish).as_posix(),"sha256":hashlib.sha256(path.read_bytes()).hexdigest()})
          manifest={
              "contract":"fieldvisit-integrated-api-candidate-v1",
              "sourceSha":os.environ["GITHUB_SHA"],
              "state":"SOURCE_BOUND_BUILD_ONLY",
              "deployable":False,
              "runtimeFlags":"NOT_CONFIGURED",
              "schemaCompatibility":"NOT_TESTED",
              "browserBusinessUat":"NOT_RUN",
              "cleanupEnabledDefault":False,
              "demoLoginDefault":"Demo",
              "embeddedSecrets":"NONE; placeholders only",
              "files":entries
          }
          (root/"candidate-manifest.json").write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          lines=[f"{item['sha256']}  publish/{item['path']}" for item in entries]
          lines.append(f"{hashlib.sha256((root/'candidate-manifest.json').read_bytes()).hexdigest()}  candidate-manifest.json")
          (root/"files.sha256").write_text("\n".join(lines)+"\n",encoding="utf-8")
          PY
          (
            cd "$out"
            sha256sum --check --quiet files.sha256
          )
          echo "API_CANDIDATE=SOURCE_BOUND_BUILD_ONLY; DEPLOYABLE=NO; LIVE_SQL=NONE; FLAGS=NOT_CONFIGURED;"
      - uses: actions/upload-artifact@v4
        if: ${{ success() && !contains(github.event.head_commit.message, '[pathb-clean-install]') }}
        with:
          name: uat010-integrated-api-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/uat010-api-candidate/
          retention-days: 30
          if-no-files-found: error
      - name: UAT automation cleanup default-off gate tests
        if: ${{ !contains(github.event.head_commit.message, '[pathb-clean-install]') }}
        run: dotnet test backend/tests/FieldVisit.Application.Tests/FieldVisit.Application.Tests.csproj --configuration Release --nologo --filter FullyQualifiedName~UatAutomationSafetyTests
      - name: Python source syntax and focused 014 preflight source guard
        if: ${{ !contains(github.event.head_commit.message, '[pathb-clean-install]') }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/uat_release/prepare_candidate.py scripts/ci/uat_release/sign_activation.py scripts/ci/g1_promotion.py scripts/ci/uat010_014_readonly.py
          python3 -m unittest discover -s scripts/ci -p test_uat010_014_readonly.py -v
          python3 -m unittest scripts/ci/test_api_runtime_acl_matrix.py -v
          python3 -m unittest scripts/ci/test_existing010_full_schema_capture.py -v
          python3 scripts/ci/uat010_014_readonly.py --output artifacts/uat010-integrated/014-preflight.sql
          test -s artifacts/uat010-integrated/014-preflight.sql
          echo 'UAT010_014_Preflight=SOURCE_BOUND_ONLY; LiveG1=HOLD;'
          python3 -m unittest discover -s scripts/ci -p test_uat010_catalog_facets.py -v
          pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [void][System.Management.Automation.Language.Parser]::ParseFile("scripts/ci/uat010_generate_facet_reference.ps1",[ref]$tokens,[ref]$errors); if ($errors.Count -ne 0) { throw "G1_FACET_SCRIPT_SYNTAX_STOP" }; Write-Output "G1FacetPowerShellSyntax=PASS"'
      - name: Fail-closed source-only proof of historical 1700_005 ImportBatches CHECK mismatch
        if: ${{ !contains(github.event.head_commit.message, '[pathb-clean-install]') }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/uat010_legacy_batch_check_drift.py --self-test --output artifacts/uat010-integrated/legacy-status-source-audit.json
          ( cd artifacts/uat010-integrated && sha256sum --check --quiet legacy-status-source-audit.sha256 )
          echo 'Existing010FixtureStatus=CONFLICT_PROVEN_SOURCE_ONLY; LiveG1=HOLD;'
      - name: Bind sanitized receipt
        if: success()
        run: cd artifacts/uat010-integrated && sha256sum receipt.json > checksums.sha256
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: uat010-integrated-source-${{ github.sha }}
          path: artifacts/uat010-integrated/
          retention-days: 30
          if-no-files-found: error

  pathb-current-api-clean-install-nondeploy:
    name: Current PR83 API + object ACL on integrated 69-table SQL2022 clean install (NONDEPLOY)
    needs: combined-source
    if: github.repository == 'Terry4410/field-visit-mileage-system' && github.ref == 'refs/heads/work/uat010-existing-rc-integration-20261025' && contains(github.event.head_commit.message, '[pathb-clean-install]')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      CLEAN_INSTALL_RC_SHA: 9d431ea318fcec34f04f3cc36a8fb6d01d00c48a
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact integrated API and clean-schema source bindings
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json,pathlib,subprocess
          ledger=json.loads(pathlib.Path('docs/release/g1-execution/promotion/integration-ledger.json').read_text())
          assert ledger['sourceBranches']['PR48_CLEAN']=='9ee5dacceed2bf55c39310d663f3258bcb545989'
          required={
            'tools/clean-install/HttpApiSmoke.cs',
            'tools/clean-install/HttpApiRoleProbe.cs',
            'tools/clean-install/HttpApiBusinessProbe.cs',
            'tools/clean-install/Program.cs',
            'database/clean-install/v180/00_schema_versions.sql',
            'database/clean-install/v180/20_route_reason_check.sql'
          }
          assert required.issubset(ledger['integratedFiles'])
          assert all(ledger['integratedFiles'][p]['source']=='PR48' for p in required)
          for p in required:
            assert subprocess.check_output(['git','hash-object',p],text=True).strip()==ledger['integratedFiles'][p]['sha']
          app_context='backend/src/FieldVisit.Infrastructure/AppDbContext.cs'
          pinned_app_context='fff038e9b2a8ce884fddad0a44da0252baa35571'
          base='ae9ca02cf2d9539fe9bed61a073d60d63731cbb9'
          assert subprocess.check_output(['git','hash-object',app_context],text=True).strip()==pinned_app_context
          assert subprocess.check_output(['git','rev-parse',f'{base}:{app_context}'],text=True).strip()==pinned_app_context
          assert ledger['deploymentAllowed'] is False
          print('Current API exact SHA + immutable PR48 clean-schema source binding: PASS')
          PY
      - uses: actions/checkout@v4
        with:
          ref: 9d431ea318fcec34f04f3cc36a8fb6d01d00c48a
          path: pathb-runtime-source
          fetch-depth: 1
          persist-credentials: false
      - name: Confirm accepted RC schema source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pathb-runtime-source rev-parse HEAD)" = "$CLEAN_INSTALL_RC_SHA"
          test -f pathb-runtime-source/backend/src/FieldVisit.Infrastructure/AppDbContext.cs
          echo "CLEAN_INSTALL_RC_ROOT=$GITHUB_WORKSPACE/pathb-runtime-source" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Start isolated SQL Server 2022 and create masked ephemeral admin credential
        shell: bash
        run: |
          set -euo pipefail
          sql_password="Aa7!$(python3 -c 'import secrets; print(secrets.token_hex(24))')"
          printf 'CLEAN_INSTALL_SQL_PASSWORD=%s\n' "$sql_password" >> "$GITHUB_ENV"
          printf '::add-mask::%s\n' "$sql_password"
          docker run --detach --name fieldvisit-pathb-sql2022 \
            --publish 127.0.0.1:1433:1433 \
            --env ACCEPT_EULA=Y --env MSSQL_PID=Developer \
            --env "MSSQL_SA_PASSWORD=$sql_password" \
            mcr.microsoft.com/mssql/server:2022-latest >/dev/null 2>&1
          unset sql_password
          echo 'PATHB_SQL2022=EPHEMERAL_LOCAL_ONLY'
      - name: Wait for isolated SQL Server 2022 readiness
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if docker exec fieldvisit-pathb-sql2022 /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P "$CLEAN_INSTALL_SQL_PASSWORD" -C -l 3 -Q 'SELECT 1' >/dev/null 2>&1; then
              echo 'PATHB_SQL2022_READY=PASS'
              exit 0
            fi
            sleep 2
          done
          echo 'PATHB_SQL2022_READY=FAIL' >&2
          exit 1
      - name: Build exact PR83 API and prepare matrix-restricted clean-install runner
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/pathb_clean_install_acl.py
          python3 scripts/ci/pathb_clean_install_acl.py --self-test
          api_root="$RUNNER_TEMP/pathb-current-api"
          output="$RUNNER_TEMP/pathb-clean-install-output"
          runner="$GITHUB_WORKSPACE/.pathb-clean-install-runner"
          grants="$RUNNER_TEMP/pathb-runtime-grants.sql"
          mkdir -p "$api_root" "$output"
          dotnet publish backend/src/FieldVisit.Api/FieldVisit.Api.csproj \
            --configuration Release --output "$api_root" --nologo
          python3 scripts/ci/pathb_clean_install_acl.py \
            --repo "$GITHUB_WORKSPACE" --runner "$runner" --grants "$grants"
          echo "CLEAN_INSTALL_OUTPUT_DIR=$output" >> "$GITHUB_ENV"
          echo "CLEAN_INSTALL_API_CANDIDATE_ROOT=$api_root" >> "$GITHUB_ENV"
          echo "FIELDVISIT_API_RUNTIME_GRANTS_SQL_FILE=$grants" >> "$GITHUB_ENV"
          echo "PATHB_RUNNER_DIR=$runner" >> "$GITHUB_ENV"
          # The PR48 runner consumes generated source packages. Bind these exact
          # generators through integration-ledger.json and build them before SQL DDL.
          python3 scripts/ci/clean_install/build_sql_only_tables.py \
            --rc-root "$CLEAN_INSTALL_RC_ROOT" --output "$output"
          python3 scripts/ci/clean_install/build_effective_triggers.py \
            --rc-root "$CLEAN_INSTALL_RC_ROOT" --output "$output"
          python3 scripts/ci/clean_install/build_optionc_sql_only_tables.py \
            --rc-root "$CLEAN_INSTALL_RC_ROOT" --output "$output"
          python3 scripts/ci/clean_install/build_sql_only_indexes.py \
            --rc-root "$CLEAN_INSTALL_RC_ROOT" --output "$output"
          python3 scripts/ci/clean_install/build_007_checks.py \
            --rc-root "$CLEAN_INSTALL_RC_ROOT" --output "$output"
          python3 scripts/ci/clean_install/build_001_004_checks.py \
            --rc-root "$CLEAN_INSTALL_RC_ROOT" --output "$output"
          python3 scripts/ci/clean_install/build_optionc_final_checks.py \
            --rc-root "$CLEAN_INSTALL_RC_ROOT" --output "$output"
          dotnet build "$runner/ModelBaselineRunner.csproj" \
            --configuration Release -p:RcSourceRoot="$CLEAN_INSTALL_RC_ROOT" --nologo
      - name: Run integrated 69-table schema, minimum Runtime ACL, and current API HTTP business probes
        shell: bash
        run: |
          set -euo pipefail
          dotnet "$PATHB_RUNNER_DIR/bin/Release/net8.0/ModelBaselineRunner.dll" \
            --rc-root "$CLEAN_INSTALL_RC_ROOT" --output "$CLEAN_INSTALL_OUTPUT_DIR"
          echo 'CurrentPR83API=REAL_HTTP_TO_SQL2022; RuntimePrincipal=OBJECT_SCOPED_MATRIX; Deployment=NONE'
      - name: Seal exact API bytes used by the successful isolated ACL run
        shell: python
        run: |
          import hashlib,json,os,pathlib,shutil,subprocess
          source=pathlib.Path(os.environ['CLEAN_INSTALL_API_CANDIDATE_ROOT'])
          settings=json.loads((source/'appsettings.json').read_text(encoding='utf-8'))
          assert settings['UatAutomation']['CleanupEnabled'] is False
          assert settings['Auth']['Mode']=='Demo'
          assert settings['ConnectionStrings']['DefaultConnection']=='SET-IN-AZURE-APP-SERVICE'
          assert settings['Auth']['JwtKey']=='SET-IN-AZURE-APP-SERVICE-AT-LEAST-32-CHARS'
          assert settings['Auth']['DemoPassword']=='SET-IN-AZURE-APP-SERVICE'
          root=pathlib.Path('artifacts/pathb-current-api-candidate')
          root.mkdir(parents=True,exist_ok=False)
          publish=root/'publish'
          shutil.copytree(source,publish)
          files=[{'path':p.relative_to(publish).as_posix(),'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
                 for p in sorted(publish.rglob('*')) if p.is_file()]
          manifest={
            'contract':'fieldvisit-pathb-api-candidate-after-isolated-acl-v1',
            'sourceSha':os.environ['GITHUB_SHA'],
            'state':'TESTED_BUILD_CANDIDATE_NONDEPLOY',
            'deployable':False,
            'apiBytes':'exact publish output used for SQL2022 HTTP probes',
            'cleanInstallSchema':'PR48-derived 69-table SQL2022 disposable schema; runtime ACL probe passed',
            'runtimePrincipal':'object-scoped SELECT plus CRUD candidate; no broad database roles',
            'cleanupEnabledDefault':False,
            'authMode':'Demo only in disposable CI; placeholder credential values in package',
            'azureRuntimeFlags':'NOT_VERIFIED',
            'excelImport':'NOT_TESTED',
            'worker':'DISABLED_NOT_TESTED',
            'fullBusinessUat':'NOT_RUN',
            'liveSql':'NONE',
            'azure':'NONE',
            'files':files
          }
          (root/'candidate-manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          checks=[f"{x['sha256']}  publish/{x['path']}" for x in files]
          checks.append(f"{hashlib.sha256((root/'candidate-manifest.json').read_bytes()).hexdigest()}  candidate-manifest.json")
          (root/'checksums.sha256').write_text('\n'.join(checks)+'\n')
          subprocess.run(['sha256sum','--check','--quiet','checksums.sha256'],cwd=root,check=True)
          print('PathBApiCandidate=EXACT_TESTED_BYTES_SEALED; DEPLOYABLE=NO; SECRETS=PLACEHOLDERS_ONLY')
      - name: Seal sanitized Path B test receipt
        shell: python
        run: |
          import hashlib,json,os,pathlib,subprocess
          matrix=pathlib.Path('docs/release/g1-execution/promotion/API-RUNTIME-SQL-CRUD-MATRIX.csv')
          ledger=json.loads(pathlib.Path('docs/release/g1-execution/promotion/integration-ledger.json').read_text())
          pr48_files=['tools/clean-install/HttpApiSmoke.cs','database/clean-install/v180/00_schema_versions.sql']
          source_bindings={p:ledger['integratedFiles'][p]['sha'] for p in pr48_files}
          app_context='backend/src/FieldVisit.Infrastructure/AppDbContext.cs'
          source_bindings[app_context]=subprocess.check_output(
            ['git','rev-parse',f"ae9ca02cf2d9539fe9bed61a073d60d63731cbb9:{app_context}"],text=True).strip()
          receipt={
            'contract':'fieldvisit-pathb-current-api-clean-install-acl-v1',
            'sourceSha':os.environ['GITHUB_SHA'],
            'schemaSourceRcSha':os.environ['CLEAN_INSTALL_RC_SHA'],
            'matrixSha256':hashlib.sha256(matrix.read_bytes()).hexdigest(),
            'apiCandidateManifestSha256':hashlib.sha256(pathlib.Path('artifacts/pathb-current-api-candidate/candidate-manifest.json').read_bytes()).hexdigest(),
            'sourceBindings':source_bindings,
            'cleanInstallTables':69,
