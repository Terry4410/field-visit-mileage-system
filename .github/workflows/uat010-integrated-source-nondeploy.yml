name: UAT010 combined source identity and compile NONDEPLOY
on:
  push:
    branches: [work/uat010-existing-rc-integration-20261025]
permissions:
  contents: read
concurrency:
  group: uat010-integrated-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  combined-source:
    if: github.repository == 'Terry4410/field-visit-mileage-system' && github.ref == 'refs/heads/work/uat010-existing-rc-integration-20261025'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exact immutable source overlays and fail-closed release boundary
        shell: python
        run: |
          import hashlib,json,os,pathlib,subprocess
          p=pathlib.Path
          def git(*a):return subprocess.check_output(['git',*a],text=True).strip()
          j=json.loads(p('docs/release/g1-execution/promotion/integration-ledger.json').read_text())
          assert j['contract']=='uat010-combined-source-review-v1'
          assert j['sourceBranches']=={'PR82_BASE':'ae9ca02cf2d9539fe9bed61a073d60d63731cbb9','PR48_CLEAN':'9ee5dacceed2bf55c39310d663f3258bcb545989','PR81_HISTORY':'5bab502f20d9590d415d6a25a238d1629057989d'}
          assert git('rev-parse','HEAD')==os.environ['GITHUB_SHA']
          assert subprocess.run(['git','merge-base','--is-ancestor','ae9ca02cf2d9539fe9bed61a073d60d63731cbb9','HEAD']).returncode==0
          changed=set(git('diff','--name-only','ae9ca02cf2d9539fe9bed61a073d60d63731cbb9','HEAD').splitlines())
          expected=set(j['integratedFiles'])|{'docs/release/g1-execution/promotion/integration-ledger.json','docs/release/g1-execution/promotion/EXISTING010-INTEGRATION-BOUNDARY.md','.github/workflows/uat010-integrated-source-nondeploy.yml','scripts/ci/uat010_014_readonly.py','scripts/ci/test_uat010_014_readonly.py','docs/release/g1-execution/promotion/UAT010-014-READONLY.md','scripts/ci/test_uat010_014_readonly.ps1','scripts/ci/uat_release/build_optionc_frontend_dual_nondeploy.py','docs/release/g1-execution/promotion/UAT010-FRONTEND-DUAL-NONDEPLOY.md','docs/release/g1-execution/promotion/HISTORIC-API-DLL-REBUILD-NONDEPLOY.md','scripts/ci/uat010_legacy_batch_check_drift.py','docs/release/g1-execution/promotion/EXISTING010-SYNTHETIC-CHECK-DRIFT.md','scripts/ci/uat010_catalog_facets.py','scripts/ci/test_uat010_catalog_facets.py','scripts/ci/uat010_generate_facet_reference.ps1','docs/release/g1-execution/promotion/EXISTING010-API-RUNTIME-ACL-OBSERVE-READONLY.sql','backend/src/FieldVisit.Api/Controllers/UatAutomationController.cs','backend/src/FieldVisit.Api/appsettings.json','backend/tests/FieldVisit.Application.Tests/UatAutomationSafetyTests.cs','scripts/ci/test_api_runtime_acl_matrix.py','scripts/ci/test_api_runtime_acl_matrix.ps1','docs/release/g1-execution/promotion/API-RUNTIME-SQL-CRUD-MATRIX.csv','docs/release/g1-execution/promotion/API-RUNTIME-SQL-GRANT-CANDIDATE.sql','docs/release/g1-execution/promotion/API-RUNTIME-SQL-CRUD-MATRIX.md','docs/release/g1-execution/promotion/Promotion.sql','docs/release/g1-execution/promotion/Verify.sql','docs/release/g1-execution/promotion/manifest.json','docs/release/g1-execution/promotion/reference.json','scripts/ci/test_existing010_full_schema_capture.py','docs/release/g1-execution/promotion/EXISTING010-FULL-SCHEMA-READONLY-ONCE.sql','docs/release/g1-execution/promotion/EXISTING010-FULL-SCHEMA-CAPTURE.md'}
          assert len(j['integratedFiles'])==53 and changed==expected
          acl=p('docs/release/g1-execution/promotion/EXISTING010-API-RUNTIME-ACL-OBSERVE-READONLY.sql').read_text()
          import re
          assert all(s in acl for s in ('PrivateApiSidHex','sys.database_role_members','SchemaVersions','SchemaMigrationDataBaselines','FieldVisitMigrationLedger','BROAD_DB_DATAWRITER_ROLE','HOLD_REQUIRES_API_BOUND_NEGATIVE_AND_POSITIVE_TEST'))
          noncomments='\n'.join(line for line in acl.splitlines() if not line.lstrip().startswith('--'))
          assert not re.search(r'(?im)^\s*(?:GRANT|REVOKE|DENY|EXEC(?:UTE)?|CREATE|ALTER|DROP|TRUNCATE|DELETE|UPDATE|INSERT|MERGE)\b',noncomments), 'G1_ACL_READONLY_BREACH'

          assert j.get('securityDelta',{}).get('kind')=='runtime-sql-broad-writer-role-rejection'
          assert j['securityDelta']['codePath']=='tools/uat-release-candidate/runtime/V180UatReleaseTrust.cs'
          trust_source=p('tools/uat-release-candidate/runtime/V180UatReleaseTrust.cs').read_text()
          assert trust_source.count("AND IS_ROLEMEMBER(N'db_datawriter')=0")==1, 'G1_BROAD_WRITER_ROLE_STOP'
          assert sum(x['source']=='PR48' for x in j['integratedFiles'].values())==44
          assert sum(x['source']=='PR81' for x in j['integratedFiles'].values())==9
          for path,item in j['integratedFiles'].items():
            assert git('hash-object',path)==item['sha']
          m=json.loads(p('docs/release/g1-execution/promotion/manifest.json').read_text())
          ref=json.loads(p('docs/release/g1-execution/promotion/reference.json').read_text())
          sql=p('docs/release/optionc-canonical-sql-draft/candidate/1800_020/Up.sql').read_bytes()
          sha=hashlib.sha256(sql).hexdigest()
          assert sha=='b64a0e63261fd7ea32a329579cb7a67c9b96bede0a71653d2b1647e0fd48401c'
          assert m['sourceHashes']['docs/release/optionc-canonical-sql-draft/candidate/1800_020/Up.sql']==sha
          assert m['steps'][-1]['postCatalogSha256'].upper()==ref['steps'][-1]['catalog'].upper()
          assert ref['corrected020Evidence']['sourceSha']=='b031aa1d7c3181cbce6b8bc0f7892eae86a43ed8' and ref['corrected020Evidence']['deploymentAllowed'] is False
          assert m['approval']=='PROPOSED_NOT_AUTHORIZED' and m['schema010SourceBoundBaseline']['status']=='HOLD'
          assert j['deploymentAllowed'] is False and j['promotionPackageAligned'] is False
          api=p('backend/src/FieldVisit.Api/Controllers/UatAutomationController.cs').read_text()
          api_settings=json.loads(p('backend/src/FieldVisit.Api/appsettings.json').read_text())
          assert 'config["UatAutomation:CleanupEnabled"]' in api
          assert '&& IsCleanupEnabled(cleanupEnabled);' in api
          assert api_settings['UatAutomation']['CleanupEnabled'] is False
          assert not os.environ.get('UAT_SQL_CONNECTION') and not os.environ.get('PRODUCTION_SQL_CONNECTION')
          out=p('artifacts/uat010-integrated');out.mkdir(parents=True,exist_ok=True)
          payload={'sourceSHA':os.environ['GITHUB_SHA'],'sourceOverlays':53,'sourceIdentity':'PASS','schemaFidelity':'HOLD','promotionPackageAligned':False,'liveG1':'HOLD','deploymentAllowed':False,'azureAccess':False,'liveSqlAccess':False}
          (out/'receipt.json').write_text(json.dumps(payload,sort_keys=True)+'\n')
          print('SourceIntegration=PASS; Promotion=HOLD; LiveG1=HOLD; Azure=NONE;')
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Focused runtime history profile compile only
        run: dotnet build tools/uat-release-candidate/upgrade-profile-tests/UpgradeProfileTests.csproj --configuration Release --nologo
      - name: UAT automation cleanup default-off gate tests
        run: dotnet test backend/tests/FieldVisit.Application.Tests/FieldVisit.Application.Tests.csproj --configuration Release --nologo --filter FullyQualifiedName~UatAutomationSafetyTests
      - name: Python source syntax and focused 014 preflight source guard
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/uat_release/prepare_candidate.py scripts/ci/uat_release/sign_activation.py scripts/ci/g1_promotion.py scripts/ci/uat010_014_readonly.py
          python3 -m unittest discover -s scripts/ci -p test_uat010_014_readonly.py -v
          python3 -m unittest scripts/ci/test_api_runtime_acl_matrix.py -v
          python3 -m unittest scripts/ci/test_existing010_full_schema_capture.py -v
          python3 scripts/ci/uat010_014_readonly.py --output artifacts/uat010-integrated/014-preflight.sql
          test -s artifacts/uat010-integrated/014-preflight.sql
          echo 'UAT010_014_Preflight=SOURCE_BOUND_ONLY; LiveG1=HOLD;'
          python3 -m unittest discover -s scripts/ci -p test_uat010_catalog_facets.py -v
          pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [void][System.Management.Automation.Language.Parser]::ParseFile("scripts/ci/uat010_generate_facet_reference.ps1",[ref]$tokens,[ref]$errors); if ($errors.Count -ne 0) { throw "G1_FACET_SCRIPT_SYNTAX_STOP" }; Write-Output "G1FacetPowerShellSyntax=PASS"'
      - name: Fail-closed source-only proof of historical 1700_005 ImportBatches CHECK mismatch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/uat010_legacy_batch_check_drift.py --self-test --output artifacts/uat010-integrated/legacy-status-source-audit.json
          ( cd artifacts/uat010-integrated && sha256sum --check --quiet legacy-status-source-audit.sha256 )
          echo 'Existing010FixtureStatus=CONFLICT_PROVEN_SOURCE_ONLY; LiveG1=HOLD;'
      - name: Bind sanitized receipt
        if: success()
        run: cd artifacts/uat010-integrated && sha256sum receipt.json > checksums.sha256
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: uat010-integrated-source-${{ github.sha }}
          path: artifacts/uat010-integrated/
          retention-days: 30
          if-no-files-found: error

  corrected-020-reference:
    name: Corrected phase020 synthetic catalog derivation (LOCAL SQL2022 ONLY)
    needs: combined-source
    if: github.repository == 'Terry4410/field-visit-mileage-system' && github.ref == 'refs/heads/work/uat010-existing-rc-integration-20261025' && !contains(github.event.head_commit.message, '[catalog-source-only]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      E1_R1_REQUIRED: '1'
      OPTIONC_EXECUTION_MODE: IsolatedSqlTest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source is a true descendant of accepted PR82
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor ae9ca02cf2d9539fe9bed61a073d60d63731cbb9 HEAD
          test -z "${UAT_SQL_CONNECTION:-}"
          test -z "${PRODUCTION_SQL_CONNECTION:-}"
          echo 'ReferenceTarget=DISPOSABLE_SQL2022_ONLY; Azure=NONE;'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Prepare isolated SQL client using verified official PSGallery only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $gallery = Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue
          if ($null -eq $gallery) {
            Register-PSRepository -Default -ErrorAction Stop
            $gallery = Get-PSRepository -Name PSGallery -ErrorAction Stop
          }
          if ($gallery.SourceLocation.TrimEnd('/') -ne 'https://www.powershellgallery.com/api/v2') {
            throw 'G1_SQL_CLIENT_REPOSITORY_ORIGIN_STOP'
          }
          Install-Module SqlServer -RequiredVersion 22.4.5.1 -Scope CurrentUser -Force -AllowClobber -Repository PSGallery -ErrorAction Stop *> $null
          Import-Module SqlServer -RequiredVersion 22.4.5.1 -ErrorAction Stop
          if ((Get-Module SqlServer).Version.ToString() -ne '22.4.5.1') {
            throw 'G1_SQL_CLIENT_VERSION_STOP'
          }
          Write-Output 'G1SqlClient=OFFICIAL_PSGALLERY_EXACT_MODULE_PASS; Azure=NONE;'
      - name: Start ephemeral SQL2022 Developer on localhost
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 24)!G1a"
          connection="Server=localhost,1433;Database=master;User Id=sa;Password=${password};Encrypt=False;TrustServerCertificate=True;Connect Timeout=5;ConnectRetryCount=0"
          echo "::add-mask::$password"
          echo "::add-mask::$connection"
          envfile="$RUNNER_TEMP/g1-reference-sql.env"
          umask 077
          printf 'ACCEPT_EULA=Y\nMSSQL_PID=Developer\nMSSQL_SA_PASSWORD=%s\n' "$password" > "$envfile"
          docker run -d --name uat010-ref-local -p 127.0.0.1:1433:1433 --env-file "$envfile" mcr.microsoft.com/mssql/server:2022-latest > /dev/null
          rm -f "$envfile"
          ready=0
          for _ in $(seq 1 24); do
            if docker exec -e "SQLCMDPASSWORD=$password" uat010-ref-local /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -l 3 -Q 'SELECT 1' >/dev/null 2>&1; then ready=1; break; fi
            sleep 5
          done
          test "$ready" = 1
          printf 'E1_R1_SQL_CONNECTION=%s\n' "$connection" >> "$GITHUB_ENV"
          echo 'EphemeralSQL=READY; Target=LOCAL_ONLY;'
      - name: Run source-bound API SQL ACL matrix with restricted Runtime principal (LOCAL SQL2022 ONLY)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/ci/test_api_runtime_acl_matrix.ps1
      - name: Seal and upload isolated API ACL receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/uat010-api-acl/receipt.json
          cd artifacts/uat010-api-acl
          sha256sum receipt.json > checksums.sha256
          sha256sum --check --quiet checksums.sha256
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: uat010-api-runtime-acl-nondeploy-${{ github.sha }}
          path: artifacts/uat010-api-acl/
          retention-days: 30
          if-no-files-found: error
      - name: Derive corrected 020 synthetic catalog without touching frozen reference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          pwsh -NoProfile -File scripts/ci/test_g1_promotion.ps1 -Mode Reference
      - name: Assert previous eight stages unchanged and label result SYNTHETIC
        shell: python
        run: |
          import hashlib,json,os,pathlib
          p=pathlib.Path
          old=json.loads(p('docs/release/g1-execution/promotion/reference.json').read_text())
          new=json.loads(p('artifacts/observed-reference.json').read_text())
          assert old['fixture']=='SYNTHETIC_SCOPED_MIGRATION_CONTRACT_NOT_UAT_OR_150_BASELINE'
          assert new['fixture']==old['fixture']
          assert new['initial'].upper()==old['initial'].upper()
          assert new['emptyLedger'].upper()==old['emptyLedger'].upper()
          assert [x['id'] for x in new['steps']]==[11,12,14,15,16,17,18,19,20]
          for oldstep,newstep in zip(old['steps'][:8],new['steps'][:8]):
            assert oldstep['id']==newstep['id'] and oldstep['catalog'].upper()==newstep['catalog'].upper()
          corrected020=new['steps'][8]['catalog'].upper()
          assert len(corrected020)==64 and all(c in '0123456789ABCDEF' for c in corrected020)
          assert corrected020==old['steps'][8]['catalog'].upper()
          sql=p('docs/release/optionc-canonical-sql-draft/candidate/1800_020/Up.sql').read_bytes()
          assert hashlib.sha256(sql).hexdigest()=='b64a0e63261fd7ea32a329579cb7a67c9b96bede0a71653d2b1647e0fd48401c'
          assert b"Confirming" in sql
          out=p('artifacts/uat010-corrected020')
          out.mkdir(parents=True,exist_ok=True)
          payload={'contract':'corrected020-synthetic-reference-v1','sourceSha':os.environ['GITHUB_SHA'],'sourceScope':'ISOLATED_SQL2022_SYNTHETIC_NOT_LIVE_UAT','originalReferenceSha256':hashlib.sha256(p('docs/release/g1-execution/promotion/reference.json').read_bytes()).hexdigest(),'phase020SqlSha256':hashlib.sha256(sql).hexdigest(),'firstEightCatalogsUnchanged':True,'phase020CatalogSha256':corrected020,'livePredecessorFidelity':'HOLD','releaseGate':'HOLD','azureAccess':False,'liveSqlAccess':False}
          (out/'reference.json').write_text(json.dumps(payload,sort_keys=True,indent=2)+'\n')
          print('Corrected020SyntheticReference=PASS; FirstEightCatalogs=UNCHANGED; Phase020Catalog='+corrected020+'; LiveUAT=HOLD;')
      - name: Regenerate deterministic synthetic-only promotion candidate in ephemeral checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path
          original=p('docs/release/g1-execution/promotion/reference.json')
          current=json.loads(original.read_text())
          produced=json.loads(p('artifacts/observed-reference.json').read_text())
          assert current['fixture']=='SYNTHETIC_SCOPED_MIGRATION_CONTRACT_NOT_UAT_OR_150_BASELINE'
          assert [x['catalog'].upper() for x in current['steps'][:8]]==[x['catalog'].upper() for x in produced['steps'][:8]]
          assert current['initial'].upper()==produced['initial'].upper()
          assert current['emptyLedger'].upper()==produced['emptyLedger'].upper()
          assert produced['steps'][-1]['catalog'].upper()=='2F6346FBC1E113EAF678F4A256A2F4F3704342B3905DA4794FC658728B56D281'
          current['steps'][-1]['catalog']=produced['steps'][-1]['catalog']
          current['corrected020Source']='PR83_B031AA1D_CORRECTED020_ISOLATED_SQL2022'
          current['liveUat010Predecessor']='NOT_VERIFIED_DO_NOT_DEPLOY'
          original.write_text(json.dumps(current,indent=2)+'\n')
          print('SyntheticReference020=BOUND; OriginalSourceReference=UNCHANGED_IN_GIT; UAT010=HOLD;')
          PY
          python3 scripts/ci/g1_promotion.py build
          python3 scripts/ci/g1_promotion.py verify
      - name: Four focused synthetic 26-history promotion and rollback regressions
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoProfile -File scripts/ci/test_g1_promotion.ps1 -Mode HistoryCompatibility
      - name: Execute focused SOURCE-BOUND 014 SELECT-only preflight on disposable SQL2022
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/uat010_014_readonly.py --output artifacts/uat010-014/014-preflight.sql
          pwsh -NoProfile -File scripts/ci/test_uat010_014_readonly.ps1
      - name: Seal NONDEPLOY synthetic package only
        shell: python
        run: |
          import hashlib,json,os,pathlib,shutil
          p=pathlib.Path
          root=p('docs/release/g1-execution/promotion')
          manifest=json.loads((root/'manifest.json').read_text())
          ref=json.loads((root/'reference.json').read_text())
          up20=p('docs/release/optionc-canonical-sql-draft/candidate/1800_020/Up.sql')
          digest=lambda f:hashlib.sha256(f.read_bytes()).hexdigest()
          assert manifest['approval']=='PROPOSED_NOT_AUTHORIZED'
          assert manifest['schema010SourceBoundBaseline']['status']=='HOLD'
          assert manifest['schema010SourceBoundBaseline']['syntheticReferenceAcceptedAsUatBaseline'] is False
          assert ref['fixture']=='SYNTHETIC_SCOPED_MIGRATION_CONTRACT_NOT_UAT_OR_150_BASELINE'
          assert ref['liveUat010Predecessor']=='NOT_VERIFIED_DO_NOT_DEPLOY'
          assert manifest['sourceHashes'][str(up20)]==digest(up20)
          assert manifest['steps'][-1]['postCatalogSha256'].upper()=='2F6346FBC1E113EAF678F4A256A2F4F3704342B3905DA4794FC658728B56D281'
          assert manifest['packageId']==manifest['steps'][0]['payloadSha256'] or len(manifest['packageId'])==64
          files=['Promotion.sql','Verify.sql','manifest.json','reference.json','CatalogContract.sql','HistoryContract.sql','LedgerContract.sql']
          for f in files:
            assert manifest['files'][str(root/f)]==digest(root/f) if f!='manifest.json' else True
          dest=p('artifacts/uat010-synthetic-promotion')
          dest.mkdir(parents=True,exist_ok=True)
          for f in files:shutil.copyfile(root/f,dest/f)
          receipt={'contract':'uat010-corrected020-synthetic-promotion-v1','sourceSha':os.environ['GITHUB_SHA'],'releaseAllowed':False,'liveUatSqlAccess':False,'azureAccess':False,'predecessorSourceFidelity':'HOLD','apiPrincipal':'UNKNOWN','recoveryPair':'HOLD','syntheticHistory4Cases':'PASS','origin':'DISPOSABLE_SQL2022_ONLY','packageId':manifest['packageId'],'fileSha256':{f:digest(dest/f) for f in files}}
          (dest/'receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print('Corrected020OfflinePromotion=BUILT_AND_HISTORY4_PASS; RealUAT010=HOLD; Deploy=DENIED;')
      - name: Derive isolated one-facet historical 1700_005 Confirming contrast (NO LIVE UAT)
        shell: bash
        run: |
          set -euo pipefail
          fixture=scripts/ci/run_full_candidate_migration.ps1
          save="$RUNNER_TEMP/uat010-pr50-synthetic-fixture.original"
          cp "$fixture" "$save"
          trap 'cp "$save" scripts/ci/run_full_candidate_migration.ps1; rm -f "$save"' EXIT
          python3 - <<'PY'
          import pathlib
          path=pathlib.Path('scripts/ci/run_full_candidate_migration.ps1')
          old="N'Previewed',N'Confirmed',N'PartiallyFailed'))"
          new="N'Previewed',N'Confirming',N'Confirmed',N'PartiallyFailed'))"
          source=path.read_text()
          assert source.count(old)==1 and source.count(new)==0, 'G1_FROZEN_FIXTURE_SHAPE_STOP'
          path.write_text(source.replace(old,new,1))
          print('OneFacetFixture=1700_005_Confirming_INJECTED_EPHEMERAL_ONLY; OriginalPR50=UNCHANGED_IN_GIT;')
          PY
          pwsh -NoProfile -File scripts/ci/test_g1_promotion.ps1 -Mode Reference
          python3 - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path
          prior=json.loads(p('docs/release/g1-execution/promotion/reference.json').read_text())
          observed=json.loads(p('artifacts/observed-reference.json').read_text())
          assert prior['fixture']=='SYNTHETIC_SCOPED_MIGRATION_CONTRACT_NOT_UAT_OR_150_BASELINE'
          assert observed['fixture']==prior['fixture']
          assert len(observed['steps'])==9
          assert [x['id'] for x in observed['steps']]==[11,12,14,15,16,17,18,19,20]
          assert observed['initial'].upper()!=prior['initial'].upper(), 'G1_EXPECTED_SOURCE_CONTRAST_MISSING'
          result={
            'contract':'existing010-1700_005-one-facet-source-contrast-nondeploy-v1',
            'liveUatSqlQueried':False,'azureAccess':False,'sqlWriteToLiveUat':False,
            'syntheticChange':'CK_ImportBatches_Status_ADD_Confirming_ONLY',
            'baselineBefore':prior['initial'].upper(),
            'baselineAfterOneFacetCorrection':observed['initial'].upper(),
            'baselineDiffers':True,
            'actual63TableCatalogCompared':False,
            'actual26HistoricalRowsCompared':False,
            'allTriggerBodiesCompared':False,
            'originalPR50ReferenceChangedInGit':False,
            'releaseAuthorized':False,'businessUat':'NO_GO','g1':'HOLD'
          }
          dest=p('artifacts/uat010-corrected020/1700-005-one-facet-contrast.json')
          dest.write_text(json.dumps(result,sort_keys=True,indent=2)+'\n')
          print('HistoricalBatchCheckOneFacet=DIFFERENT_INITIAL_HASH_CONFIRMED; RealUAT=NOT_ACCESSED; Migration=DENIED;')
          PY
      - name: Source-derived 1700_005 scoped facet reference (DISPOSABLE SQL2022 ONLY)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & pwsh -NoProfile -File scripts/ci/uat010_generate_facet_reference.ps1
      - name: Seal scoped historical CHECK reference checksums
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/uat010-corrected020
          sha256sum scoped-historical-check-facets.json scoped-live-status-NOT-EXECUTED.sql > scoped-facets-checksums.sha256
          sha256sum --check --quiet scoped-facets-checksums.sha256
          echo 'ScopedHistoricalCheckFacet=SEALED; Full63Table=HOLD; Azure=NONE;'
      - name: Bind synthetic-only package file checksums
        if: success()
        shell: bash
        run: |
          cd artifacts/uat010-synthetic-promotion
          sha256sum Promotion.sql Verify.sql manifest.json reference.json CatalogContract.sql HistoryContract.sql LedgerContract.sql receipt.json > checksums.sha256
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: uat010-corrected020-promotion-nondeploy-${{ github.sha }}
