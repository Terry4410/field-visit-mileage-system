name: v1.8.0 Package 1 Stage 007 model validation

on:
  push:
    branches:
      - work/v180-p1-stage007-model-validation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact Package 1 candidate
        uses: actions/checkout@v4
        with:
          ref: 8f553122ef1ee6a90897ea18d273a76a98048ce6
          fetch-depth: 0

      - name: Verify exact candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="8f553122ef1ee6a90897ea18d273a76a98048ce6"
          echo "CHECKED_OUT_SHA=$actual"
          echo "EXPECTED_CANDIDATE_SHA=$expected"
          test "$actual" = "$expected"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Record .NET version
        run: dotnet --version

      - name: Install CJK font required by backend tests
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Backend build
        run: dotnet build backend/src/FieldVisit.Api/FieldVisit.Api.csproj -c Release

      - name: Focused Stage 007 model mapping tests
        run: >
          dotnet test
          backend/tests/FieldVisit.Application.Tests/FieldVisit.Application.Tests.csproj
          -c Release
          --filter "FullyQualifiedName~V180Stage007ModelMappingTests"

      - name: Focused SQL trigger compatibility tests
        run: >
          dotnet test
          backend/tests/FieldVisit.Application.Tests/FieldVisit.Application.Tests.csproj
          -c Release
          --filter "FullyQualifiedName~V180SqlServerTriggerCompatibilityTests"

      - name: Full backend regression suite
        run: >
          dotnet test
          backend/tests/FieldVisit.Application.Tests/FieldVisit.Application.Tests.csproj
          -c Release
