name: Path B QUERY-05 readable PDF NONDEPLOY validation
on:
  push:
    branches: [fix/pathb-query05-pdf-readable-20261123]
permissions:
  contents: read
jobs:
  pdf-report:
    if: github.repository == 'Terry4410/field-visit-mileage-system'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pin actual deployed Path B API lineage and 3-file scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor f0da6243e5851b0fe9adeb0c7ed009074b588e8d HEAD
          git diff --name-only f0da6243e5851b0fe9adeb0c7ed009074b588e8d HEAD | sort > "$RUNNER_TEMP/actual"
          printf '%s\n' \
            .github/workflows/pathb-query05-pdf-readable-nondeploy.yml \
            backend/src/FieldVisit.Infrastructure/ReportDocumentService.cs \
            backend/tests/FieldVisit.Application.Tests/PathBQuery05PdfReadabilityTests.cs \
            | sort > "$RUNNER_TEMP/expected"
          diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/actual"
          echo 'EXACT_API_SOURCE_AND_PDF_SCOPE=PASS'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install CJK font for production PDF renderer
        shell: bash
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk >/dev/null
      - name: Restore, build, and execute full backend test regression
        shell: bash
        env:
          PATHB_PDF_VERIFY_DIR: /tmp/query05-pdfs
        run: |
          set -euo pipefail
          dotnet restore backend/tests/FieldVisit.Application.Tests/FieldVisit.Application.Tests.csproj
          dotnet build backend/src/FieldVisit.Api/FieldVisit.Api.csproj -c Release --no-restore
          dotnet test backend/tests/FieldVisit.Application.Tests/FieldVisit.Application.Tests.csproj -c Release --no-restore --logger 'console;verbosity=normal'
      - name: Preserve generated NONDEPLOY PDF fixture bytes for visual QA
        uses: actions/upload-artifact@v4
        with:
          name: pathb-query05-readable-pdf-test-fixtures
          path: /tmp/query05-pdfs/*.pdf
          if-no-files-found: error
          retention-days: 7
      - name: Inspect actual PDF bytes for print readability, totals and page integrity
        shell: bash
        env:
          PATHB_PDF_VERIFY_DIR: /tmp/query05-pdfs
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/pdf-check-venv"
          "$RUNNER_TEMP/pdf-check-venv/bin/pip" install --quiet pymupdf==1.26.6
          "$RUNNER_TEMP/pdf-check-venv/bin/python" - <<'PY'
          import os
          import pathlib
          import unicodedata
          import pymupdf
          d = pathlib.Path(os.environ["PATHB_PDF_VERIFY_DIR"])
          expected = {
              "query05_11_rows.pdf": (11, 2),
              "query05_73_rows_long_route.pdf": (73, 6),
              "query05_no_rows.pdf": (0, 1),
          }
          for file, (count, min_pages) in expected.items():
              path = d / file
              assert path.is_file() and path.stat().st_size > 1000, file
              with pymupdf.open(path) as doc:
                  assert len(doc) >= min_pages, (file, len(doc))
                  text = unicodedata.normalize("NFKC", "\n".join(p.get_text() for p in doc))
                  assert f"總筆數:{count}" in text, (file, "count missing")
                  assert "核定總里程" in text and "補助總金額" in text, file
                  if count:
                      assert "T20261124160346544" in text, file
                      for i in range(2, count + 1):
                          assert f"T20261123{i:09d}" in text, (file, i)
                      assert "27.38" in text
                  else:
                      assert "查無符合條件的行程" in text
                  spans = []
                  for page in doc:
                      assert abs(page.rect.width - 841.89) < 1
                      assert abs(page.rect.height - 595.28) < 1
                      for block in page.get_text("dict")["blocks"]:
                          if "lines" not in block:
                              continue
                          for line in block["lines"]:
                              for span in line["spans"]:
                                  if not span["text"].strip():
                                      continue
                                  spans.append(span)
                                  assert span["size"] >= 9.95, (file, span["size"], span["text"])
                                  x0,y0,x1,y1 = span["bbox"]
                                  assert 6 <= x0 and x1 <= page.rect.width - 6, (file, span["text"], span["bbox"])
                                  assert 6 <= y0 and y1 <= page.rect.height - 6, (file, span["text"], span["bbox"])
                  assert spans, file
                  print(f"PDF={file} PAGES={len(doc)} RECORDS={count} MIN_FONT={min(s['size'] for s in spans):.2f} PASS")
          print("PDF_MIN_10PT=PASS")
          print("PDF_ALL_TRIPNOS_AND_TOTALS=PASS")
          print("PDF_NO_PAGE_OVERFLOW=PASS")
          PY
      - name: Prove no API, SQL, Azure or frontend deployment
        run: |
          echo 'MODE=NONDEPLOY'
          echo 'API_DEPLOY=NOT_AUTHORIZED'
          echo 'SQL=NOT_AUTHORIZED'
          echo 'SWA_DEPLOY=NOT_AUTHORIZED'
          echo 'UAT_WRITE=NOT_AUTHORIZED'
