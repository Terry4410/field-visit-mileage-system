name: G1 SCM ARM6 source offline NONDEPLOY
on:
  push:
    branches: [work/g1-arm6-readonly-source-20261024]
    paths: ['scripts/ci/g1_arm6/**', 'docs/release/g1-arm6/**', '.github/workflows/g1-scm-arm6-readonly.yml', '.github/workflows/g1-arm6-offline.yml', '.github/workflows/g1-arm6-worker.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: All synthetic no-network bounded ARM/OIDC tests
        run: |
          set -euo pipefail
          mkdir -p verification
          sha256sum --check scripts/ci/g1_bounded/checksums.sha256
          sha256sum --check scripts/ci/g1_arm6/checksums.sha256
          python3 -m unittest discover -s scripts/ci/g1_arm6 -p 'test_*.py' -v > verification/arm6-offline.txt 2>&1
          git rev-parse HEAD > verification/source-sha.txt
          git diff --name-status 0e4ede50141e5d7456f84fde9000db8c01c3b59e HEAD > verification/source-delta.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: g1-arm6-offline-${{ github.sha }}
          path: verification/
          retention-days: 30
